<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Letterhome</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#fafafa;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#ffffff;border:1px solid #ececec;border-radius:0;padding:48px 40px;width:100%;max-width:380px}
.logo{margin-bottom:36px}
.logo-text{color:#111111;font-size:22px;font-weight:600;letter-spacing:-0.025em;font-family:Georgia,serif}
.logo-sub{color:#6b6b6b;font-size:10px;margin-top:6px;text-transform:uppercase;letter-spacing:0.18em;font-family:'DM Mono',ui-monospace,monospace}
h1{color:#111111;font-size:18px;font-weight:600;margin-bottom:4px;letter-spacing:-0.015em;display:none}
.subtitle{color:#6b6b6b;font-size:13px;margin-bottom:32px;font-family:'DM Mono',ui-monospace,monospace;text-transform:uppercase;letter-spacing:0.12em}
.error{background:transparent;border:1px solid #e63946;color:#e63946;padding:10px 14px;border-radius:0;font-size:12px;margin-bottom:20px;font-family:'DM Mono',ui-monospace,monospace;text-transform:uppercase;letter-spacing:0.08em}
label{display:block;color:#6b6b6b;font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:0.12em;margin-bottom:8px;font-family:'DM Mono',ui-monospace,monospace}
input{width:100%;background:transparent;border:none;border-bottom:1.5px solid #111111;border-radius:0;padding:10px 0;color:#111111;font-size:15px;outline:none;transition:border-color 0.2s;margin-bottom:22px;font-family:inherit}
input:focus{border-bottom-color:#e63946}
button{width:100%;background:#111111;color:#ffffff;border:none;border-radius:0;padding:13px;font-size:12px;font-weight:600;cursor:pointer;letter-spacing:0.15em;margin-top:8px;text-transform:uppercase;transition:background 0.2s;font-family:'DM Mono',ui-monospace,monospace}
button:hover{background:#e63946}
.helper{color:#9a9a9a;font-weight:400;text-transform:none;letter-spacing:0;font-size:10px;font-family:'Inter',system-ui,sans-serif}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-text">Letterhome</div>
    <div class="logo-sub">Admin · Restricted</div>
  </div>
  <p class="subtitle">Sign in</p>
  <div id="err" class="error" style="display:none">Incorrect username, password, or 2FA code</div>
  <form method="POST" action="/admin/login">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <label for="code">2FA Code <span class="helper">(if enabled)</span></label>
    <input id="code" name="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="123456">
    <button type="submit">Sign in →</button>
  </form>
</div>
<script>
  if (window.location.search.includes('error=1'))
    document.getElementById('err').style.display = 'block';
</script>
</body>
</html>
