<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Letterhome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="/fonts.css">
<script>(function(){try{var t=localStorage.getItem('lh-admin-theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#fafafa;color:#111111;min-height:100vh;display:flex;font-size:14px;line-height:1.5}
/* ── Dark mode overrides ── */
html[data-theme="dark"] body{background:#0a0a0a;color:#f5f5f5}
html[data-theme="dark"] .sidebar{background:#0a0a0a;border-right-color:rgba(255,255,255,0.08)}
html[data-theme="dark"] .sidebar-logo{border-bottom-color:rgba(255,255,255,0.08)}
html[data-theme="dark"] .sidebar-footer{border-top-color:rgba(255,255,255,0.08)}
html[data-theme="dark"] .logo-text{color:#f5f5f5}
html[data-theme="dark"] .logo-sub{color:#ff7a82}
html[data-theme="dark"] .nav-label{color:#666}
html[data-theme="dark"] .nav-link{color:#9a9a9a}
html[data-theme="dark"] .nav-link:hover{color:#f5f5f5;background:rgba(255,255,255,0.04)}
html[data-theme="dark"] .nav-link.active{color:#ff7a82;background:transparent;border-left-color:#ff7a82}
html[data-theme="dark"] .topbar{background:transparent;border-bottom-color:rgba(255,255,255,0.08)}
html[data-theme="dark"] .topbar-title{color:#f5f5f5}
html[data-theme="dark"] .topbar-user{color:#9a9a9a}
html[data-theme="dark"] .stat-card,html[data-theme="dark"] .card,html[data-theme="dark"] .detail-card{background:#141414;border-color:rgba(255,255,255,0.08)}
html[data-theme="dark"] .stat-value,html[data-theme="dark"] .card-title,html[data-theme="dark"] .detail-value,html[data-theme="dark"] .page-title{color:#f5f5f5}
html[data-theme="dark"] .stat-label,html[data-theme="dark"] .stat-sub,html[data-theme="dark"] .detail-card-title,html[data-theme="dark"] .detail-label,html[data-theme="dark"] .topbar-user,html[data-theme="dark"] .empty,html[data-theme="dark"] .back-link,html[data-theme="dark"] .field label{color:#9a9a9a}
html[data-theme="dark"] .card-header,html[data-theme="dark"] .detail-row,html[data-theme="dark"] .note-item{border-bottom-color:rgba(255,255,255,0.06)}
html[data-theme="dark"] th{background:transparent;color:#9a9a9a;border-bottom-color:rgba(255,255,255,0.4)}
html[data-theme="dark"] td{color:#d0d0d0;border-bottom-color:rgba(255,255,255,0.06)}
html[data-theme="dark"] tr:hover td{background:rgba(255,255,255,0.03)}
html[data-theme="dark"] .address-block,html[data-theme="dark"] .note-text{color:#d0d0d0}
html[data-theme="dark"] .letter-body{background:#0a0a0a;color:#d0d0d0;border-color:rgba(255,255,255,0.08)}
html[data-theme="dark"] .filter-btn{background:transparent;color:#9a9a9a;border-color:rgba(255,255,255,0.15)}
html[data-theme="dark"] .filter-btn:hover,html[data-theme="dark"] .filter-btn.active{background:#f5f5f5;color:#0a0a0a;border-color:#f5f5f5}
html[data-theme="dark"] input[type=text],html[data-theme="dark"] input[type=email],html[data-theme="dark"] select{border-bottom-color:#f5f5f5;color:#f5f5f5}
html[data-theme="dark"] input:focus,html[data-theme="dark"] textarea:focus,html[data-theme="dark"] select:focus{border-bottom-color:#ff7a82}
html[data-theme="dark"] textarea{border-color:#f5f5f5;color:#f5f5f5;background:transparent}
html[data-theme="dark"] textarea:focus{border-color:#ff7a82}
html[data-theme="dark"] .btn-primary{background:#f5f5f5;color:#0a0a0a}
html[data-theme="dark"] .btn-primary:hover{background:#ff7a82;color:#0a0a0a}
html[data-theme="dark"] .btn-outline{color:#f5f5f5;border-color:#f5f5f5}
html[data-theme="dark"] .btn-outline:hover{background:#f5f5f5;color:#0a0a0a}
html[data-theme="dark"] .btn-ghost{color:#9a9a9a}
html[data-theme="dark"] .btn-ghost:hover{color:#ff7a82;background:transparent}
html[data-theme="dark"] .tag{background:rgba(255,255,255,0.06);color:#d0d0d0}
html[data-theme="dark"] .file-item{background:transparent;border-color:rgba(255,255,255,0.08)}
html[data-theme="dark"] .file-name{color:#d0d0d0}
html[data-theme="dark"] .note-meta{color:#6b6b6b}
html[data-theme="dark"] .back-link:hover{color:#ff7a82}
html[data-theme="dark"] .badge,html[data-theme="dark"] .badge-blue,html[data-theme="dark"] .badge-amber,html[data-theme="dark"] .badge-violet{color:#f5f5f5;border-color:rgba(255,255,255,0.5);background:transparent}
html[data-theme="dark"] .badge-gray{color:#9a9a9a;border-color:rgba(255,255,255,0.3)}
html[data-theme="dark"] .badge-green{color:#ff7a82;border-color:#ff7a82}
/* Admin theme toggle */
.admin-theme-toggle{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:0;color:#6b6b6b;font-size:10px;font-family:'DM Mono',ui-monospace,monospace;text-transform:uppercase;letter-spacing:0.12em;cursor:pointer;transition:all 0.15s;border:none;background:none;width:100%;text-align:left;margin-bottom:4px}
.admin-theme-toggle:hover{color:#111111}
html[data-theme="dark"] .admin-theme-toggle{color:#9a9a9a}
html[data-theme="dark"] .admin-theme-toggle:hover{color:#f5f5f5}
.admin-theme-toggle .label-light{display:inline}
.admin-theme-toggle .label-dark{display:none}
html[data-theme="dark"] .admin-theme-toggle .label-light{display:none}
html[data-theme="dark"] .admin-theme-toggle .label-dark{display:inline}

/* ── Sidebar (light, editorial — matches login.html DNA) ── */
.sidebar{width:240px;min-height:100vh;background:#ffffff;border-right:1px solid #ececec;display:flex;flex-direction:column;flex-shrink:0;position:fixed;top:0;left:0;bottom:0}
.sidebar-logo{padding:32px 28px 24px;border-bottom:1px solid #ececec}
.sidebar-logo-inner{display:flex;flex-direction:column;gap:8px}
.logo-mark{display:none}
.logo-text{color:#111111;font-size:22px;font-weight:600;letter-spacing:-0.025em;font-family:Georgia,serif;line-height:1}
.logo-sub{color:#e63946;font-size:10px;font-family:'DM Mono',ui-monospace,monospace;text-transform:uppercase;letter-spacing:0.18em;margin-top:4px}
.sidebar-nav{flex:1;padding:24px 16px;overflow-y:auto}
.nav-label{color:#9a9a9a;font-family:'DM Mono',ui-monospace,monospace;font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:0.22em;padding:0 8px;margin:20px 0 10px}
.nav-label:first-child{margin-top:0}
.nav-link{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 14px;border-radius:0;color:#2a2a2a;font-family:'DM Mono',ui-monospace,monospace;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.1em;text-decoration:none;cursor:pointer;transition:all 0.15s;margin-bottom:1px;border:none;border-left:2px solid transparent;background:none;width:100%;text-align:left}
.nav-link:hover{color:#111111;background:#fafafa}
.nav-link.active{color:#e63946;background:transparent;border-left-color:#e63946}
.nav-icon{font-size:13px;width:18px;text-align:center;color:#9a9a9a}
.nav-link.active .nav-icon{color:#e63946}
.sidebar-footer{padding:16px 16px 24px;border-top:1px solid #ececec}
.logout-btn{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:0;color:#6b6b6b;font-size:10px;font-family:'DM Mono',ui-monospace,monospace;text-transform:uppercase;letter-spacing:0.12em;cursor:pointer;transition:all 0.15s;border:none;background:none;width:100%}
.logout-btn:hover{color:#e63946}

/* ── Content ── */
.content{margin-left:240px;flex:1;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:transparent;border-bottom:1px solid #ececec;padding:0 36px;height:72px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-title{font-size:20px;font-weight:600;color:#111111;letter-spacing:-0.02em;font-family:Georgia,serif}
.topbar-user{font-size:10px;color:#6b6b6b;font-family:'DM Mono',ui-monospace,monospace;text-transform:uppercase;letter-spacing:0.12em}
.main{padding:36px;flex:1;max-width:1400px}

/* ── Cards & Stats ── */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-bottom:36px;background:#ececec;border:1px solid #ececec}
.stat-card{background:#ffffff;border:none;border-radius:0;padding:24px 24px 20px}
.stat-label{font-size:9px;color:#6b6b6b;font-weight:500;text-transform:uppercase;letter-spacing:0.15em;margin-bottom:10px;font-family:'DM Mono',ui-monospace,monospace}
.stat-value{font-size:30px;font-weight:600;color:#111111;letter-spacing:-0.03em;font-family:Georgia,serif;line-height:1.05}
.stat-sub{font-size:10px;color:#9a9a9a;margin-top:8px;font-family:'DM Mono',ui-monospace,monospace;text-transform:uppercase;letter-spacing:0.12em}
.card{background:#ffffff;border:1px solid #ececec;border-radius:0;overflow:hidden;margin-bottom:28px}
.card-header{padding:20px 24px;border-bottom:1px solid #ececec;display:flex;align-items:center;justify-content:space-between}
.card-title{font-family:'DM Mono',ui-monospace,monospace;font-size:10px;font-weight:600;color:#111111;text-transform:uppercase;letter-spacing:0.18em}
/* ── Tables ── */
table{width:100%;border-collapse:collapse}
th{padding:12px 16px;text-align:left;font-size:9px;font-weight:600;color:#6b6b6b;text-transform:uppercase;letter-spacing:0.18em;background:transparent;border-bottom:1.5px solid #111111;font-family:'DM Mono',ui-monospace,monospace}
td{padding:14px 16px;font-size:13px;color:#2a2a2a;border-bottom:1px solid #ececec;vertical-align:top}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafa}
.link{color:#e63946;text-decoration:none;font-weight:500;cursor:pointer;background:none;border:none;font-size:13px;padding:0;font-family:inherit}
.link:hover{text-decoration:underline}

/* ── Status badges (monochrome with bracket markers) ── */
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:0;font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;border:1px solid #111111;background:transparent;color:#111111;font-family:'DM Mono',ui-monospace,monospace}
.badge-gray{color:#6b6b6b;border-color:#9a9a9a}
.badge-blue,.badge-amber,.badge-violet{color:#111111;border-color:#111111}
.badge-green{color:#e63946;border-color:#e63946}

/* ── Forms & Inputs ── */
.form-row{display:flex;gap:16px;align-items:flex-end;margin-bottom:20px}
.field{display:flex;flex-direction:column;gap:8px;flex:1}
.field label{font-family:'DM Mono',ui-monospace,monospace;font-size:10px;font-weight:500;color:#6b6b6b;text-transform:uppercase;letter-spacing:0.15em}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],textarea,select{width:100%;border:none;border-bottom:1.5px solid #111111;border-radius:0;padding:10px 2px;font-size:14px;color:#111111;outline:none;font-family:inherit;background:transparent;transition:border-color 0.15s}
input:focus,textarea:focus,select:focus{border-bottom-color:#e63946}
textarea{resize:vertical;min-height:120px;border:1px solid #111111;padding:12px 14px;font-family:Georgia,serif;font-size:14px;line-height:1.55}
.btn{padding:12px 24px;border-radius:0;font-size:10px;font-weight:600;cursor:pointer;border:none;transition:all 0.15s;letter-spacing:0.18em;text-transform:uppercase;font-family:'DM Mono',ui-monospace,monospace;display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:#111111;color:#ffffff}
.btn-primary:hover{background:#e63946;color:#ffffff}
.btn-outline{background:transparent;color:#111111;border:1px solid #111111}
.btn-outline:hover{background:#111111;color:#ffffff}
.btn-sm{padding:7px 14px;font-size:9px;letter-spacing:0.15em}
.btn-ghost{background:none;border:none;color:#6b6b6b;cursor:pointer;font-size:10px;padding:6px 10px;border-radius:0;font-family:'DM Mono',ui-monospace,monospace;text-transform:uppercase;letter-spacing:0.15em}
.btn-ghost:hover{color:#e63946;background:transparent}

/* ── Detail views ── */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:28px}
.detail-card{background:#ffffff;border:1px solid #ececec;border-radius:0;padding:24px 28px}
.detail-card-title{font-family:'DM Mono',ui-monospace,monospace;font-size:10px;font-weight:600;color:#6b6b6b;text-transform:uppercase;letter-spacing:0.18em;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid #ececec}
.detail-row{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1px solid #ececec;font-size:13px;gap:16px}
.detail-row:last-child{border-bottom:none}
.detail-label{font-family:'DM Mono',ui-monospace,monospace;font-size:10px;text-transform:uppercase;letter-spacing:0.15em;color:#6b6b6b;flex-shrink:0;line-height:1.6}
.detail-value{color:#111111;font-weight:500;text-align:right;word-break:break-word;line-height:1.5}
.address-block{font-size:13px;color:#2a2a2a;line-height:1.75;white-space:pre-line;font-family:Georgia,serif}
.letter-body{font-size:14px;color:#2a2a2a;line-height:1.7;white-space:pre-wrap;font-family:Georgia,serif;padding:24px;background:#fafafa;border-radius:0;border:1px solid #ececec;border-left:3px solid #111111}

/* ── Tags ── */
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:8px;background:transparent;color:#2a2a2a;padding:4px 10px;border-radius:0;font-size:10px;font-weight:500;border:1px solid #111111;font-family:'DM Mono',ui-monospace,monospace;text-transform:uppercase;letter-spacing:0.12em}
.tag-remove{background:none;border:none;cursor:pointer;color:#9a9a9a;font-size:14px;line-height:1;padding:0}
.tag-remove:hover{color:#e63946}

/* ── Notes ── */
.note-item{padding:14px 0;border-bottom:1px solid #ececec}
.note-item:last-child{border-bottom:none}
.note-meta{font-family:'DM Mono',ui-monospace,monospace;font-size:10px;color:#6b6b6b;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.12em}
.note-text{font-size:14px;color:#2a2a2a;line-height:1.6;font-family:Georgia,serif}

/* ── Filters ── */
.filter-row{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.filter-btn{padding:8px 14px;border-radius:0;border:1px solid #ececec;background:transparent;font-size:9px;font-weight:500;color:#6b6b6b;cursor:pointer;transition:all 0.15s;font-family:'DM Mono',ui-monospace,monospace;text-transform:uppercase;letter-spacing:0.15em}
.filter-btn:hover{color:#111111;border-color:#111111}
.filter-btn.active{background:#111111;color:#ffffff;border-color:#111111}

/* ── Misc ── */
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;padding-bottom:20px;border-bottom:1px solid #ececec}
.page-title{font-size:28px;font-weight:600;color:#111111;letter-spacing:-0.025em;font-family:Georgia,serif;line-height:1.1}
.empty{text-align:center;padding:60px 20px;color:#6b6b6b;font-size:13px;font-family:'DM Mono',ui-monospace,monospace;text-transform:uppercase;letter-spacing:0.15em}
.files-list{display:flex;flex-direction:column;gap:1px;padding:16px 20px;background:#ececec}
.file-item{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#ffffff;border:none;border-radius:0;font-size:13px}
.file-name{color:#2a2a2a;font-weight:500;font-family:'DM Mono',ui-monospace,monospace;font-size:11px;letter-spacing:0.05em}
.back-link{display:inline-flex;align-items:center;gap:6px;color:#6b6b6b;font-size:10px;cursor:pointer;background:none;border:none;margin-bottom:24px;padding:0;font-family:'DM Mono',ui-monospace,monospace;text-transform:uppercase;letter-spacing:0.15em}
.back-link:hover{color:#e63946}
/* ── Arcade cabinets ── */
.arcade-hall{display:flex;gap:30px;flex-wrap:wrap;margin-bottom:36px}
.arcade-cabinet{width:160px;cursor:pointer;user-select:none;position:relative;overflow:visible;transition:transform 0.1s steps(3),filter 0.15s}
.arcade-cabinet:hover{transform:translateY(-6px);filter:drop-shadow(0 0 16px var(--cc)) drop-shadow(0 5px 14px rgba(0,0,0,0.8))}
.arcade-cabinet.inserting .ac-screen{animation:ac-flash 0.08s steps(2) 5}
@keyframes ac-flash{0%,100%{opacity:1}50%{opacity:0.05}}
@keyframes ac-blink{0%,100%{opacity:1}50%{opacity:0}}
/* ── Marquee (gold caps + dark center) ── */
.ac-marquee{display:flex;align-items:stretch;border:2px solid #000}
.ac-mcap{width:14px;flex-shrink:0;background:#c8922a;box-shadow:inset -2px 0 0 rgba(0,0,0,0.25),inset 2px 0 0 rgba(255,255,255,0.12)}
.ac-marquee-mid{flex:1;background:#111;padding:9px 5px 8px;text-align:center;border-top:3px solid var(--cc);box-shadow:0 0 18px var(--cc) inset}
.ac-name{font-family:'Press Start 2P',monospace;font-size:6px;color:var(--cc);text-shadow:0 0 8px var(--cc),0 0 22px var(--cc);text-transform:uppercase;line-height:1.7;word-break:break-all}
.ac-sub{font-family:'Press Start 2P',monospace;font-size:4px;color:rgba(255,255,255,0.28);margin-top:5px;text-transform:uppercase;line-height:1.6}
/* ── Body (gold pillars + colored inner) ── */
.ac-body{display:flex;align-items:stretch;border:2px solid #000;margin-top:-2px;position:relative;z-index:1}
.ac-pillar{width:14px;flex-shrink:0;background:#c8922a;box-shadow:inset -3px 0 0 rgba(0,0,0,0.22),inset 3px 0 0 rgba(255,255,255,0.1)}
.ac-inner{flex:1;background:var(--cc);padding:7px 5px 5px;display:flex;flex-direction:column}
/* ── Bezel: gold frame → black frame → screen ── */
.ac-bezel{background:#c8922a;padding:5px;border:2px solid #000}
.ac-bezel-dark{background:#111;padding:3px}
.ac-screen{background:#010203;aspect-ratio:4/3;position:relative;overflow:hidden}
.ac-crt,.ac-crt-ov{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 1px,rgba(0,0,0,0.2) 1px,rgba(0,0,0,0.2) 2px);pointer-events:none;z-index:5}
.ac-vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,0.88) 100%);pointer-events:none;z-index:6}
.ac-screen-inner{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:5px;position:relative;z-index:1}
.ac-hs-lbl{font-family:'Press Start 2P',monospace;font-size:4px;color:rgba(255,255,255,0.3);text-transform:uppercase}
.ac-hs-val{font-family:'Press Start 2P',monospace;font-size:8px;color:#fff;text-shadow:0 0 8px var(--cc);margin-bottom:2px}
.ac-icon{font-size:18px;line-height:1;filter:drop-shadow(0 0 4px var(--cc))}
.ac-coin-blink{font-family:'Press Start 2P',monospace;font-size:4px;color:#ffff00;text-shadow:0 0 6px #ffff00;animation:ac-blink 1.1s step-end infinite;margin-top:5px;text-transform:uppercase}
/* Button row below screen (inside body, above control deck) */
.ac-body-btns{display:flex;justify-content:center;gap:8px;padding:5px 2px 0}
.ac-abtn{width:9px;height:9px;background:#cc2020;border:2px solid #000;border-bottom:3px solid #881010}
/* ── Control deck: wider than body, juts out each side ── */
.ac-deck{background:#6a7090;border:2px solid #000;margin:-2px -14px 0;padding:7px 14px 9px;display:flex;align-items:center;justify-content:space-around;position:relative;z-index:2}
.ac-deck-top{position:absolute;top:0;left:0;right:0;height:3px;background:#8a90b0}
/* ── Joystick (CSS pixel art) ── */
.ac-joystick{position:relative;width:18px;height:20px;flex-shrink:0}
.ac-js-base{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:14px;height:8px;background:#4a5070;border:2px solid #000}
.ac-js-shaft{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:3px;height:12px;background:#999;border-left:1px solid #666;border-right:1px solid #bbb}
.ac-js-ball{position:absolute;top:0;left:50%;transform:translateX(-50%);width:8px;height:8px;background:radial-gradient(circle at 35% 30%,#ddd,#888);border:2px solid #000;border-radius:50%}
/* Deck buttons (square, pixel art style) */
.ac-btns{display:flex;gap:5px;align-items:center}
.ac-btn{width:10px;height:10px;background:var(--cc);border:2px solid #000;border-bottom:3px solid rgba(0,0,0,0.5)}
.ac-btn-sm{width:8px;height:8px;opacity:0.65}
/* ── Kickplate with coin door ── */
.ac-kickplate{background:var(--cc);border:2px solid #000;border-top:none;padding:6px 8px 8px;display:flex;align-items:center;gap:8px}
.ac-coin-door{background:#4a5060;border:2px solid #000;padding:3px 5px;display:flex;align-items:center;justify-content:center;min-width:34px}
.ac-slot{width:14px;height:3px;background:#111;border:1px solid #333}

<script>
let currentUser = '';

// ── Router ────────────────────────────────────────────────────────────────────
async function init() {
  const me = await api('/api/admin/me');
  if (!me) { window.location.href = '/admin/login'; return; }
  currentUser = me.username;
  document.getElementById('topbar-user').textContent = me.username;
  window.addEventListener('popstate', () => route());
  startCountdownTicker();
  api('/api/admin/contacts/unread').then(d => { if (d) updateContactsBadge(d.unread); });
  route();
}

function go(path) {
  history.pushState({}, '', path);
  route();
}

function route() {
  const p = window.location.pathname;
  setActiveNav(p);
  if (p === '/admin' || p === '/admin/')           return showDashboard();
  if (p === '/admin/orders')                        return showOrders();
  if (p.match(/^\/admin\/orders\/\d+$/))            return showOrder(p.split('/').pop());
  if (p === '/admin/customers')                     return showCustomers();
  if (p.match(/^\/admin\/customers\/.+$/))          return showCustomer(decodeURIComponent(p.replace('/admin/customers/', '')));
  if (p === '/admin/accounts')                      return showAccounts();
  if (p.match(/^\/admin\/accounts\/.+$/))           return showAccount(decodeURIComponent(p.replace('/admin/accounts/', '')));
  if (p === '/admin/trash')                         return showTrash();
  if (p === '/admin/broadcast')                     return showBroadcast();
  if (p === '/admin/print-queue')                   return showPrintQueue();
  if (p === '/admin/insights')                      return showInsights();
  if (p === '/admin/visitors')                      return showVisitors();
  if (p === '/admin/stripe')                        return showStripe();
  if (p === '/admin/contacts')                      return showContacts();
  if (p === '/admin/templates')                     return showTemplates();
  if (p === '/admin/settings')                      return showSettings();
  if (p === '/admin/audit-log')                     return showAuditLog();
  if (p === '/admin/arcade')                        return showArcade();
  showDashboard();
}

function setActiveNav(p) {
  ['dashboard','orders','customers','accounts','broadcast','insights','visitors','stripe','contacts','templates','settings','audit','trash','arcade'].forEach(k => document.getElementById('nav-'+k)?.classList.remove('active'));
  if (p.startsWith('/admin/orders'))          document.getElementById('nav-orders')?.classList.add('active');
  else if (p.startsWith('/admin/accounts'))   document.getElementById('nav-accounts')?.classList.add('active');
  else if (p.startsWith('/admin/customers'))  document.getElementById('nav-customers')?.classList.add('active');
  else if (p.startsWith('/admin/broadcast'))  document.getElementById('nav-broadcast')?.classList.add('active');
  else if (p.startsWith('/admin/insights'))   document.getElementById('nav-insights')?.classList.add('active');
  else if (p.startsWith('/admin/visitors'))   document.getElementById('nav-visitors')?.classList.add('active');
  else if (p.startsWith('/admin/stripe'))     document.getElementById('nav-stripe')?.classList.add('active');
  else if (p.startsWith('/admin/contacts'))   document.getElementById('nav-contacts')?.classList.add('active');
  else if (p.startsWith('/admin/templates'))  document.getElementById('nav-templates')?.classList.add('active');
  else if (p.startsWith('/admin/settings'))   document.getElementById('nav-settings')?.classList.add('active');
  else if (p.startsWith('/admin/audit-log'))  document.getElementById('nav-audit')?.classList.add('active');
  else if (p.startsWith('/admin/trash'))      document.getElementById('nav-trash')?.classList.add('active');
  else if (p.startsWith('/admin/arcade'))     document.getElementById('nav-arcade')?.classList.add('active');
  else                                        document.getElementById('nav-dashboard')?.classList.add('active');
}

function setTitle(t) { document.getElementById('topbar-title').textContent = t; }
function setMain(html) { document.getElementById('main').innerHTML = html; }

// ── API helper ────────────────────────────────────────────────────────────────
async function api(url, opts = {}) {
  try {
    const r = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts });
    if (r.status === 401) { window.location.href = '/admin/login'; return null; }
    return r.ok ? r.json() : null;
  } catch { return null; }
}

async function post(url, body) {
  return api(url, { method: 'POST', body: JSON.stringify(body) });
}

async function del(url) {
  return api(url, { method: 'DELETE' });
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function statusBadge(s) {
  const map = {
    awaiting_payment:     ['badge-gray',   'Awaiting Payment'],
    paid:                 ['badge-blue',   'Paid'],
    submitted_to_printer: ['badge-amber',  'At Printer'],
    printing:             ['badge-amber',  'Printing'],
    mailed:               ['badge-violet', 'Mailed'],
    delivered:            ['badge-green',  'Delivered'],
    refunded:             ['badge-gray',   'Refunded'],
  };
  const [cls, label] = map[s] || ['badge-gray', s];
  return `<span class="badge ${cls}">${label}</span>`;
}

function fmtDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('en-CA', { year:'numeric', month:'short', day:'numeric' });
}

function fmtDateTime(d) {
  if (!d) return '—';
  return new Date(d).toLocaleString('en-CA', {
    month:'short', day:'numeric', year:'numeric',
    hour:'numeric', minute:'2-digit'
  });
}

function fmtCAD(cents) {
  return '$' + (cents / 100).toFixed(2) + ' CAD';
}

// ── 24h fulfillment countdown ─────────────────────────────────────────────────
function timeLeftHTML(createdAt, status) {
  if (status === 'mailed' || status === 'delivered')
    return `<span data-countdown-created="${createdAt}" data-countdown-status="${status}" style="color:#6b6b6b;font-size:12px">Completed</span>`;
  if (status === 'awaiting_payment')
    return `<span data-countdown-created="${createdAt}" data-countdown-status="${status}" style="color:#9a9a9a;font-size:12px">—</span>`;

  const deadline  = new Date(createdAt).getTime() + 24 * 3600000;
  const remaining = deadline - Date.now();
  const h = Math.floor(Math.abs(remaining) / 3600000);
  const m = Math.floor((Math.abs(remaining) % 3600000) / 60000);

  let color, text;
  if (remaining < 0)                  { color='#e63946'; text=`⚠ Overdue ${h}h ${m}m`; }
  else if (remaining < 4 * 3600000)   { color='#e63946'; text=`${h}h ${m}m left`; }
  else if (remaining < 12 * 3600000)  { color='#d97706'; text=`${h}h ${m}m left`; }
  else                                { color='#16a34a'; text=`${h}h ${m}m left`; }
  return `<span data-countdown-created="${createdAt}" data-countdown-status="${status}" style="color:${color};font-weight:600;font-size:12px">${text}</span>`;
}

function slaBanner(createdAt, status) {
  if (status === 'mailed' || status === 'delivered' || status === 'awaiting_payment') return '';
  const deadline  = new Date(createdAt).getTime() + 24 * 3600000;
  const remaining = deadline - Date.now();
  const h = Math.floor(Math.abs(remaining) / 3600000);
  const m = Math.floor((Math.abs(remaining) % 3600000) / 60000);

  let bg, color, icon, text;
  if (remaining < 0)                  { bg='#fef2f2'; color='#991b1b'; icon='⚠'; text=`Overdue by ${h}h ${m}m — mail this order immediately.`; }
  else if (remaining < 4 * 3600000)   { bg='#fef2f2'; color='#991b1b'; icon='⚠'; text=`${h}h ${m}m left to mail this order.`; }
  else if (remaining < 12 * 3600000)  { bg='#fffbeb'; color='#92400e'; icon='⏱'; text=`${h}h ${m}m left to mail this order.`; }
  else                                { bg='#f0fdf4'; color='#166534'; icon='✓'; text=`${h}h ${m}m left to mail this order.`; }
  return `<div data-sla-created="${createdAt}" data-sla-status="${status}" style="background:${bg};color:${color};padding:14px 20px;border-radius:0;margin-bottom:20px;font-size:14px;display:flex;align-items:center;gap:12px;border:1px solid ${color}33">
    <span style="font-size:18px">${icon}</span>
    <span><strong>24-hour fulfillment SLA — </strong>${text}</span>
  </div>`;
}

function startCountdownTicker() {
  setInterval(() => {
    document.querySelectorAll('[data-countdown-created]').forEach(el => {
      const created = el.dataset.countdownCreated;
      const status  = el.dataset.countdownStatus;
      const tmp = document.createElement('div');
      tmp.innerHTML = timeLeftHTML(created, status);
      el.replaceWith(tmp.firstElementChild);
    });
    document.querySelectorAll('[data-sla-created]').forEach(el => {
      const created = el.dataset.slaCreated;
      const status  = el.dataset.slaStatus;
      const tmp = document.createElement('div');
      tmp.innerHTML = slaBanner(created, status);
      if (tmp.firstElementChild) el.replaceWith(tmp.firstElementChild);
    });
  }, 60000);
}

// ── Dashboard ─────────────────────────────────────────────────────────────────
let dashChartPeriod = 'monthly';

async function showDashboard() {
  setTitle('Dashboard');
  const [stats, paidOrders, submittedOrders, chartData, geoData, stripeOv, health] = await Promise.all([
    api('/api/admin/stats'),
    api('/api/admin/orders?status=paid'),
    api('/api/admin/orders?status=submitted_to_printer'),
    api('/api/admin/stats/chart?period=monthly'),
    api('/api/admin/stats/geo'),
    api('/api/admin/stripe/overview'),
    api('/api/admin/server-health'),
  ]);
  if (!stats) return;

  renderDashboard(stats, paidOrders, submittedOrders, chartData, geoData, 'monthly', stripeOv, health);
}

async function reloadDashChart(period) {
  dashChartPeriod = period;
  const chartData = await api('/api/admin/stats/chart?period=' + period);
  const container = document.getElementById('dash-chart-container');
  if (container && chartData) container.innerHTML = renderBarChart(chartData, 120);
  document.querySelectorAll('.dash-period-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.period === period);
  });
}

function renderBarChart(data, maxBarPx) {
  if (!data || !data.length) return '<div class="empty" style="padding:20px">No data yet.</div>';
  const maxRev = Math.max(...data.map(d => d.revenue_cents), 1);
  const bars = data.map(d => {
    const h = Math.max(4, Math.round((d.revenue_cents / maxRev) * maxBarPx));
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:0">
      <span style="font-size:10px;color:#6b6b6b">${fmtCAD(d.revenue_cents).replace(' CAD','')}</span>
      <div style="width:100%;height:${h}px;background:#a8472d;border-radius:2px 2px 0 0;min-height:4px" title="${d.label}: ${d.orders} orders, ${fmtCAD(d.revenue_cents)}"></div>
      <span style="font-size:10px;color:#9a9a9a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%">${esc(d.label)}</span>
    </div>`;
  }).join('');
  return `<div style="display:flex;align-items:flex-end;gap:4px;height:${maxBarPx + 50}px;padding:0 4px">${bars}</div>`;
}

async function sendPnlDigest() {
  const month = new Date().toISOString().slice(0, 7);
  const r = await post('/api/admin/pnl-digest', { month });
  if (r?.ok) alert('P&L digest sent to ' + (window._operatorEmail || 'operator email'));
  else alert('Error: ' + (r?.error || 'unknown'));
}

function renderDashboard(stats, paidOrders, submittedOrders, chartData, geoData, period, stripeOv, health) {
  const queueRows = [...(paidOrders || []), ...(submittedOrders || [])]
    .sort((a,b) => new Date(a.created_at) - new Date(b.created_at))
    .map(o => `
    <tr>
      <td><button class="link" onclick="go('/admin/orders/${o.id}')">#${o.id}</button></td>
      <td>${fmtDateTime(o.created_at)}</td>
      <td>${esc(o.recipient_name)}</td>
      <td>${o.destination_country || '—'}</td>
      <td>${statusBadge(o.status)}</td>
      <td>${timeLeftHTML(o.created_at, o.status)}</td>
      <td>${fmtCAD(o.price_cents)}</td>
      <td><button class="btn btn-primary btn-sm" onclick="go('/admin/orders/${o.id}')">Action →</button></td>
    </tr>`).join('');

  const seg = stats.segments || {};
  const geoFromRows = (geoData?.from || []).slice(0,5).map(r => `<tr><td>${esc(r.country||'—')}</td><td>${r.orders}</td></tr>`).join('');
  const geoToRows   = (geoData?.to   || []).slice(0,5).map(r => `<tr><td>${esc(r.country||'—')}</td><td>${r.orders}</td></tr>`).join('');

  setMain(`
    <div class="stats-grid" style="grid-template-columns:repeat(5,1fr)">
      <div class="stat-card">
        <div class="stat-label">Paid Orders</div>
        <div class="stat-value">${stats.paid}</div>
        <div class="stat-sub">${stats.total} total · ${stats.customers} customers</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Gross Revenue</div>
        <div class="stat-value">${fmtCAD(stats.revenue)}</div>
        <div class="stat-sub">before fees &amp; costs</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Net Profit</div>
        <div class="stat-value" style="color:#16a34a">${fmtCAD(stats.net)}</div>
        <div class="stat-sub">after fees &amp; costs</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Avg / Order</div>
        <div class="stat-value">${stats.paid ? fmtCAD(Math.round(stats.net / stats.paid)) : '$0.00 CAD'}</div>
        <div class="stat-sub">net per letter</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Repeat Rate</div>
        <div class="stat-value">${stats.repeat_rate ?? 0}%</div>
        <div class="stat-sub">of customers reordered</div>
      </div>
    </div>
    ${stripeOv ? `<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px">
      <div class="stat-card" style="cursor:pointer" onclick="go('/admin/stripe')">
        <div class="stat-label">Stripe Available</div>
        <div class="stat-value" style="color:#16a34a;font-size:22px">$${(stripeOv.available/100).toFixed(2)}</div>
        <div class="stat-sub">${stripeOv.currency}</div>
      </div>
      <div class="stat-card" style="cursor:pointer" onclick="go('/admin/stripe')">
        <div class="stat-label">Stripe Pending</div>
        <div class="stat-value" style="font-size:22px">$${(stripeOv.pending/100).toFixed(2)}</div>
        <div class="stat-sub">in transit</div>
      </div>
      <div class="stat-card" style="cursor:pointer${stripeOv.openDisputeCount > 0 ? ';border-left:3px solid #e63946' : ''}" onclick="go('/admin/stripe')">
        <div class="stat-label">Open Disputes</div>
        <div class="stat-value" style="font-size:22px;color:${stripeOv.openDisputeCount > 0 ? '#e63946' : '#16a34a'}">${stripeOv.openDisputeCount}</div>

      </div>

        <div class="stat-label">Last Payout</div>

    ${health ? `<div style="background:#fff;border:1px solid #ececec;border-radius:0;padding:12px 20px;margin-bottom:24px;display:flex;gap:32px;align-items:center;font-size:12px;color:#6b6b6b;flex-wrap:wrap">

      <span>Node: <strong>${esc(health.nodeVersion)}</strong></span>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px">
      <div class="card">

            <span class="detail-value" style="color:#e63946">−${fmtCAD(stats.stripe_fees)}</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Print &amp; Postage <span style="color:#9a9a9a;font-size:11px">($6 CA · $12 intl)</span></span>
            <span class="detail-value" style="color:#e63946">−${fmtCAD(stats.cogs)}</span>
          </div>
          <div class="detail-row" style="border-top:2px solid #ececec;margin-top:6px;padding-top:14px">

// ── Orders list ───────────────────────────────────────────────────────────────
let orderFilter = '';
let allOrders   = [];

async function showOrders(filter) {
  if (filter !== undefined) orderFilter = filter;
  setTitle('Orders');
  const url = orderFilter ? `/api/admin/orders?status=${orderFilter}` : '/api/admin/orders';
  allOrders = await api(url) || [];

  const statuses = ['','awaiting_payment','paid','submitted_to_printer','printing','mailed','delivered'];
  const labels   = ['All','Awaiting','Paid','At Printer','Printing','Mailed','Delivered'];
  const filters  = statuses.map((s,i) => `<button class="filter-btn ${orderFilter===s?'active':''}" onclick="showOrders('${s}')">${labels[i]}</button>`).join('');

  setMain(`
    <div class="page-header">
      <div class="page-title">Orders</div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-outline btn-sm" onclick="showPrintQueue()">🖨 Print Queue</button>
        <a class="btn btn-outline btn-sm" href="/api/admin/orders/csv" download>↓ Export CSV</a>
      </div>
    </div>
    <div class="filter-row" style="justify-content:space-between;align-items:center">
      <div style="display:flex;gap:8px;flex-wrap:wrap">${filters}</div>
      <input type="text" id="order-search" placeholder="Search name, email, #ID…" style="width:220px;padding:6px 10px;border:1px solid #ececec;border-radius:0;font-size:13px" oninput="renderOrdersTable()">
    </div>
    <div id="bulk-bar" style="display:none;background:#f5f5f5;border:1px solid #ececec;border-radius:0;padding:10px 16px;margin-bottom:12px;display:none;align-items:center;gap:12px">
      <span id="bulk-count" style="font-size:13px;color:#6b6b6b"></span>
      <select id="bulk-status-select" style="font-size:13px;border:1px solid #ececec;border-radius:0;padding:5px 8px">
        <option value="">Set status…</option>
        <option value="paid">Paid</option>
        <option value="submitted_to_printer">At Printer</option>
        <option value="printing">Printing</option>
        <option value="mailed">Mailed</option>
        <option value="delivered">Delivered</option>
        <option value="refunded">Refunded</option>
      </select>
      <button class="btn btn-primary btn-sm" onclick="applyBulkStatus()">Apply</button>
      <button class="btn btn-outline btn-sm" onclick="confirmBulkDelete()" style="margin-left:auto;color:#e63946;border-color:#e63946">Delete selected</button>
      <button class="btn btn-outline btn-sm" onclick="clearSelection()">Clear</button>
    </div>
    <div class="card">
      <table>
        <thead><tr>
          <th style="width:36px"><input type="checkbox" id="select-all" onchange="toggleSelectAll(this.checked)"></th>
          <th>#</th><th>Submitted</th><th>Recipient</th><th>Destination</th><th>Status</th><th>Time Left</th><th>Price</th><th></th>
        </tr></thead>
        <tbody id="orders-tbody"></tbody>
      </table>
    </div>`);

  renderOrdersTable();
}

function renderOrdersTable() {
  const q = (document.getElementById('order-search')?.value || '').toLowerCase();
  const filtered = q
    ? allOrders.filter(o =>
        String(o.id).includes(q) ||
        (o.recipient_name  || '').toLowerCase().includes(q) ||
        (o.customer_email  || '').toLowerCase().includes(q) ||
        (o.destination_country || '').toLowerCase().includes(q))
    : allOrders;

  const rows = filtered.map(o => `
    <tr>
      <td><input type="checkbox" class="order-cb" value="${o.id}" onchange="updateBulkBar()"></td>
      <td><button class="link" onclick="go('/admin/orders/${o.id}')">#${o.id}</button></td>
      <td>${fmtDateTime(o.created_at)}</td>
      <td>${esc(o.recipient_name)}</td>
      <td>${esc(o.recipient_city||'')}${o.recipient_city&&o.destination_country?', ':''}${o.destination_country||''}</td>
      <td>${statusBadge(o.status)}</td>
      <td>${timeLeftHTML(o.created_at, o.status)}</td>
      <td>${fmtCAD(o.price_cents)}</td>
      <td><button class="link" onclick="go('/admin/orders/${o.id}')">View →</button></td>
    </tr>`).join('');

  const tbody = document.getElementById('orders-tbody');
  if (tbody) tbody.innerHTML = rows || '<tr><td colspan="9" class="empty">No orders.</td></tr>';
}

function toggleSelectAll(checked) {
  document.querySelectorAll('.order-cb').forEach(cb => cb.checked = checked);
  updateBulkBar();
}

function updateBulkBar() {
  const selected = document.querySelectorAll('.order-cb:checked');
  const bar = document.getElementById('bulk-bar');
  const count = document.getElementById('bulk-count');
  if (!bar) return;
  if (selected.length > 0) {
    bar.style.display = 'flex';
    count.textContent = `${selected.length} order${selected.length>1?'s':''} selected`;
  } else {
    bar.style.display = 'none';
  }
}

function clearSelection() {
  document.querySelectorAll('.order-cb').forEach(cb => cb.checked = false);
  const sa = document.getElementById('select-all');
  if (sa) sa.checked = false;
  updateBulkBar();
}

async function applyBulkStatus() {
  const status = document.getElementById('bulk-status-select').value;
  if (!status) return alert('Choose a status first.');
  const ids = [...document.querySelectorAll('.order-cb:checked')].map(cb => Number(cb.value));
  if (!ids.length) return;
  if (!confirm(`Mark ${ids.length} order(s) as "${status}"?`)) return;
  const r = await post('/api/admin/orders/bulk-status', { ids, status });
  if (r?.ok) { showOrders(); }
  else alert('Error: ' + (r?.error || 'unknown'));
}

function confirmBulkDelete() {
  const ids = [...document.querySelectorAll('.order-cb:checked')].map(cb => Number(cb.value));
  if (!ids.length) return;
  const modal = document.getElementById('bulk-delete-modal');
  document.getElementById('bulk-delete-count').textContent = ids.length;
  const input = document.getElementById('bulk-delete-input');
  const btn   = document.getElementById('bulk-delete-confirm');
  input.value = '';
  btn.disabled = true;
  modal.style.display = 'flex';
  setTimeout(() => input.focus(), 30);
}

function closeBulkDeleteModal() {
  document.getElementById('bulk-delete-modal').style.display = 'none';
}

function onBulkDeleteInput(v) {
  document.getElementById('bulk-delete-confirm').disabled = (String(v || '').trim().toLowerCase() !== 'delete');
}

async function runBulkDelete() {
  const input = document.getElementById('bulk-delete-input');
  if (String(input.value || '').trim().toLowerCase() !== 'delete') return;
  const ids = [...document.querySelectorAll('.order-cb:checked')].map(cb => Number(cb.value));
  if (!ids.length) { closeBulkDeleteModal(); return; }
  const btn = document.getElementById('bulk-delete-confirm');
  btn.disabled = true; btn.textContent = 'Deleting…';
  const r = await post('/api/admin/orders/bulk-delete', { ids });
  closeBulkDeleteModal();
  btn.textContent = 'Delete';
  if (r?.ok) showOrders();
  else alert('Error: ' + (r?.error || 'unknown'));
}

// ── Print Queue ───────────────────────────────────────────────────────────────
async function showPrintQueue() {
  setTitle('Print Queue');
  const [paid, submitted] = await Promise.all([
    api('/api/admin/orders?status=paid'),
    api('/api/admin/orders?status=submitted_to_printer'),
  ]);
  const orders = [...(paid||[]), ...(submitted||[])].sort((a,b) => new Date(a.created_at)-new Date(b.created_at));

  if (!orders.length) {
    return setMain(`
      <button class="back-link" onclick="go('/admin/orders')">← Back to Orders</button>
      <div class="empty" style="padding:60px">No orders in the queue.</div>`);
  }

  const cards = orders.map(o => {
    const toAddr = [o.recipient_name, o.recipient_street,
      [o.recipient_city, o.recipient_province, o.recipient_postal].filter(Boolean).join(' '),
      o.destination_country].filter(Boolean).join('\n');
    const fromAddr = o.skip_return ? '' : [o.sender_name, o.sender_street,
      [o.sender_city, o.sender_province, o.sender_postal].filter(Boolean).join(' '),
      o.sender_country].filter(Boolean).join('\n');
    return `<div style="border:1px solid #ececec;border-radius:0;padding:20px;break-inside:avoid;margin-bottom:16px">
      <div style="font-size:11px;color:#9a9a9a;margin-bottom:10px;font-family:monospace">ORDER #${o.id} · ${fmtDate(o.created_at)} · ${statusBadge(o.status)}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
        <div>
          <div style="font-size:10px;font-weight:600;color:#6b6b6b;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">From</div>
          <div style="font-size:13px;line-height:1.7;white-space:pre-line;color:#2a2a2a">${fromAddr ? esc(fromAddr) : '<em style="color:#9a9a9a">No return address</em>'}</div>
        </div>
        <div>
          <div style="font-size:10px;font-weight:600;color:#6b6b6b;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">To</div>
          <div style="font-size:13px;line-height:1.7;white-space:pre-line;color:#111111;font-weight:500">${esc(toAddr)}</div>
        </div>
      </div>
    </div>`;
  }).join('');

  setMain(`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px" class="no-print">
      <button class="back-link" onclick="go('/admin/orders')" style="margin:0">← Back to Orders</button>
      <div style="display:flex;gap:8px">
        <span style="font-size:13px;color:#6b6b6b;align-self:center">${orders.length} order${orders.length>1?'s':''} to mail</span>
        <button class="btn btn-primary btn-sm" onclick="window.print()">Print this page</button>
      </div>
    </div>
    <style>@media print { .no-print { display:none !important } body { background:#fff } .sidebar,.topbar,.content>.topbar { display:none !important } .content { margin:0 !important } }</style>
    ${cards}`);
}

function toggleMessageForm() {
  const f = document.getElementById('message-form');
  f.style.display = f.style.display === 'none' ? 'block' : 'none';
}

async function sendMessage(id) {
  const subject = document.getElementById('msg-subject').value.trim();
  const body    = document.getElementById('msg-body').value.trim();
  if (!subject || !body) return alert('Subject and message are required.');
  const r = await post(`/api/admin/orders/${id}/message`, { subject, body });
  if (r?.ok) {
    const s = document.getElementById('msg-status');
    s.style.display = 'inline';
    document.getElementById('msg-body').value = '';
    setTimeout(() => s.style.display = 'none', 3000);
  } else {
    alert('Could not send: ' + (r?.error || 'unknown error'));
  }
}

async function saveActualCost(id) {
  const val = parseFloat(document.getElementById('actual-cost-input').value);
  if (isNaN(val) || val < 0) return alert('Enter a valid non-negative cost.');
  const cents = Math.round(val * 100);
  const r = await post(`/api/admin/orders/${id}/actual-cost`, { actual_cost_cents: cents });
  if (r?.ok) showOrder(id);
  else alert('Error: ' + (r?.error || 'could not save'));
}

async function addOrderNote(id) {
  const note = document.getElementById('order-note-input').value.trim();
  if (!note) return;
  const r = await post(`/api/admin/orders/${id}/notes`, { note });
  if (r?.ok) showOrder(id);
  else alert('Error: ' + (r?.error || 'could not add note'));
}

function fulfillmentCard(o, statusOpts) {
  if (o.status === 'paid') {
    return `<div class="detail-card">
      <div class="detail-card-title">Fulfillment — Submit to Printer</div>
      <p style="font-size:13px;color:#6b6b6b;margin-bottom:16px;line-height:1.6">Upload this order to the printer's portal, then enter the reference number they assign.</p>
      <div class="field" style="margin-bottom:12px">
        <label>Printer Reference Number</label>
        <input id="printer-ref" type="text" placeholder="8-digit ref" maxlength="20" style="font-family:monospace">
      </div>
      <button class="btn btn-primary" onclick="submitToPrinter(${o.id})">Mark as Submitted to Printer</button>
      <div id="submit-msg" style="font-size:12px;color:#16a34a;margin-top:10px;display:none">✓ Saved — status updated to At Printer</div>
    </div>`;
  }
  if (o.status === 'submitted_to_printer') {
    return `<div class="detail-card">
      <div class="detail-card-title">Fulfillment — Mark as Mailed</div>
      <p style="font-size:13px;color:#6b6b6b;margin-bottom:16px;line-height:1.6">When the printer confirms the letter has been dropped with Canada Post, enter the estimated delivery and notify the customer.</p>
      <div class="field" style="margin-bottom:12px">
        <label>Estimated Delivery (from printer's email)</label>
        <input id="est-delivery" type="text" placeholder="e.g. 5–10 business days">
      </div>
      <button class="btn btn-primary" onclick="markMailed(${o.id})">Mark as Mailed &amp; Notify Customer</button>
      <div id="mailed-msg" style="font-size:12px;color:#16a34a;margin-top:10px;display:none">✓ Mailed — customer has been notified</div>
    </div>`;
  }
  return `<div class="detail-card">
    <div class="detail-card-title">Update Status</div>
    <div class="form-row" style="margin-bottom:0">
      <div class="field"><select id="status-select">${statusOpts}</select></div>
      <button class="btn btn-primary" onclick="updateStatus(${o.id})">Save</button>
    </div>
    <div id="status-msg" style="font-size:12px;color:#16a34a;margin-top:10px;display:none">✓ Status updated</div>
  </div>`;
}

async function submitToPrinter(id) {
  const ref = document.getElementById('printer-ref').value.trim();
  if (!ref) return alert('Enter the printer reference number first.');
  const r = await post(`/api/admin/orders/${id}/submit-to-printer`, { printer_ref: ref });
  if (r?.ok) {
    document.getElementById('submit-msg').style.display = 'block';
    setTimeout(() => showOrder(id), 1200);
  } else {
    alert('Error: ' + (r?.error || 'could not save'));
  }
}

async function markMailed(id) {
  const est = document.getElementById('est-delivery').value.trim();
  if (!est) return alert('Enter the estimated delivery from the printer\'s email.');
  if (!confirm(`Mark as mailed and send the customer a notification email with estimated delivery: "${est}"?`)) return;
  const r = await post(`/api/admin/orders/${id}/mark-mailed`, { estimated_delivery: est });
  if (r?.ok) {
    document.getElementById('mailed-msg').style.display = 'block';
    setTimeout(() => showOrder(id), 1200);
  } else {
    alert('Error: ' + (r?.error || 'could not save'));
  }
}

function downloadAllFiles(orderId, files) {
  files.forEach((f, i) => {
    setTimeout(() => {
      const a = document.createElement('a');
      a.href = `/api/admin/orders/${orderId}/files/${encodeURIComponent(f)}`;
      a.download = f;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }, i * 600);
  });
}

function updateAcctStrength() {
  const pwd = document.getElementById('acct-new-pwd')?.value || '';
  let score = 0;
  if (pwd.length >= 8)  score++;
  if (pwd.length >= 12) score++;
  if (/[A-Za-z]/.test(pwd) && /[0-9]/.test(pwd)) score++;
  if (/[!@#$%^&*()\-_=+[\]{}|;:,.<>?]/.test(pwd)) score++;
  const colors = ['#ef4444','#f97316','#eab308','#22c55e'];
  const labels = ['Too weak','Weak','Fair','Strong','Very strong'];
  const fill = document.getElementById('acct-pwd-fill');
  const lbl  = document.getElementById('acct-pwd-lbl');
  if (!fill || !lbl) return;
  fill.style.width = pwd.length === 0 ? '0' : Math.max(20, score * 25) + '%';
  fill.style.background = pwd.length === 0 ? '#9a9a9a' : colors[Math.min(score, 3)];
  lbl.textContent = pwd.length === 0 ? '' : labels[Math.min(score, 4)];
  lbl.style.color = pwd.length === 0 ? '#9a9a9a' : colors[Math.min(score, 3)];
}

async function resetCustomerPassword(encodedEmail) {
  const pwd = document.getElementById('acct-new-pwd').value;
  const msg = document.getElementById('acct-msg');
  if (!pwd) { msg.style.color = '#e63946'; msg.textContent = 'Enter a new password.'; return; }
  const r = await post(`/api/admin/customers/${encodedEmail}/reset-password`, { new_password: pwd });
  if (r?.ok) {
    msg.style.color = '#16a34a';
    msg.textContent = '✓ Password updated. Share it with the customer through a secure channel.';
    document.getElementById('acct-new-pwd').value = '';
    updateAcctStrength();
  } else {
    msg.style.color = '#e63946';
    msg.textContent = r?.error || 'Error updating password.';
  }
}

async function removeAccountFromAccountsTab(encodedEmail) {
  if (!confirm('Remove this customer account?\n\nThis clears their password and saved recipients. Their customer record and order history will be kept.')) return;
  const r = await post(`/api/admin/customers/${encodedEmail}/remove-account`, {});
  if (r?.ok) go('/admin/accounts');
  else alert(r?.error || 'Error removing account.');
}

function formatOccasionDate(mmdd) {
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const [mm, dd] = (mmdd || '').split('-').map(Number);
  if (!mm || !dd) return mmdd || '—';
  return `${monthNames[mm-1]} ${dd}`;
}

async function addOccasion(encodedEmail) {
  const occasion_name      = document.getElementById('occ-name').value.trim();
  const occasion_date      = document.getElementById('occ-date').value.trim();
  const remind_days_before = parseInt(document.getElementById('occ-days').value, 10);
  if (!occasion_name) return alert('Occasion name is required.');
  if (!/^\d{2}-\d{2}$/.test(occasion_date)) return alert('Date must be in MM-DD format, e.g. 06-15.');
  const r = await post(`/api/admin/customers/${encodedEmail}/occasions`, { occasion_name, occasion_date, remind_days_before });
  if (r?.ok) showCustomer(decodeURIComponent(encodedEmail));
  else alert('Error: ' + (r?.error || 'could not add occasion'));
}

async function deleteOccasion(id, encodedEmail) {
  if (!confirm('Delete this reminder?')) return;
  await del(`/api/admin/occasions/${id}`);
  showCustomer(decodeURIComponent(encodedEmail));
}

function loadBroadcastTemplate() {
  const sel = document.getElementById('bc-template');
  const opt = sel.options[sel.selectedIndex];
  if (!opt.value) return;
  const subject = opt.getAttribute('data-subject') || '';
  const body    = opt.getAttribute('data-body') || '';
  document.getElementById('bc-subject').value = subject.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');
  document.getElementById('bc-body').value    = body.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');
}

function toggleSaveTemplate() {
  const f = document.getElementById('save-tmpl-form');
  f.style.display = f.style.display === 'none' ? 'block' : 'none';
}

async function saveAsTemplate() {
  const name    = document.getElementById('tmpl-name').value.trim();
  const subject = document.getElementById('bc-subject').value.trim();
  const body    = document.getElementById('bc-body').value.trim();
  if (!name) return alert('Template name is required.');
  if (!subject || !body) return alert('Subject and body are required.');
  const r = await post('/api/admin/templates', { name, subject, body });
  if (r?.ok) { toggleSaveTemplate(); document.getElementById('tmpl-name').value = ''; alert('Template saved.'); }
  else alert('Error: ' + (r?.error || 'could not save'));
}

async function previewBroadcast() {
  const tag = document.getElementById('bc-tag').value;
  const r = await api('/api/admin/broadcast/preview' + (tag ? '?tag=' + encodeURIComponent(tag) : ''));
  document.getElementById('bc-count').textContent = r ? `Will send to ${r.count} ${r.count === 1 ? 'customer' : 'customers'}.` : '';
}

async function sendBroadcast() {
  const tag     = document.getElementById('bc-tag').value;
  const subject = document.getElementById('bc-subject').value.trim();
  const body    = document.getElementById('bc-body').value.trim();
  if (!subject || !body) return alert('Subject and message body are required.');
  if (!confirm('Send this broadcast? This cannot be undone.')) return;
  const r = await post('/api/admin/broadcast', { subject, body, tag: tag || null });
  const s = document.getElementById('bc-status');
  if (r?.ok) {
    s.style.color = '#16a34a';
    s.textContent = `Queued ${r.sentTo} emails — sending in background.`;
  } else {
    s.style.color = '#e63946';
    s.textContent = 'Failed: ' + (r?.error || 'unknown error');
  }
  s.style.display = 'inline';
}

const FLAG_EMOJI = cc => {
  if (!cc || cc.length !== 2) return '🌐';
  const A = 0x1F1E6, base = 'A'.charCodeAt(0);
  return String.fromCodePoint(A + cc.toUpperCase().charCodeAt(0) - base) +
         String.fromCodePoint(A + cc.toUpperCase().charCodeAt(1) - base);
};

let visitorsCFDays = 7;

async function showVisitors(cfDays) {
  if (cfDays !== undefined) visitorsCFDays = cfDays;
  setTitle('Visitors');
  setMain('<div class="empty">Loading…</div>');
  const [cf, dbStats, recent] = await Promise.all([
    api(`/api/admin/cloudflare/analytics?days=${visitorsCFDays}`),
    api('/api/admin/visitors/stats'),
    api('/api/admin/visitors/recent?limit=50'),
  ]);
  renderVisitors(cf, dbStats, recent || []);
}

function renderVisitors(cf, s, recent) {
  const fmtBytes = b => b > 1073741824 ? (b/1073741824).toFixed(1)+' GB' : b > 1048576 ? (b/1048576).toFixed(1)+' MB' : Math.round(b/1024)+' KB';

  // ── Cloudflare section ────────────────────────────────────────────────────
  let cfHtml = '';
  if (!cf || cf.configured === false) {
    cfHtml = `<div class="card" style="margin-bottom:24px;padding:20px 24px;color:#6b6b6b;font-size:13px">
      <strong>Cloudflare Analytics</strong> — not configured. Add <code>CF_API_TOKEN</code> and <code>CF_ZONE_ID</code> to your .env and restart.</div>`;
  } else if (cf.error) {
    cfHtml = `<div class="card" style="margin-bottom:24px;padding:20px 24px;color:#e63946;font-size:13px">
      Cloudflare error: ${esc(cf.error)}</div>`;
  } else {
    const t = cf.totals;
    const cachedPct = t.requests > 0 ? Math.round((t.cachedRequests / t.requests) * 100) : 0;
    const maxCF = Math.max(1, ...(cf.daily || []).map(d => d.sum?.requests || 0));
    const cfBars = (cf.daily || []).map(d => {
      const req = d.sum?.requests || 0;
      const pv  = d.sum?.pageViews || 0;
      const h   = Math.max(4, Math.round((req / maxCF) * 110));
      const pvH = Math.max(0, Math.round((pv / maxCF) * 110));
      const label = (d.dimensions?.date || '').slice(5);
      return `<div style="display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;min-width:0"
          title="${d.dimensions?.date}: ${req.toLocaleString()} requests · ${pv.toLocaleString()} page views · ${(d.uniq?.uniques||0).toLocaleString()} unique">
        <div style="width:100%;height:${h}px;background:#bfdbfe;border-radius:2px 2px 0 0;min-height:4px;position:relative">
          <div style="position:absolute;bottom:0;left:0;right:0;height:${pvH}px;background:#2563eb;border-radius:2px 2px 0 0"></div>
        </div>
        <span style="font-size:9px;color:#9a9a9a">${esc(label)}</span>
      </div>`;
    }).join('') || '<div class="empty" style="padding:20px;width:100%">No data.</div>';

    const periodBtns = [7, 14, 30].map(d =>
      `<button class="filter-btn ${visitorsCFDays===d?'active':''}" onclick="showVisitors(${d})">${d}d</button>`
    ).join('');

    cfHtml = `
    <div class="card" style="margin-bottom:24px">
      <div class="card-header">
        <div class="card-title">Cloudflare — Last ${cf.days} Days <span style="font-size:11px;color:#9a9a9a;font-weight:400;margin-left:8px">█ requests &nbsp; █ page views</span></div>
        <div style="display:flex;gap:6px">${periodBtns}</div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:0;border-bottom:1px solid #fafafa">
        <div style="padding:14px 20px;border-right:1px solid #fafafa">
          <div style="font-size:11px;color:#6b6b6b;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px">Requests</div>
          <div style="font-size:22px;font-weight:700;color:#111111">${t.requests.toLocaleString()}</div>
        </div>
        <div style="padding:14px 20px;border-right:1px solid #fafafa">
          <div style="font-size:11px;color:#6b6b6b;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px">Page Views</div>
          <div style="font-size:22px;font-weight:700;color:#111111">${t.pageViews.toLocaleString()}</div>
        </div>
        <div style="padding:14px 20px;border-right:1px solid #fafafa">
          <div style="font-size:11px;color:#6b6b6b;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px">Unique Visitors</div>
          <div style="font-size:22px;font-weight:700;color:#111111">${t.uniques.toLocaleString()}</div>
        </div>
        <div style="padding:14px 20px;border-right:1px solid #fafafa">
          <div style="font-size:11px;color:#6b6b6b;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px">Bandwidth</div>
          <div style="font-size:22px;font-weight:700;color:#111111">${fmtBytes(t.bytes)}</div>
          <div style="font-size:11px;color:#9a9a9a;margin-top:2px">${cachedPct}% cached</div>
        </div>
        <div style="padding:14px 20px">
          <div style="font-size:11px;color:#6b6b6b;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px">Threats Blocked</div>
          <div style="font-size:22px;font-weight:700;color:${t.threats > 0 ? '#e63946' : '#16a34a'}">${t.threats.toLocaleString()}</div>
        </div>
      </div>
      <div style="padding:16px 20px">
        <div style="display:flex;align-items:flex-end;gap:3px;height:130px">${cfBars}</div>
      </div>
    </div>`;
  }

  // ── App-level page detail (from our DB) ───────────────────────────────────
  let dbHtml = '';
  if (s) {
    const topPagesRows = (s.topPages || []).map(p =>
      `<tr><td style="font-family:monospace;font-size:12px">${esc(p.path)}</td><td style="text-align:right">${p.count}</td></tr>`
    ).join('') || '<tr><td colspan="2" class="empty">No page data yet.</td></tr>';

    const topCountriesRows = (s.topCountries || []).map(c =>
      `<tr><td>${FLAG_EMOJI(c.country_code)} ${esc(c.country_name || c.country_code)}</td><td style="text-align:right">${c.count}</td></tr>`
    ).join('') || '<tr><td colspan="2" class="empty">No country data yet.</td></tr>';

    const totalDevices = (s.devices || []).reduce((sum, d) => sum + d.count, 0) || 1;
    const deviceRows = (s.devices || []).map(d => {
      const pct = Math.round((d.count / totalDevices) * 100);
      return `<tr><td style="text-transform:capitalize">${esc(d.device_type || 'unknown')}</td><td style="text-align:right">${d.count} <span style="color:#9a9a9a">(${pct}%)</span></td></tr>`;
    }).join('') || '<tr><td colspan="2" class="empty">—</td></tr>';

    const browserRows = (s.browsers || []).map(b =>
      `<tr><td>${esc(b.browser)}</td><td style="text-align:right">${b.count}</td></tr>`
    ).join('') || '<tr><td colspan="2" class="empty">—</td></tr>';

    const referrerRows = (s.referrers || []).map(r =>
      `<tr><td style="font-family:monospace;font-size:12px">${esc(r.referrer)}</td><td style="text-align:right">${r.count}</td></tr>`
    ).join('') || '<tr><td colspan="2" class="empty">No referrers yet.</td></tr>';

    const recentRows = (recent || []).map(r => `
      <tr>
        <td style="white-space:nowrap;font-size:12px">${fmtDateTime(r.created_at)}</td>
        <td>${r.country_code ? FLAG_EMOJI(r.country_code) + ' ' + esc(r.country_name || r.country_code) : '<span style="color:#9a9a9a">—</span>'}</td>
        <td style="font-family:monospace;font-size:11px;color:#6b6b6b">${esc(r.ip || '')}</td>
        <td style="font-family:monospace;font-size:11px">${esc(r.path)}</td>
        <td style="text-transform:capitalize">${esc(r.device_type || '')}</td>
        <td>${esc(r.browser || '')}</td>
        <td style="font-size:11px;color:#6b6b6b">${esc(r.referrer || '')}</td>
      </tr>`).join('') || '<tr><td colspan="7" class="empty">No app-level sessions recorded yet — will populate after deployment.</td></tr>';

    dbHtml = `
    <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:#9a9a9a;margin-bottom:12px">App-level detail (30 days · ${s.total} total logged)</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px">
      <div class="card">
        <div class="card-header"><div class="card-title">Top Pages</div></div>
        <table><thead><tr><th>Path</th><th style="text-align:right">Views</th></tr></thead>
          <tbody>${topPagesRows}</tbody></table>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">Top Countries</div></div>
        <table><thead><tr><th>Country</th><th style="text-align:right">Views</th></tr></thead>
          <tbody>${topCountriesRows}</tbody></table>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-bottom:20px">
      <div class="card">
        <div class="card-header"><div class="card-title">Devices</div></div>
        <table><thead><tr><th>Type</th><th style="text-align:right">Views</th></tr></thead>
          <tbody>${deviceRows}</tbody></table>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">Browsers</div></div>
        <table><thead><tr><th>Browser</th><th style="text-align:right">Views</th></tr></thead>
          <tbody>${browserRows}</tbody></table>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">Referrers</div></div>
        <table><thead><tr><th>Source</th><th style="text-align:right">Views</th></tr></thead>
          <tbody>${referrerRows}</tbody></table>
      </div>
    </div>
    <div class="card">
      <div class="card-header">
        <div class="card-title">Recent Sessions</div>
        <button class="btn btn-outline btn-sm" onclick="showVisitors()">Refresh</button>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Time</th><th>Country</th><th>IP</th><th>Page</th><th>Device</th><th>Browser</th><th>Referrer</th></tr></thead>
          <tbody>${recentRows}</tbody>
        </table>
      </div>
    </div>`;
  }

  setMain(`
    <div class="page-header">
      <div class="page-title">Visitors</div>
    </div>
    ${cfHtml}
    ${dbHtml}
  `);
}

async function createTemplate() {
  const name    = document.getElementById('tmpl-new-name').value.trim();
  const subject = document.getElementById('tmpl-new-subject').value.trim();
  const body    = document.getElementById('tmpl-new-body').value.trim();
  if (!name || !subject || !body) return alert('Name, subject, and body are all required.');
  const r = await post('/api/admin/templates', { name, subject, body });
  if (r?.ok) {
    ['tmpl-new-name','tmpl-new-subject','tmpl-new-body'].forEach(id => document.getElementById(id).value = '');
    const msg = document.getElementById('tmpl-save-msg');
    msg.style.display = 'inline';
    setTimeout(() => { msg.style.display = 'none'; showTemplates(); }, 1200);
  } else alert('Error: ' + (r?.error || 'could not save'));
}

async function deleteTemplate(id) {
  if (!confirm('Delete this template?')) return;
  await del(`/api/admin/templates/${id}`);
  showTemplates();
}

async function showAuditLog() {

function addBlockedCountry() {
  const sel = document.getElementById('block-country-select');
  const code = sel.value;
  if (!code) return;
  if (!window._blockedCountries) window._blockedCountries = [];
  if (window._blockedCountries.includes(code)) return;
  window._blockedCountries.push(code);
  sel.value = '';
  renderBlockedChips();
}

function removeBlockedCountry(code) {
  window._blockedCountries = (window._blockedCountries || []).filter(c => c !== code);
  renderBlockedChips();
}

function renderBlockedChips() {
  const el = document.getElementById('blocked-chips');
  if (!el) return;
  const blocked = window._blockedCountries || [];
  el.innerHTML = blocked.length
    ? blocked.map(code => `
        <span style="display:inline-flex;align-items:center;gap:5px;background:#fee2e2;color:#991b1b;padding:3px 10px;border-radius:0;font-size:12px;font-weight:500;margin:3px">
          ${esc(COUNTRIES[code] || code)} (${code})
          <button onclick="removeBlockedCountry('${code}')" style="background:none;border:none;cursor:pointer;color:#991b1b;font-size:14px;line-height:1;padding:0">×</button>
        </span>`).join('')
    : '<span style="font-size:12px;color:#9a9a9a">No countries blocked.</span>';
}

async function saveAllSettings() {
  const announcement = document.getElementById('setting-announcement')?.value || '';
  const priceDom     = parseInt(document.getElementById('setting-price-dom')?.value) || 1000;
  const priceIntl    = parseInt(document.getElementById('setting-price-intl')?.value) || 2000;
  const dailyCap     = parseInt(document.getElementById('setting-daily-cap')?.value) || 0;
  const blocked      = JSON.stringify(window._blockedCountries || []);

  const r = await post('/api/admin/settings/batch', {
    announcement,
    price_domestic_cents:      String(priceDom),
    price_international_cents: String(priceIntl),
    daily_order_cap:           String(dailyCap),
    blocked_countries:         blocked,
  });
  const msg = document.getElementById('settings-saved-msg');
  if (r?.ok && msg) {
    msg.style.display = 'inline';
    setTimeout(() => { msg.style.display = 'none'; }, 2500);
  } else alert('Error saving: ' + (r?.error || 'unknown'));
}

async function saveSetting(key, value) {
  return post('/api/admin/settings', { key, value: String(value) });
}

async function toggleServicePause(currentlyPaused) {
  const newVal = !currentlyPaused;
  const r = await saveSetting('service_paused', newVal ? 'true' : 'false');
  if (r?.ok) showSettings();
  else alert('Error saving setting.');
}

async function toggleAwayMode(currentlyOn) {
  const r = await saveSetting('away_mode', currentlyOn ? 'false' : 'true');
  if (r?.ok) showSettings();
  else alert('Error saving setting.');
}

async function saveAwaySettings() {
  const msg = document.getElementById('away-message')?.value || '';
  const r = await saveSetting('away_message', msg);
  const el = document.getElementById('away-saved-msg');
  if (r?.ok && el) {
    el.style.display = 'inline';
    setTimeout(() => { el.style.display = 'none'; }, 2500);
  } else alert('Error saving: ' + (r?.error || 'unknown'));
}

async function runBackupNow() {
  const btn = document.getElementById('backup-now-btn');
  const msg = document.getElementById('backup-status');
  if (btn) { btn.disabled = true; btn.textContent = 'Running…'; }
  const r = await post('/api/admin/backups/run', {});
  if (btn) { btn.disabled = false; btn.textContent = 'Backup Now'; }
  if (r?.ok) {
    if (msg) {
      msg.style.color = '#16a34a';
      let line = `✓ Backup created: ${r.filename}`;
      msg.textContent = line;
    }
    setTimeout(() => showSettings(), 1200);
  } else {
    if (msg) { msg.style.color = '#e63946'; msg.textContent = `Error: ${r?.error || 'unknown'}`; }
  }
}

async function deleteBackup(filename) {
  if (!confirm(`Delete ${filename}? This cannot be undone.`)) return;
  const r = await del(`/api/admin/backups/${encodeURIComponent(filename)}`);
  if (r?.ok) showSettings();
  else alert('Delete failed: ' + (r?.error || 'unknown'));
}

async function purgeCfCache() {
  if (!confirm('Purge all Cloudflare cached assets? This will briefly increase origin traffic until the cache warms back up.')) return;
  const btn = document.getElementById('cf-purge-btn');
  const msg = document.getElementById('cf-purge-msg');
  btn.disabled = true; btn.textContent = 'Purging…';
  msg.style.display = 'none';
  const r = await post('/api/admin/cloudflare/purge', {});
  btn.disabled = false; btn.textContent = 'Purge Everything';
  if (r?.ok) {
    msg.style.color = '#16a34a'; msg.textContent = '✓ Cache purged'; msg.style.display = 'inline';
    setTimeout(() => { msg.style.display = 'none'; }, 4000);
  } else {
    msg.style.color = '#e63946'; msg.textContent = 'Error: ' + (r?.error || 'unknown'); msg.style.display = 'inline';
  }
}

function fmtBytes(bytes) {
  if (bytes < 1024)        return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function toggleContactExpand(id) {
  const row = document.getElementById('contact-expand-' + id);
  if (row) row.style.display = row.style.display === 'none' ? '' : 'none';
}

function toggleContactReply(id) {
  const row = document.getElementById('contact-reply-' + id);
  if (row) row.style.display = row.style.display === 'none' ? '' : 'none';
}

function loadContactTemplate(id, select) {
  const opt = select.options[select.selectedIndex];
  if (!opt.value) return;
  const subjectEl = document.getElementById('reply-subject-' + id);
  const bodyEl    = document.getElementById('reply-body-'    + id);
  if (subjectEl) subjectEl.value = opt.dataset.subject || '';
  if (bodyEl)    bodyEl.value    = opt.dataset.body    || '';
}

async function sendContactReply(id) {
  const subject = document.getElementById('reply-subject-' + id)?.value.trim();
  const body    = document.getElementById('reply-body-'    + id)?.value.trim();
  if (!subject || !body) return alert('Subject and body are required.');
  const r = await post(`/api/admin/contacts/${id}/reply`, { subject, body });
  if (r?.ok) {
    alert('Reply sent.');
    showContacts();
  } else {
    alert('Error: ' + (r?.error || 'could not send reply'));
  }
}

// ── Web Audio chiptune SFX ────────────────────────────────────────────────────
let _audioCtx = null;
function _getAC() {
  if (!_audioCtx || _audioCtx.state === 'closed') _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (_audioCtx.state === 'suspended') _audioCtx.resume().catch(() => {});
  return _audioCtx;
}
function sfx(f1, f2, dur, vol, type) {
  try {
    const ctx = _getAC(), o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = type || 'square';
    o.frequency.setValueAtTime(f1, ctx.currentTime);
    if (f2 !== f1) o.frequency.linearRampToValueAtTime(f2, ctx.currentTime + dur * 0.7);
    g.gain.setValueAtTime(vol || 0.07, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    o.start(); o.stop(ctx.currentTime + dur);
  } catch (e) {}
}
function sfxCoin()    { sfx(523, 1046, 0.22, 0.08); setTimeout(() => sfx(880, 1760, 0.14, 0.05), 170); }
function sfxScore()   { sfx(880, 1320, 0.08, 0.05); }
function sfxEat()     { sfx(660, 880,  0.07, 0.06); }
function sfxHit()     { sfx(330, 440,  0.05, 0.05); }
function sfxDie()     { sfx(440, 110,  0.45, 0.1);  setTimeout(() => sfx(220, 55, 0.55, 0.08), 230); }
function sfxLevelUp() { [0, 120, 240].forEach(d => setTimeout(() => sfx(523, 1046, 0.1, 0.06), d)); }
