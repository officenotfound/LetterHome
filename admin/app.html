<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Letterhome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="/fonts.css">
<script src="/sla-clock.js"></script>
<script>(function(){try{var t=localStorage.getItem('lh-admin-theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#fafafa;color:#111111;min-height:100vh;display:flex;font-size:14px;line-height:1.5}

html[data-theme="dark"] body{background:#0a0a0a;color:#f5f5f5}
html[data-theme="dark"] .sidebar{background:#0a0a0a;border-right-color:rgba(255,255,255,0.08)}
html[data-theme="dark"] .sidebar-logo{border-bottom-color:rgba(255,255,255,0.08)}
html[data-theme="dark"] .sidebar-footer{border-top-color:rgba(255,255,255,0.08)}
html[data-theme="dark"] .logo-text{color:#f5f5f5}
html[data-theme="dark"] .logo-sub{color:#ff7a82}
html[data-theme="dark"] .nav-label{color:#666}
html[data-theme="dark"] .nav-link{color:#9a9a9a}
html[data-theme="dark"] .nav-link:hover{color:#f5f5f5;background:rgba(255,255,255,0.04)}
html[data-theme="dark"] .nav-link.active{color:#ff7a82;background:transparent;border-left-color:#ff7a82}
html[data-theme="dark"] .topbar{background:transparent;border-bottom-color:rgba(255,255,255,0.08)}
html[data-theme="dark"] .topbar-title{color:#f5f5f5}
html[data-theme="dark"] .topbar-user{color:#9a9a9a}
html[data-theme="dark"] .stat-card,html[data-theme="dark"] .card,html[data-theme="dark"] .detail-card{background:#141414;border-color:rgba(255,255,255,0.08)}
html[data-theme="dark"] .stat-value,html[data-theme="dark"] .card-title,html[data-theme="dark"] .detail-value,html[data-theme="dark"] .page-title{color:#f5f5f5}
html[data-theme="dark"] .stat-label,html[data-theme="dark"] .stat-sub,html[data-theme="dark"] .detail-card-title,html[data-theme="dark"] .detail-label,html[data-theme="dark"] .topbar-user,html[data-theme="dark"] .empty,html[data-theme="dark"] .back-link,html[data-theme="dark"] .field label{color:#9a9a9a}
html[data-theme="dark"] .card-header,html[data-theme="dark"] .detail-row,html[data-theme="dark"] .note-item{border-bottom-color:rgba(255,255,255,0.06)}
html[data-theme="dark"] th{background:transparent;color:#9a9a9a;border-bottom-color:rgba(255,255,255,0.4)}
html[data-theme="dark"] td{color:#d0d0d0;border-bottom-color:rgba(255,255,255,0.06)}
html[data-theme="dark"] tr:hover td{background:rgba(255,255,255,0.03)}
html[data-theme="dark"] .address-block,html[data-theme="dark"] .note-text{color:#d0d0d0}
html[data-theme="dark"] .letter-body{background:#0a0a0a;color:#d0d0d0;border-color:rgba(255,255,255,0.08)}
html[data-theme="dark"] .filter-btn{background:transparent;color:#9a9a9a;border-color:rgba(255,255,255,0.15)}
html[data-theme="dark"] .filter-btn:hover,html[data-theme="dark"] .filter-btn.active{background:#f5f5f5;color:#0a0a0a;border-color:#f5f5f5}
html[data-theme="dark"] input[type=text],html[data-theme="dark"] input[type=email],html[data-theme="dark"] select{border-bottom-color:#f5f5f5;color:#f5f5f5}
html[data-theme="dark"] input:focus,html[data-theme="dark"] textarea:focus,html[data-theme="dark"] select:focus{border-bottom-color:#ff7a82}
html[data-theme="dark"] textarea{border-color:#f5f5f5;color:#f5f5f5;background:transparent}
html[data-theme="dark"] textarea:focus{border-color:#ff7a82}
html[data-theme="dark"] .btn-primary{background:#f5f5f5;color:#0a0a0a}
html[data-theme="dark"] .btn-primary:hover{background:#ff7a82;color:#0a0a0a}
html[data-theme="dark"] .btn-outline{color:#f5f5f5;border-color:#f5f5f5}
html[data-theme="dark"] .btn-outline:hover{background:#f5f5f5;color:#0a0a0a}
html[data-theme="dark"] .btn-ghost{color:#9a9a9a}
html[data-theme="dark"] .btn-ghost:hover{color:#ff7a82;background:transparent}
html[data-theme="dark"] .tag{background:rgba(255,255,255,0.06);color:#d0d0d0}
html[data-theme="dark"] .file-item{background:transparent;border-color:rgba(255,255,255,0.08)}
html[data-theme="dark"] .file-name{color:#d0d0d0}
html[data-theme="dark"] .note-meta{color:#6b6b6b}
html[data-theme="dark"] .back-link:hover{color:#ff7a82}
html[data-theme="dark"] .badge,html[data-theme="dark"] .badge-blue,html[data-theme="dark"] .badge-amber,html[data-theme="dark"] .badge-violet{color:#f5f5f5;border-color:rgba(255,255,255,0.5);background:transparent}
html[data-theme="dark"] .badge-gray{color:#9a9a9a;border-color:rgba(255,255,255,0.3)}
html[data-theme="dark"] .badge-green{color:#ff7a82;border-color:#ff7a82}
/* Admin theme toggle */
.admin-theme-toggle{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:0;color:#6b6b6b;font-size:10px;font-family:'DM Mono',ui-monospace,monospace;text-transform:uppercase;letter-spacing:0.12em;cursor:pointer;transition:all 0.15s;border:none;background:none;width:100%;text-align:left;margin-bottom:4px}
.admin-theme-toggle:hover{color:#111111}
html[data-theme="dark"] .admin-theme-toggle{color:#9a9a9a}
html[data-theme="dark"] .admin-theme-toggle:hover{color:#f5f5f5}
.admin-theme-toggle .label-light{display:inline}
.admin-theme-toggle .label-dark{display:none}
html[data-theme="dark"] .admin-theme-toggle .label-light{display:none}
html[data-theme="dark"] .admin-theme-toggle .label-dark{display:inline}


.sidebar{width:240px;min-height:100vh;background:#ffffff;border-right:1px solid #ececec;display:flex;flex-direction:column;flex-shrink:0;position:fixed;top:0;left:0;bottom:0}
.sidebar-logo{padding:32px 28px 24px;border-bottom:1px solid #ececec}
.sidebar-logo-inner{display:flex;flex-direction:column;gap:8px}
.logo-mark{display:none}
.logo-text{color:#111111;font-size:22px;font-weight:600;letter-spacing:-0.025em;font-family:Georgia,serif;line-height:1}
.logo-sub{color:#e63946;font-size:10px;font-family:'DM Mono',ui-monospace,monospace;text-transform:uppercase;letter-spacing:0.18em;margin-top:4px}
.sidebar-nav{flex:1;padding:24px 16px;overflow-y:auto}
.nav-label{color:#9a9a9a;font-family:'DM Mono',ui-monospace,monospace;font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:0.22em;padding:0 8px;margin:20px 0 10px}
.nav-label:first-child{margin-top:0}
.nav-link{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 14px;border-radius:0;color:#2a2a2a;font-family:'DM Mono',ui-monospace,monospace;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.1em;text-decoration:none;cursor:pointer;transition:all 0.15s;margin-bottom:1px;border:none;border-left:2px solid transparent;background:none;width:100%;text-align:left}
.nav-link:hover{color:#111111;background:#fafafa}
.nav-link.active{color:#e63946;background:transparent;border-left-color:#e63946}
.nav-icon{font-size:13px;width:18px;text-align:center;color:#9a9a9a}
.nav-link.active .nav-icon{color:#e63946}
.sidebar-footer{padding:16px 16px 24px;border-top:1px solid #ececec}
.logout-btn{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:0;color:#6b6b6b;font-size:10px;font-family:'DM Mono',ui-monospace,monospace;text-transform:uppercase;letter-spacing:0.12em;cursor:pointer;transition:all 0.15s;border:none;background:none;width:100%}
.logout-btn:hover{color:#e63946}


.content{margin-left:240px;flex:1;min-width:0;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:transparent;border-bottom:1px solid #ececec;padding:0 36px;height:72px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-title{font-size:20px;font-weight:600;color:#111111;letter-spacing:-0.02em;font-family:Georgia,serif}

.notif-wrap{position:relative}
.notif-btn{position:relative;background:none;border:1px solid #e3e3e3;border-radius:4px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;color:#2a2a2a}
.notif-btn:hover{background:#f5f5f5}
.notif-count{position:absolute;top:-6px;right:-6px;background:#b42318;color:#fff;font-size:11px;font-weight:600;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;font-family:ui-monospace,monospace}
.notif-panel{position:absolute;right:0;top:46px;width:340px;max-width:calc(100vw - 24px);background:#fff;border:1px solid #e3e3e3;border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.14);z-index:300;overflow:hidden}
.notif-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #eee;font-size:14px}
.notif-clear{background:none;border:none;color:#7d3220;font-size:12px;cursor:pointer}
.notif-item{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid #f1f1f1;padding:11px 14px;cursor:pointer;font-size:13px;line-height:1.45;color:#2a2a2a}
.notif-item:hover{background:#faf8f4}
.notif-item small{display:block;color:#777;font-size:11px;margin-top:2px}
.notif-empty{padding:18px 14px;font-size:13px;color:#777}
.notif-foot{padding:10px 14px;font-size:12px;color:#777;border-top:1px solid #eee}
.notif-foot button{background:none;border:none;color:#7d3220;cursor:pointer;font-size:12px;padding:0}
.toast-stack{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:400}
.toast{background:#1f1f1f;color:#fff;padding:12px 16px;border-radius:6px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer;max-width:320px}
.email-hist{border-top:1px solid #eee;margin-top:16px;padding-top:12px}
.email-hist-item{padding:8px 0;border-bottom:1px solid #f3f3f3;font-size:13px}
.email-hist-item pre{white-space:pre-wrap;font-family:inherit;color:#555;margin:4px 0 0;font-size:12px}
.topbar-user{font-size:10px;color:#6b6b6b;font-family:'DM Mono',ui-monospace,monospace;text-transform:uppercase;letter-spacing:0.12em}
.main{padding:36px;flex:1;min-width:0;max-width:1400px}


.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-bottom:36px;background:#ececec;border:1px solid #ececec}
.stat-card{background:#ffffff;border:none;border-radius:0;padding:24px 24px 20px}
.stat-label{font-size:9px;color:#6b6b6b;font-weight:500;text-transform:uppercase;letter-spacing:0.15em;margin-bottom:10px;font-family:'DM Mono',ui-monospace,monospace}
.stat-value{font-size:30px;font-weight:600;color:#111111;letter-spacing:-0.03em;font-family:Georgia,serif;line-height:1.05}
.stat-sub{font-size:10px;color:#9a9a9a;margin-top:8px;font-family:'DM Mono',ui-monospace,monospace;text-transform:uppercase;letter-spacing:0.12em}
.card{background:#ffffff;border:1px solid #ececec;border-radius:0;overflow:hidden;margin-bottom:28px}
.card-header{padding:20px 24px;border-bottom:1px solid #ececec;display:flex;align-items:center;justify-content:space-between}
.card-title{font-family:'DM Mono',ui-monospace,monospace;font-size:10px;font-weight:600;color:#111111;text-transform:uppercase;letter-spacing:0.18em}

table{width:100%;border-collapse:collapse}
th{padding:12px 16px;text-align:left;font-size:9px;font-weight:600;color:#6b6b6b;text-transform:uppercase;letter-spacing:0.18em;background:transparent;border-bottom:1.5px solid #111111;font-family:'DM Mono',ui-monospace,monospace}
td{padding:14px 16px;font-size:13px;color:#2a2a2a;border-bottom:1px solid #ececec;vertical-align:top}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafa}
.link{color:#e63946;text-decoration:none;font-weight:500;cursor:pointer;background:none;border:none;font-size:13px;padding:0;font-family:inherit}
.link:hover{text-decoration:underline}


.badge{white-space:nowrap;display:inline-flex;align-items:center;padding:3px 8px;border-radius:0;font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;border:1px solid #111111;background:transparent;color:#111111;font-family:'DM Mono',ui-monospace,monospace}
.badge-gray{color:#6b6b6b;border-color:#9a9a9a}
.badge-blue,.badge-amber,.badge-violet{color:#111111;border-color:#111111}
.badge-green{color:#e63946;border-color:#e63946}
.badge-red{color:#991b1b;border-color:#991b1b;background:#fef2f2}


.form-row{display:flex;gap:16px;align-items:flex-end;margin-bottom:20px}
.field{display:flex;flex-direction:column;gap:8px;flex:1}
.field label{font-family:'DM Mono',ui-monospace,monospace;font-size:10px;font-weight:500;color:#6b6b6b;text-transform:uppercase;letter-spacing:0.15em}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],textarea,select{width:100%;border:none;border-bottom:1.5px solid #111111;border-radius:0;padding:10px 2px;font-size:14px;color:#111111;outline:none;font-family:inherit;background:transparent;transition:border-color 0.15s}
input:focus,textarea:focus,select:focus{border-bottom-color:#e63946}
textarea{resize:vertical;min-height:120px;border:1px solid #111111;padding:12px 14px;font-family:Georgia,serif;font-size:14px;line-height:1.55}
.btn{padding:12px 24px;border-radius:0;font-size:10px;font-weight:600;cursor:pointer;border:none;transition:all 0.15s;letter-spacing:0.18em;text-transform:uppercase;font-family:'DM Mono',ui-monospace,monospace;display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:#111111;color:#ffffff}
.btn-primary:hover{background:#e63946;color:#ffffff}
.btn-outline{background:transparent;color:#111111;border:1px solid #111111}
.btn-outline:hover{background:#111111;color:#ffffff}
.btn-sm{padding:7px 14px;font-size:9px;letter-spacing:0.15em}
.btn-ghost{background:none;border:none;color:#6b6b6b;cursor:pointer;font-size:10px;padding:6px 10px;border-radius:0;font-family:'DM Mono',ui-monospace,monospace;text-transform:uppercase;letter-spacing:0.15em}
.btn-ghost:hover{color:#e63946;background:transparent}


.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:28px}
.detail-card{background:#ffffff;border:1px solid #ececec;border-radius:0;padding:24px 28px}
.detail-card-title{font-family:'DM Mono',ui-monospace,monospace;font-size:10px;font-weight:600;color:#6b6b6b;text-transform:uppercase;letter-spacing:0.18em;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid #ececec}
.detail-row{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1px solid #ececec;font-size:13px;gap:16px}
.detail-row:last-child{border-bottom:none}
.detail-label{font-family:'DM Mono',ui-monospace,monospace;font-size:10px;text-transform:uppercase;letter-spacing:0.15em;color:#6b6b6b;flex-shrink:0;line-height:1.6}
.detail-value{color:#111111;font-weight:500;text-align:right;word-break:break-word;line-height:1.5}
.address-block{font-size:13px;color:#2a2a2a;line-height:1.75;white-space:pre-line;font-family:Georgia,serif}
.letter-body{font-size:14px;color:#2a2a2a;line-height:1.7;white-space:pre-wrap;font-family:Georgia,serif;padding:24px;background:#fafafa;border-radius:0;border:1px solid #ececec;border-left:3px solid #111111}


.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:8px;background:transparent;color:#2a2a2a;padding:4px 10px;border-radius:0;font-size:10px;font-weight:500;border:1px solid #111111;font-family:'DM Mono',ui-monospace,monospace;text-transform:uppercase;letter-spacing:0.12em}
.tag-remove{background:none;border:none;cursor:pointer;color:#9a9a9a;font-size:14px;line-height:1;padding:0}
.tag-remove:hover{color:#e63946}


.note-item{padding:14px 0;border-bottom:1px solid #ececec}
.note-item:last-child{border-bottom:none}
.note-meta{font-family:'DM Mono',ui-monospace,monospace;font-size:10px;color:#6b6b6b;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.12em}
.note-text{font-size:14px;color:#2a2a2a;line-height:1.6;font-family:Georgia,serif}


.filter-row{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.filter-btn{padding:8px 14px;border-radius:0;border:1px solid #ececec;background:transparent;font-size:9px;font-weight:500;color:#6b6b6b;cursor:pointer;transition:all 0.15s;font-family:'DM Mono',ui-monospace,monospace;text-transform:uppercase;letter-spacing:0.15em}
.filter-btn:hover{color:#111111;border-color:#111111}
.filter-btn.active{background:#111111;color:#ffffff;border-color:#111111}


.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;padding-bottom:20px;border-bottom:1px solid #ececec}
.page-title{font-size:28px;font-weight:600;color:#111111;letter-spacing:-0.025em;font-family:Georgia,serif;line-height:1.1}
.empty{text-align:center;padding:60px 20px;color:#6b6b6b;font-size:13px;font-family:'DM Mono',ui-monospace,monospace;text-transform:uppercase;letter-spacing:0.15em}
.files-list{display:flex;flex-direction:column;gap:1px;padding:16px 20px;background:#ececec}
.file-item{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#ffffff;border:none;border-radius:0;font-size:13px}
.file-name{color:#2a2a2a;font-weight:500;font-family:'DM Mono',ui-monospace,monospace;font-size:11px;letter-spacing:0.05em}
.back-link{display:inline-flex;align-items:center;gap:6px;color:#6b6b6b;font-size:10px;cursor:pointer;background:none;border:none;margin-bottom:24px;padding:0;font-family:'DM Mono',ui-monospace,monospace;text-transform:uppercase;letter-spacing:0.15em}
.back-link:hover{color:#e63946}



.mob-menu-btn{display:none;background:none;border:none;cursor:pointer;padding:6px 8px;color:#111;font-size:22px;line-height:1;flex-shrink:0}
html[data-theme="dark"] .mob-menu-btn{color:#f5f5f5}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.42);z-index:997;opacity:0;transition:opacity 0.22s;pointer-events:none}
.sidebar-overlay.mob-open{opacity:1;pointer-events:all}

.dash-grid-5{display:grid;gap:1px;background:#ececec;border:1px solid #ececec;margin-bottom:36px;grid-template-columns:repeat(5,1fr)}
.dash-grid-4{display:grid;gap:16px;margin-bottom:24px;grid-template-columns:repeat(4,1fr)}
.dash-grid-2{display:grid;gap:20px;margin-bottom:24px;grid-template-columns:1fr 1fr}
html[data-theme="dark"] .dash-grid-5{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.08)}

@media(max-width:767px){
  .sidebar{transform:translateX(-100%);transition:transform 0.22s ease;z-index:999}
  .sidebar.mob-open{transform:translateX(0)}
  .sidebar-overlay{display:block}
  .mob-menu-btn{display:flex;align-items:center}
  .content{margin-left:0!important}
  .topbar{padding:0 12px;gap:8px}
  .main{padding:14px!important;max-width:100vw;overflow-x:hidden}
  .dash-grid-5,.dash-grid-4{grid-template-columns:repeat(2,1fr)!important}
  .dash-grid-2,.detail-grid{grid-template-columns:1fr!important}
  .stats-grid{grid-template-columns:repeat(2,1fr)!important}
  .form-row{flex-direction:column}
  .page-header{flex-direction:column;align-items:flex-start;gap:10px}
  .page-header>div:last-child{display:flex;flex-wrap:wrap;gap:6px}
  .card table:not(.stack){display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  table:not(.stack) th,table:not(.stack) td{white-space:nowrap}
}


.subtabs{display:none;gap:4px;padding:0 32px;border-bottom:1px solid #ececec;background:#fff;overflow-x:auto;-webkit-overflow-scrolling:touch}
.subtab{font:500 11px 'DM Mono',ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:#6b6b6b;background:none;border:0;border-bottom:2px solid transparent;padding:14px 14px 12px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.subtab:hover{color:#111}
.subtab.active{color:#e63946;border-bottom-color:#e63946}
.contacts-tab-badge{background:#e63946;color:#fff;font-size:10px;font-weight:700;padding:1px 6px}
html[data-theme="dark"] .subtabs{background:#0a0a0a;border-bottom-color:rgba(255,255,255,.08)}
html[data-theme="dark"] .subtab{color:#9a9a9a}
html[data-theme="dark"] .subtab:hover{color:#f5f5f5}
html[data-theme="dark"] .subtab.active{color:#ff7a82;border-bottom-color:#ff7a82}
@media(max-width:767px){.subtabs{padding:0 8px}}
.mob-tabs{display:none}
@media(max-width:767px){
  .mob-tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:900;background:#fff;border-top:1px solid #e3e3e3;padding-bottom:env(safe-area-inset-bottom,0px)}

  <div class="main" id="main">
    <div class="empty">Loading…</div>
  </div>
</div>

<script>
let currentUser = '';

async function init() {
  const me = await api('/api/admin/me');
  if (!me) { window.location.href = '/admin/login'; return; }
  _csrfToken = me.csrfToken || null;
  currentUser = me.username;
  document.getElementById('topbar-user').textContent = me.username;
  if (!me.has2FA) document.getElementById('twofa-badge').style.display = 'inline-flex';
  if (me.deploy) {
    const bootAgo = Math.round((Date.now() - new Date(me.deploy.bootAt).getTime()) / 60000);
    const bootStr = bootAgo < 60 ? bootAgo + 'm ago' : Math.round(bootAgo / 60) + 'h ago';
    document.getElementById('deploy-info').innerHTML =
      `running <span title="${esc(me.deploy.commitMsg)}">${esc(me.deploy.commit)}</span><br>booted ${bootStr}`;
  }
  window.addEventListener('popstate', () => route());
  startCountdownTicker();
  startNotifications();
  api('/api/admin/contacts/unread', { background: true }).then(d => { if (d) updateContactsBadge(d.unread); });
  route();
}

function go(path) {
  history.pushState({}, '', path);
  route();
}

// Bumped on every navigation, so a slow section can't render over a newer one.
let _navId = 0;

async function route() {
  const nav = ++_navId;
  window._lastApiError = null;
  const p = window.location.pathname;
  setActiveNav(p);
  setMain('<div class="empty" id="route-loading">Loading…</div>');
  try { await renderRoute(p); } catch (e) { console.error(e); }
  if (nav === _navId && document.getElementById('route-loading')) {
    const le = window._lastApiError;
    setMain('<div class="empty">Could not load this section.' + (le ? '<br><small style="text-transform:none;letter-spacing:0">' + esc(String(le.url)) + ' returned ' + esc(String(le.status)) + '</small>' : '') + '<br><br><button class="btn btn-outline btn-sm" onclick="route()">Try again</button></div>');
  }
}

function renderRoute(p) {
  if (p === '/admin' || p === '/admin/')           return showDashboard();
  if (p === '/admin/orders')                        return showOrders();
  if (p.match(/^\/admin\/orders\/\d+$/))            return showOrder(p.split('/').pop());
  if (p === '/admin/customers')                     return showCustomers();
  if (p.match(/^\/admin\/customers\/.+$/))          return showCustomer(decodeURIComponent(p.replace('/admin/customers/', '')));
  if (p === '/admin/accounts')                      return showAccounts();
  if (p.match(/^\/admin\/accounts\/.+$/))           return showAccount(decodeURIComponent(p.replace('/admin/accounts/', '')));
  if (p === '/admin/trash')                         return showTrash();
  if (p === '/admin/broadcast')                     return showBroadcast();
  if (p === '/admin/outreach')                       return showOutreach();
  if (p === '/admin/followups')                     return showFollowups();
  if (p === '/admin/mail')                          return showMail();
  if (p === '/admin/print-queue')                   return showPrintQueue();
  if (p === '/admin/approvals')                     return showApprovals();
  if (p === '/admin/profit')                        return showProfit();
  if (p === '/admin/content')                       return showContent();
  if (p === '/admin/admin-users')                   return showAdminUsers();
  if (p === '/admin/insights')                      return showInsights();
  if (p === '/admin/visitors')                      return showVisitors();
  if (p === '/admin/stripe')                        return showStripe();
  if (p === '/admin/growth')                        return showGrowth();
  if (p === '/admin/funnel')                        return showFunnel();
  if (p === '/admin/traffic')                       return showTraffic();
  if (p === '/admin/health')                        return showHealth();
  if (p === '/admin/seo-audit')                     return showSeoAudit();
  if (p === '/admin/contacts')                      return showContacts();
  if (p === '/admin/applicants')                    return showApplicants();
  if (p === '/admin/templates')                     return showTemplates();
  if (p === '/admin/settings')                      return showSettings();
  if (p === '/admin/app-settings')                  return showAppSettings();
  if (p === '/admin/emails')                        return showEmails();
  if (p === '/admin/audit-log')                     return showAuditLog();
  if (p === '/admin/codes')                         return showCodes();
  if (p === '/admin/businesses')                    return showBusinesses();
  if (p.match(/^\/admin\/businesses\/\d+$/))         return showBusiness(p.split('/').pop());
  return showDashboard();
}

// Related sections share one menu item and show as tabs. Every address still works as before.
const NAV_GROUPS = {
  orders:   { tabs: [['/admin/orders', 'Orders'], ['/admin/approvals', 'Approvals'], ['/admin/print-queue', 'Print queue']] },
  people:   { tabs: [['/admin/customers', 'Customers'], ['/admin/accounts', 'Accounts'], ['/admin/applicants', 'Applicants'], ['/admin/businesses', 'Businesses']] },
  inbox:    { tabs: [['/admin/mail', 'Mail'], ['/admin/contacts', 'Contact form'], ['/admin/templates', 'Saved replies']] },
  marketing: { tabs: [['/admin/broadcast', 'Broadcast'], ['/admin/outreach', 'Outreach'], ['/admin/followups', 'Follow-ups'], ['/admin/content', 'Content and links'], ['/admin/emails', 'Sent emails']] },
  reports:  { tabs: [['/admin/insights', 'Insights'], ['/admin/visitors', 'Visitors'], ['/admin/traffic', 'Traffic'], ['/admin/growth', 'Search'], ['/admin/funnel', 'Funnel'], ['/admin/seo-audit', 'Content audit'], ['/admin/profit', 'Profit'], ['/admin/stripe', 'Stripe']] },
  system:   { tabs: [['/admin/settings', 'Settings'], ['/admin/app-settings', 'Phone app'], ['/admin/health', 'Health'], ['/admin/codes', 'Codes'], ['/admin/admin-users', 'Admin users'], ['/admin/audit-log', 'Audit log'], ['/admin/trash', 'Trash']] },
};
function groupOf(p) {
  for (const [g, v] of Object.entries(NAV_GROUPS)) {
    for (const [path] of v.tabs) if (p === path || p.startsWith(path + '/')) return [g, path];
  }
  return [null, null];
}
function setActiveNav(p) {
  ['dashboard','orders','inbox','people','marketing','reports','system'].forEach(k => document.getElementById('nav-' + k)?.classList.remove('active'));
  const [g, tab] = groupOf(p);
  document.querySelectorAll('.mob-tab').forEach(t => t.classList.toggle('active', t.dataset.g === (g || 'dashboard')));
  const strip = document.getElementById('subtabs');
  if (!g || NAV_GROUPS[g].tabs.length < 2) {
    document.getElementById('nav-' + (g || 'dashboard'))?.classList.add('active');
    if (strip) { strip.innerHTML = ''; strip.style.display = 'none'; }
    return;
  }
  document.getElementById('nav-' + g)?.classList.add('active');
  if (strip) {
    strip.style.display = 'flex';
    strip.innerHTML = NAV_GROUPS[g].tabs.map(([path, label]) =>
      `<button class="subtab${path === tab ? ' active' : ''}" role="tab" aria-selected="${path === tab}" onclick="go('${path}')">${label}${path === '/admin/contacts' ? '<span class="contacts-tab-badge" style="display:none"></span>' : ''}${path === '/admin/mail' ? '<span class="mail-tab-badge contacts-tab-badge" style="display:none"></span>' : ''}</button>`).join('');
    const n = window._unreadContacts || 0;
    strip.querySelectorAll('.contacts-tab-badge').forEach(b => { const v = b.classList.contains('mail-tab-badge') ? (window._unreadMail || 0) : n; b.textContent = v; b.style.display = v > 0 ? 'inline-block' : 'none'; });
  }
}

function setTitle(t) { document.getElementById('topbar-title').textContent = t; }
function setMain(html) { document.getElementById('main').innerHTML = html; stackTables(document.getElementById('main')); }
// Tables are also re-rendered in place (filters, search), so label cells whenever the content changes.
new MutationObserver(() => stackTables(document.getElementById('main'))).observe(document.getElementById('main'), { childList: true, subtree: true });
// Phones: wide tables become stacked cards, each cell labelled from its column heading.
function stackTables(root) {
  root.querySelectorAll('table').forEach(t => {
    const heads = [...t.querySelectorAll('thead th')].map(th => th.textContent.trim());
    if (heads.length < 4) return;
    t.classList.add('stack');
    t.querySelectorAll('tbody tr').forEach(tr => [...tr.children].forEach((td, i) => { if (td.tagName === 'TD' && !td.hasAttribute('colspan') && !td.hasAttribute('data-label')) td.setAttribute('data-label', heads[i] || ''); }));
  });
}

let _csrfToken = null;
async function api(url, opts = {}) {
  const nav = _navId;
  const isGet = !opts.method || opts.method === 'GET';
  // A GET that fails on a blip (network, 5xx, 429, mid-deploy restart) is retried
  // before the section gives up, so switching tabs doesn't strand a "Loading…".
  const tries = isGet ? 3 : 1;
  for (let attempt = 1; attempt <= tries; attempt++) {
    try {
      const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
      if (_csrfToken && !isGet) headers['X-CSRF-Token'] = _csrfToken;
      const r = await fetch(url, { ...opts, headers });
      if (r.status === 401) { window.location.href = '/admin/login'; return null; }
      if (!r.ok && isGet && attempt < tries && (r.status >= 500 || r.status === 429)) {
        await new Promise(res => setTimeout(res, 350 * attempt));
        continue;
      }
      let data;
      if (r.ok) data = await r.json();
      else if (!isGet) data = await r.json().then(j => ({ ok: false, error: j.error || ('HTTP ' + r.status) })).catch(() => ({ ok: false, error: 'HTTP ' + r.status }));
      else { data = null; window._lastApiError = { url, status: r.status }; }
      // The user has moved on: never resolve, so the old section stops here.
      if (nav !== _navId && !opts.background && isGet) return new Promise(() => {});
      return data;
    } catch (e) {
      if (attempt < tries) { await new Promise(res => setTimeout(res, 350 * attempt)); continue; }
      window._lastApiError = { url, status: 'network' };
      return null;
    }
  }
  return null;
}

async function post(url, body) {
  return api(url, { method: 'POST', body: JSON.stringify(body) });
}

async function del(url) {
  return api(url, { method: 'DELETE' });
}

function statusBadge(s) {
  const map = {
    awaiting_payment:     ['badge-gray',   'Awaiting Payment'],
    paid:                 ['badge-blue',   'Paid'],
    submitted_to_printer: ['badge-amber',  'At Printer'],
    printing:             ['badge-amber',  'Printing'],
    mailed:               ['badge-violet', 'Mailed'],
    delivered:            ['badge-green',  'Delivered'],
    refunded:             ['badge-gray',   'Refunded'],
  };
  const [cls, label] = map[s] || ['badge-gray', s];
  return `<span class="badge ${cls}">${label}</span>`;
}

// SQLite stores UTC as "YYYY-MM-DD HH:MM:SS" with no zone, which browsers would read as local time.
function parseDbDate(d) {
  if (typeof d !== 'string') return new Date(d);
  if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}/.test(d)) return new Date(d.replace(' ', 'T') + 'Z');
  if (/^\d{4}-\d{2}-\d{2}$/.test(d)) return new Date(d + 'T00:00:00');   // calendar date, no time to shift
  return new Date(d);
}

function fmtDate(d) {
  if (!d) return '—';
  return parseDbDate(d).toLocaleDateString('en-CA', { year:'numeric', month:'short', day:'numeric' });
}

function fmtDateTime(d) {
  if (!d) return '—';
  return parseDbDate(d).toLocaleString('en-CA', {
    month:'short', day:'numeric', year:'numeric',
    hour:'numeric', minute:'2-digit'
  });
}

function fmtCAD(cents) {
  return '$' + (cents / 100).toFixed(2) + ' CAD';
}

// What the customer actually paid. Fixed-price US/UK/AU orders are charged in
// their own currency; price_cents is only the CAD estimate used for reports.
const CUR_SYM = { USD: 'US$', GBP: '£', AUD: 'A$' };
function fmtCharged(o, withCad) {
  if (o && o.charge_currency && o.charge_cents != null && o.charge_currency !== 'CAD') {
    const sym = CUR_SYM[o.charge_currency] || (o.charge_currency + ' ');
    const main = sym + (o.charge_cents / 100).toFixed(2);
    return withCad === false ? main : `${main} <span style="color:#9a9a9a;font-size:11px">≈ ${fmtCAD(o.price_cents)}</span>`;
  }
  return fmtCAD(o.price_cents);
}

// Which site took the order. Orders from the Australian page are recognised by their AUD charge, since they are
// taken on letterhome.ca itself.
const SITE_NAMES = { ca: 'letterhome.ca', us: 'letterhome.us', uk: 'letterhome.co.uk' };
const REGION_NAMES = { ca: 'letterhome.ca', au: 'letterhome.ca/au', us: 'letterhome.us', uk: 'letterhome.co.uk' };
const REGION_FLAGS = { ca: '🇨🇦', au: '🇦🇺', us: '🇺🇸', uk: '🇬🇧' };
// Which page the order went through: ca, au (the Australian pages on letterhome.ca), us or uk.
function siteRegion(o) {
  if (!o) return 'ca';
  if (REGION_NAMES[o.order_region]) return o.order_region;
  const key = SITE_NAMES[o.order_site] ? o.order_site : 'ca';
  return key === 'ca' && String(o.charge_currency || '').toUpperCase() === 'AUD' ? 'au' : key;
}
function siteName(o) { return o ? REGION_NAMES[siteRegion(o)] : ''; }
function siteFlag(o) { return o ? REGION_FLAGS[siteRegion(o)] : ''; }
function siteTag(o) {
  return o ? `<div style="color:#9a9a9a;font-size:11px">${siteFlag(o)} ${siteName(o)}</div>` : '';
}

// "Mon 9:00 AM" in the facility's time zone
function slaWhen(ms) {
  return new Date(ms).toLocaleString('en-CA', { timeZone: LHSla.TZ, weekday: 'short', hour: 'numeric', minute: '2-digit', hour12: true }).replace(/\./g, '');
}

// Once a letter has gone to PostGrid it is out of our hands: no countdown, no overdue
function handedOff(o) {
  return !!o && (['submitted_to_printer', 'printing'].includes(o.status) || (o.postgrid_letter_id && o.postgrid_mode === 'live' && o.postgrid_status !== 'cancelled'));
}

// The 24-hour clock for a scheduled order starts on its send date (9 a.m. Eastern), not when it was placed.
function slaStart(o) {
  if (!o || !o.scheduled_date) return o && o.created_at;
  const sched = o.scheduled_date + ' 14:00:00';
  return String(o.created_at) > sched ? o.created_at : sched;
}
const torontoDay = () => new Date().toLocaleDateString('en-CA', { timeZone: 'America/Toronto' });
// A paid order waiting for a future send date (its first letter, if any, was cancelled).
function schedState(o) {
  if (!o || o.status !== 'paid' || !o.scheduled_date || o.scheduled_date <= torontoDay()) return null;
  if (o.postgrid_letter_id && o.postgrid_status !== 'cancelled') return null;
  return { date: o.scheduled_date, approved: !!o.send_approved_at };
}
function schedLater(o) { const s = schedState(o); return s ? s.date : ''; }
const niceDay = d => new Date(d + 'T12:00:00Z').toLocaleDateString('en-CA', { month: 'short', day: 'numeric', timeZone: 'UTC' });
// Status pill for a whole order: a scheduled order says so, instead of a plain "Paid".
function orderBadge(o) {
  const s = schedState(o);
  if (!s) return statusBadge(o.status);
  return s.approved ? `<span class="badge badge-green" title="Approved. Goes to print automatically on ${esc(s.date)}">Scheduled ${niceDay(s.date)}</span>`
    : `<span class="badge badge-amber" title="Scheduled for ${esc(s.date)}. Approve it to send then">Approve for ${niceDay(s.date)}</span>`;
}
function timeLeftHTML(createdAt, status, out, sched, approved) {
  if (sched && status !== 'mailed' && status !== 'delivered' && status !== 'awaiting_payment' && !out && sched > torontoDay())
    return `<span data-countdown-created="${createdAt}" data-countdown-status="${status}" data-sched="${sched}" data-appr="${approved ? 1 : 0}" style="color:${approved ? '#15803d' : '#92400e'};font-size:12px;white-space:nowrap">${approved ? 'Sends ' + niceDay(sched) : 'Needs approval'}</span>`;
  if (out && status !== 'mailed' && status !== 'delivered' && status !== 'awaiting_payment')
    return `<span data-countdown-created="${createdAt}" data-countdown-status="${status}" data-out="1" style="color:#6b6b6b;font-size:12px">With the printer</span>`;
  if (status === 'mailed' || status === 'delivered')
    return `<span data-countdown-created="${createdAt}" data-countdown-status="${status}" style="color:#6b6b6b;font-size:12px">Completed</span>`;
  if (status === 'awaiting_payment')
    return `<span data-countdown-created="${createdAt}" data-countdown-status="${status}" style="color:#9a9a9a;font-size:12px">—</span>`;

  const ck = LHSla.clock(parseDbDate(createdAt).getTime(), Date.now());
  if (ck.waiting)
    return `<span data-countdown-created="${createdAt}" data-countdown-status="${status}" style="color:#6b6b6b;font-weight:600;font-size:12px">Clock starts ${slaWhen(ck.start)}</span>`;
  const remaining = ck.deadline - Date.now();
  const h = Math.floor(Math.abs(remaining) / 3600000);
  const m = Math.floor((Math.abs(remaining) % 3600000) / 60000);

  let color, text;
  if (remaining < 0)                  { color='#e63946'; text=`⚠ Overdue ${h}h ${m}m`; }
  else if (remaining < 4 * 3600000)   { color='#e63946'; text=`${h}h ${m}m left`; }
  else if (remaining < 12 * 3600000)  { color='#d97706'; text=`${h}h ${m}m left`; }
  else                                { color='#16a34a'; text=`${h}h ${m}m left`; }
  return `<span data-countdown-created="${createdAt}" data-countdown-status="${status}" style="color:${color};font-weight:600;font-size:12px">${text}</span>`;
}

function slaBanner(createdAt, status, out, sched, approved) {
  if (out) return '';
  if (sched && status !== 'mailed' && status !== 'delivered' && status !== 'awaiting_payment' && sched > torontoDay())
    return `<div data-sla-created="${createdAt}" data-sla-status="${status}" data-sched="${sched}" data-appr="${approved ? 1 : 0}" style="background:${approved ? '#f0fdf4' : '#fffbeb'};color:${approved ? '#166534' : '#92400e'};padding:14px 20px;margin-bottom:20px;font-size:14px"><strong>${approved ? 'Approved and scheduled.' : 'Scheduled, not approved yet.'}</strong> ${approved ? 'It goes to print automatically on ' + sched + '. No action is needed.' : 'The customer chose ' + sched + '. Approve it below and it goes to print that day.'} The 24-hour clock starts on that day.</div>`;
  const ck = LHSla.clock(parseDbDate(createdAt).getTime(), Date.now());
  const remaining = ck.deadline - Date.now();
  const h = Math.floor(Math.abs(remaining) / 3600000);
  const m = Math.floor((Math.abs(remaining) % 3600000) / 60000);

  let bg, color, icon, text;
  if (ck.waiting)                     { bg='#f4f4f5'; color='#52525b'; icon='🕘'; text=`Placed outside business hours. The print and mail facility opens ${slaWhen(ck.start)}, so the 24 hours start then.`; }
  else if (remaining < 0)                  { bg='#fef2f2'; color='#991b1b'; icon='⚠'; text=`Overdue by ${h}h ${m}m. Mail this order immediately.`; }
  else if (remaining < 4 * 3600000)   { bg='#fef2f2'; color='#991b1b'; icon='⚠'; text=`${h}h ${m}m left to mail this order.`; }
  else if (remaining < 12 * 3600000)  { bg='#fffbeb'; color='#92400e'; icon='⏱'; text=`${h}h ${m}m left to mail this order.`; }
  else                                { bg='#f0fdf4'; color='#166534'; icon='✓'; text=`${h}h ${m}m left to mail this order.`; }
  return `<div data-sla-created="${createdAt}" data-sla-status="${status}" style="background:${bg};color:${color};padding:14px 20px;border-radius:0;margin-bottom:20px;font-size:14px;display:flex;align-items:center;gap:12px;border:1px solid ${color}33">
    <span style="font-size:18px">${icon}</span>
    <span><strong>24-hour fulfillment clock (business hours, Mon to Fri) — </strong>${text}</span>
  </div>`;
}

function startCountdownTicker() {
  setInterval(() => {
    document.querySelectorAll('[data-countdown-created]').forEach(el => {
      const created = el.dataset.countdownCreated;
      const status  = el.dataset.countdownStatus;
      const tmp = document.createElement('div');
      tmp.innerHTML = timeLeftHTML(created, status, el.dataset.out === '1', el.dataset.sched || '', el.dataset.appr === '1');
      el.replaceWith(tmp.firstElementChild);
    });
    document.querySelectorAll('[data-sla-created]').forEach(el => {
      const created = el.dataset.slaCreated;
      const status  = el.dataset.slaStatus;
      const tmp = document.createElement('div');
      tmp.innerHTML = slaBanner(created, status, el.dataset.out === '1', el.dataset.sched || '', el.dataset.appr === '1');
      if (tmp.firstElementChild) el.replaceWith(tmp.firstElementChild);
    });
  }, 60000);
}

let dashChartPeriod = 'monthly';

async function showDashboard() {
  setTitle('Dashboard');
  // Stripe can be slow or down, so it is not allowed to hold the page back: it fills in when it arrives.
  const stripeP = api('/api/admin/stripe/overview', { background: true });
  const [stats, paidOrders, submittedOrders, chartData, geoData, health, sched] = await Promise.all([
    api('/api/admin/stats'),
    api('/api/admin/orders?status=paid'),
    api('/api/admin/orders?status=submitted_to_printer'),
    api('/api/admin/stats/chart?period=monthly'),
    api('/api/admin/stats/geo'),
    api('/api/admin/server-health'),
    api('/api/admin/print-queue/scheduled'),
  ]);
  if (!stats) return;
  // Orders already approved for a future date are not waiting on you.
  window._schedApproved = {};
  ((sched && sched.orders) || []).forEach(o => { if (o.approved && o.date > (sched.today || '')) window._schedApproved[o.id] = o.date; });

  renderDashboard(stats, paidOrders, submittedOrders, chartData, geoData, 'monthly', null, health);
  loadTodayCard();
  stripeP.then(ov => {
    if (ov && location.pathname === '/admin' && document.getElementById('need-strip')) {
      renderDashboard(stats, paidOrders, submittedOrders, chartData, geoData, 'monthly', ov, health);
      loadTodayCard();
    }
  });
}

async function reloadDashChart(period) {
  dashChartPeriod = period;
  const chartData = await api('/api/admin/stats/chart?period=' + period);
  const container = document.getElementById('dash-chart-container');
  if (container && chartData) container.innerHTML = renderBarChart(chartData, 120);
  document.querySelectorAll('.dash-period-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.period === period);
  });
}

function renderBarChart(data, maxBarPx) {
  if (!data || !data.length) return '<div class="empty" style="padding:20px">No data yet.</div>';
  const maxRev = Math.max(...data.map(d => d.revenue_cents), 1);
  const bars = data.map(d => {
    const h = Math.max(4, Math.round((d.revenue_cents / maxRev) * maxBarPx));
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:0">
      <span style="font-size:10px;color:#6b6b6b">${fmtCAD(d.revenue_cents).replace(' CAD','')}</span>
      <div style="width:100%;height:${h}px;background:#a8472d;border-radius:2px 2px 0 0;min-height:4px" title="${d.label}: ${d.orders} orders, ${fmtCAD(d.revenue_cents)}"></div>
      <span style="font-size:10px;color:#9a9a9a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%">${esc(d.label)}</span>
    </div>`;
  }).join('');
  return `<div style="display:flex;align-items:flex-end;gap:4px;height:${maxBarPx + 50}px;padding:0 4px">${bars}</div>`;
}

async function sendPnlDigest() {
  const month = new Date().toISOString().slice(0, 7);
  const r = await post('/api/admin/pnl-digest', { month });
  if (r?.ok) alert('P&L digest sent to ' + (window._operatorEmail || 'operator email'));
  else alert('Error: ' + (r?.error || 'unknown'));
}

let orderFilter = '';
let allOrders   = [];

async function showOrders(filter) {
  if (filter !== undefined) orderFilter = filter;
  setTitle('Orders');
  const url = orderFilter ? `/api/admin/orders?status=${orderFilter}` : '/api/admin/orders';
  allOrders = await api(url) || [];

  const statuses = ['','needs_you','awaiting_payment','paid','submitted_to_printer','printing','mailed','delivered'];
  const labels   = ['All','⚠ Needs you','Awaiting','Paid','At Printer','Printing','Mailed','Delivered'];
  const filters  = statuses.map((s,i) => `<button class="filter-btn ${orderFilter===s?'active':''}" onclick="showOrders('${s}')">${labels[i]}</button>`).join('');

  setMain(`
    <div class="page-header">
      <div class="page-title">Orders</div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-outline btn-sm" onclick="showPrintQueue()">🖨 Print Queue</button>
        <a class="btn btn-outline btn-sm" href="/api/admin/orders/csv" download>↓ Export CSV</a>
      </div>
    </div>
    <div class="filter-row" style="justify-content:space-between;align-items:center">
      <div style="display:flex;gap:8px;flex-wrap:wrap">${filters}</div>
      <input type="text" id="order-search" placeholder="Search name, email, #ID…" style="width:220px;padding:6px 10px;border:1px solid #ececec;border-radius:0;font-size:13px" oninput="renderOrdersTable()">
    </div>
    <div id="bulk-bar" style="display:none;background:#f5f5f5;border:1px solid #ececec;border-radius:0;padding:10px 16px;margin-bottom:12px;display:none;align-items:center;gap:12px">
      <span id="bulk-count" style="font-size:13px;color:#6b6b6b"></span>
      <select id="bulk-status-select" style="font-size:13px;border:1px solid #ececec;border-radius:0;padding:5px 8px">
        <option value="">Set status…</option>
        <option value="paid">Paid</option>
        <option value="submitted_to_printer">At Printer</option>
        <option value="printing">Printing</option>
        <option value="mailed">Mailed</option>
        <option value="delivered">Delivered</option>
        <option value="refunded">Refunded</option>
      </select>
      <button class="btn btn-primary btn-sm" onclick="applyBulkStatus()">Apply</button>
      <button class="btn btn-outline btn-sm" onclick="confirmBulkDelete()" style="margin-left:auto;color:#e63946;border-color:#e63946">Delete selected</button>
      <button class="btn btn-outline btn-sm" onclick="clearSelection()">Clear</button>
    </div>
    <div class="card">
      <table>
        <thead><tr>
          <th style="width:36px"><input type="checkbox" id="select-all" onchange="toggleSelectAll(this.checked)"></th>
          <th>#</th><th>Submitted</th><th>Recipient</th><th>Destination</th><th>Status</th><th>Time Left</th><th>Price</th><th></th>
        </tr></thead>
        <tbody id="orders-tbody"></tbody>
      </table>
    </div>`);

  renderOrdersTable();
}

function renderOrdersTable() {
  const q = (document.getElementById('order-search')?.value || '').toLowerCase();
  const filtered = q
    ? allOrders.filter(o =>
        String(o.id).includes(q) ||
        (o.recipient_name  || '').toLowerCase().includes(q) ||
        (o.customer_email  || '').toLowerCase().includes(q) ||
        (o.destination_country || '').toLowerCase().includes(q))
    : allOrders;

  const rows = filtered.map(o => `
    <tr>
      <td><input type="checkbox" class="order-cb" value="${o.id}" onchange="updateBulkBar()"></td>
      <td><button class="link" onclick="go('/admin/orders/${o.id}')">#${o.id}</button></td>
      <td>${fmtDateTime(o.created_at)}${siteTag(o)}</td>
      <td>${esc(o.recipient_name)}${(() => { const f = contentFlags(o); return f && (f.hits || []).length && !o.content_cleared_at ? '<div><span class="badge badge-red" style="margin-top:3px">FLAGGED: ' + esc(f.hits.map(h => h.label).join(', ')) + '</span></div>' : ''; })()}${o.postgrid_error !== undefined ? `<div style="font-size:12px;color:#b42318;margin-top:3px;max-width:360px;line-height:1.4">${esc((o.postgrid_error || 'Waiting for your approval: check the letter, then Send via PostGrid').replace(/^(MANUAL|RETRY): /, ''))}</div>` : ''}</td>
      <td>${esc(o.recipient_city||'')}${o.recipient_city&&o.destination_country?', ':''}${o.destination_country||''}</td>
      <td>${orderBadge(o)}</td>
      <td>${timeLeftHTML(slaStart(o), o.status, handedOff(o), schedLater(o), !!o.send_approved_at)}</td>
      <td>${fmtCharged(o)}</td>
      <td><button class="link" onclick="go('/admin/orders/${o.id}')">View →</button></td>
    </tr>`).join('');

  const tbody = document.getElementById('orders-tbody');
  if (tbody) tbody.innerHTML = rows || '<tr><td colspan="9" class="empty">No orders.</td></tr>';
}

function toggleSelectAll(checked) {
  document.querySelectorAll('.order-cb').forEach(cb => cb.checked = checked);
  updateBulkBar();
}

function updateBulkBar() {
  const selected = document.querySelectorAll('.order-cb:checked');
  const bar = document.getElementById('bulk-bar');
  const count = document.getElementById('bulk-count');
  if (!bar) return;
  if (selected.length > 0) {
    bar.style.display = 'flex';
    count.textContent = `${selected.length} order${selected.length>1?'s':''} selected`;
  } else {
    bar.style.display = 'none';
  }
}

function clearSelection() {
  document.querySelectorAll('.order-cb').forEach(cb => cb.checked = false);
  const sa = document.getElementById('select-all');
  if (sa) sa.checked = false;
  updateBulkBar();
}

async function applyBulkStatus() {
  const status = document.getElementById('bulk-status-select').value;
  if (!status) return alert('Choose a status first.');
  const ids = [...document.querySelectorAll('.order-cb:checked')].map(cb => Number(cb.value));
  if (!ids.length) return;
  if (!confirm(`Mark ${ids.length} order(s) as "${status}"?`)) return;
  const r = await post('/api/admin/orders/bulk-status', { ids, status });
  if (r?.ok) { showOrders(); }
  else alert('Error: ' + (r?.error || 'unknown'));
}

function confirmBulkDelete() {
  const ids = [...document.querySelectorAll('.order-cb:checked')].map(cb => Number(cb.value));
  if (!ids.length) return;
  const modal = document.getElementById('bulk-delete-modal');
  document.getElementById('bulk-delete-count').textContent = ids.length;
  const input = document.getElementById('bulk-delete-input');
  const btn   = document.getElementById('bulk-delete-confirm');
  input.value = '';
  btn.disabled = true;
  modal.style.display = 'flex';
  setTimeout(() => input.focus(), 30);
}

function closeBulkDeleteModal() {
  document.getElementById('bulk-delete-modal').style.display = 'none';
}

function onBulkDeleteInput(v) {
  document.getElementById('bulk-delete-confirm').disabled = (String(v || '').trim().toLowerCase() !== 'delete');
}

async function runBulkDelete() {
  const input = document.getElementById('bulk-delete-input');
  if (String(input.value || '').trim().toLowerCase() !== 'delete') return;
  const ids = [...document.querySelectorAll('.order-cb:checked')].map(cb => Number(cb.value));
  if (!ids.length) { closeBulkDeleteModal(); return; }
  const btn = document.getElementById('bulk-delete-confirm');
  btn.disabled = true; btn.textContent = 'Deleting…';
  const r = await post('/api/admin/orders/bulk-delete', { ids });
  closeBulkDeleteModal();
  btn.textContent = 'Delete';
  if (r?.ok) showOrders();
  else alert('Error: ' + (r?.error || 'unknown'));
}

async function showPrintQueue() {
  setTitle('Print Queue');

    api('/api/admin/orders?status=paid'),
    api('/api/admin/orders?status=submitted_to_printer'),

  const sch = (await api('/api/admin/print-queue/scheduled')) || { today: '', orders: [] };
  _pq = sch;
  const schById = Object.fromEntries(sch.orders.map(x => [x.id, x]));

  if (!orders.length && !sch.orders.length) {
    return setMain(`
      <button class="back-link" onclick="go('/admin/orders')">← Back to Orders</button>

    return `<div style="border:1px solid #ececec;border-radius:0;padding:20px;break-inside:avoid;margin-bottom:16px">
      <div style="font-size:11px;color:#9a9a9a;margin-bottom:10px;font-family:monospace">ORDER #${o.id} · ${fmtDate(o.created_at)} · ${statusBadge(o.status)}${schById[o.id] ? ` · <span style="color:${schById[o.id].approved ? '#15803d' : '#92400e'}">SENDS ${esc(schById[o.id].date)}${schById[o.id].approved ? ' (approved)' : ' (not approved yet)'}</span>` : ''}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
        <div>
          <div style="font-size:10px;font-weight:600;color:#6b6b6b;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">From</div>
          <div style="font-size:13px;line-height:1.7;white-space:pre-line;color:#2a2a2a">${fromAddr ? esc(fromAddr) : '<em style="color:#9a9a9a">No return address</em>'}</div>
        </div>
        <div>
          <div style="font-size:10px;font-weight:600;color:#6b6b6b;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">To</div>
          <div style="font-size:13px;line-height:1.7;white-space:pre-line;color:#111111;font-weight:500">${esc(toAddr)}</div>
        </div>
      </div>
    </div>`;
  }).join('');

  setMain(`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px" class="no-print">
      <button class="back-link" onclick="go('/admin/orders')" style="margin:0">← Back to Orders</button>
      <div style="display:flex;gap:8px">
        <span style="font-size:13px;color:#6b6b6b;align-self:center">${orders.length} order${orders.length===1?'':'s'} to mail</span>
        <button class="btn btn-primary btn-sm" onclick="window.print()">Print this page</button>
      </div>
    </div>
    <style>@media print { .no-print { display:none !important } body { background:#fff } .sidebar,.topbar,.content>.topbar { display:none !important } .content { margin:0 !important } }</style>
    ${pqSchedule()}
    ${cards}`);
}

  const sect = (title, color, items, f) => items.length ? `<div style="margin-bottom:12px"><div style="font-size:12px;font-weight:600;color:${color};margin-bottom:4px">${title} (${items.length})</div>${items.slice(0, 6).map(o => `<div style="font-size:13px;line-height:1.8">${f(o)}</div>`).join('')}${items.length > 6 ? `<div style="font-size:12px;color:#6b6b6b">+${items.length - 6} more</div>` : ''}</div>` : '';
  const parts = [
    sect('Problems', '#c1121f', d.needs_attention, o => link(o, esc(o.why))),

async function saveSendDate(id, remove) {
  const date = remove ? '' : (document.getElementById('sd-input') || {}).value || '';

  if (!confirm(remove ? 'Remove the send date? The order will no longer be scheduled.' : `Change the send date to ${date}? Any approval is withdrawn, so approve it again after.`)) return;

async function adminUserAdd() {
  const v = id => document.getElementById(id).value;
  const r = await pgCall('/api/admin/admin-users', 'POST', { username: v('au-name'), password: v('au-pass'), current_password: v('au-me') });
  if (!r.ok) { document.getElementById('au-msg').textContent = r.error || 'Could not add.'; return; }
  showAdminUsers({ username: r.username, secret: r.secret });
}
async function adminUserAct(action, username) {
  const me = prompt(action === 'remove' ? `Remove ${username}? Enter your own password to confirm.` : 'Enter your own password to confirm.');
  if (!me) return;
  const body = { username, current_password: me };
  if (action === 'password') { const pw = prompt('New password for ' + username + ' (12 or more characters):'); if (!pw) return; body.password = pw; }
  const r = await pgCall('/api/admin/admin-users/' + action, 'POST', body);
  if (!r.ok) return alert(r.error || 'Could not do that.');
  showAdminUsers(action === 'reset-2fa' ? { username, secret: r.secret } : null);
}

// Search: press / anywhere (outside a text box) or click the topbar button.
let _srchTimer = null;
function openSearch() {
  let o = document.getElementById('srch-overlay');
  if (!o) {
    o = document.createElement('div'); o.id = 'srch-overlay';
    o.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10000;display:flex;justify-content:center;align-items:flex-start;padding-top:12vh';
    o.innerHTML = `<div style="background:#fff;width:min(640px,92vw);box-shadow:0 10px 40px rgba(0,0,0,.25)"><input id="srch-input" type="search" placeholder="Search orders by number, name, email, address or letter id" style="width:100%;padding:16px 18px;font-size:15px;border:0;border-bottom:1px solid #ececec;outline:0;box-sizing:border-box" autocomplete="off"><div id="srch-res" style="max-height:50vh;overflow:auto"></div><div style="padding:8px 14px;font-size:11px;color:#9a9a9a">Enter opens the first result. Esc closes.</div></div>`;
    o.addEventListener('mousedown', e => { if (e.target === o) closeSearch(); });
    document.body.appendChild(o);
    const inp = o.querySelector('#srch-input');
    inp.addEventListener('input', () => { clearTimeout(_srchTimer); _srchTimer = setTimeout(runSearch, 200); });
    inp.addEventListener('keydown', e => { if (e.key === 'Escape') closeSearch(); if (e.key === 'Enter') { const a = document.querySelector('#srch-res a'); if (a) a.click(); } });
  }
  o.style.display = 'flex';
  const inp = document.getElementById('srch-input'); inp.value = ''; document.getElementById('srch-res').innerHTML = ''; inp.focus();
}
function closeSearch() { const o = document.getElementById('srch-overlay'); if (o) o.style.display = 'none'; }
async function runSearch() {
  const q = document.getElementById('srch-input').value.trim();
  const box = document.getElementById('srch-res');
  if (q.length < 2) { box.innerHTML = ''; return; }
  const r = await api('/api/admin/search?q=' + encodeURIComponent(q));
  const list = (r && r.orders) || [];
  box.innerHTML = list.length ? list.map(o => `<a href="/admin/orders/${o.id}" onclick="event.preventDefault();closeSearch();go('/admin/orders/${o.id}')" style="display:block;padding:10px 18px;border-bottom:1px solid #f3f3f3;text-decoration:none;color:#111;font-size:13px;line-height:1.5"><strong>#${o.id}</strong> ${esc(o.recipient_name || '')} <span style="color:#6b6b6b">· ${esc(o.recipient_city || '')} ${esc(o.destination_country || '')} · ${esc(o.customer_email || '')} · ${esc(o.status)}${o.scheduled_date ? ' · sends ' + esc(o.scheduled_date) : ''}</span></a>`).join('')
    : '<div style="padding:16px 18px;font-size:13px;color:#6b6b6b">No orders found.</div>';
}
document.addEventListener('keydown', e => {
  if (e.key !== '/' || e.metaKey || e.ctrlKey || e.altKey) return;
  const tg = e.target && e.target.tagName;
  if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT' || (e.target && e.target.isContentEditable)) return;
  e.preventDefault(); openSearch();
});

// ── Content and links: calendar of planned articles, social posts and outreach, plus the backlink log ──
let _ct = { month: '', items: [], ideas: [], summary: null, links: [], editing: null, tab: 'calendar' };
const CT_KIND = { article: ['Article', '#1d4ed8', '#dbeafe'], social: ['Social', '#7c3aed', '#ede9fe'], outreach: ['Outreach', '#b45309', '#fef3c7'], other: ['Other', '#374151', '#e5e7eb'] };
const CT_STATUS = ['idea', 'drafted', 'scheduled', 'done'];
function ctShift(m, n) { let [y, mo] = m.split('-').map(Number); mo += n; while (mo > 12) { mo -= 12; y++; } while (mo < 1) { mo += 12; y--; } return `${y}-${String(mo).padStart(2, '0')}`; }

async function showContent(month, tab) {
  setTitle('Content and links');
  if (tab) _ct.tab = tab;
  const d = await api('/api/admin/content' + (month ? '?month=' + month : ''));
  if (!d) return setMain('<div class="empty">Could not load this section.</div>');
  const l = await api('/api/admin/backlinks');
  _ct = { ..._ct, month: d.month, items: d.items, ideas: d.ideas, summary: d.summary, links: (l && l.links) || [] };
  renderContent();
}
function ctBar(done, target, color) {
  const pct = Math.min(100, Math.round(done / Math.max(1, target) * 100));
  return `<div style="height:6px;background:#ececec;margin-top:6px"><div style="height:6px;width:${pct}%;background:${color}"></div></div>`;
}
function ctChip(i) {
  const k = CT_KIND[i.kind] || CT_KIND.other, done = i.status === 'done', over = !done && i.planned_date && i.planned_date < _ct.summary.today;
  return `<button onclick="ctEdit(${i.id})" title="${esc(k[0] + ': ' + i.title + ' (' + i.status + ')')}" style="display:block;width:100%;text-align:left;border:0;cursor:pointer;font:inherit;font-size:10px;line-height:1.4;margin-top:2px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:${done ? '#dcfce7' : over ? '#fee2e2' : k[2]};color:${done ? '#166534' : over ? '#991b1b' : k[1]};${done ? 'text-decoration:line-through;' : ''}">${done ? '✓ ' : ''}${esc(i.title)}</button>`;
}
function ctGrid() {
  const [y, m] = _ct.month.split('-').map(Number), today = _ct.summary.today, pad = n => String(n).padStart(2, '0');
  const start = new Date(Date.UTC(y, m - 1, 1)).getUTCDay(), days = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const by = {}; _ct.items.forEach(i => (by[i.planned_date] = by[i.planned_date] || []).push(i));
  let cells = '';
  for (let i = 0; i < start; i++) cells += '<div style="background:#fafafa"></div>';
  for (let d = 1; d <= days; d++) {
    const key = `${y}-${pad(m)}-${pad(d)}`, items = by[key] || [];
    cells += `<div style="min-height:72px;padding:4px 6px;border:1px solid #ececec;margin:0 -1px -1px 0;background:${key === today ? '#f4f4f4' : '#fff'};min-width:0;cursor:pointer" onclick="if(event.target===this||event.target.tagName==='DIV')ctNew('${key}')">
      <div style="font-size:11px;color:${key < today ? '#b0b0b0' : '#6b6b6b'};${key === today ? 'font-weight:700;color:#111' : ''}">${d}</div>${items.slice(0, 3).map(ctChip).join('')}${items.length > 3 ? `<div style="font-size:10px;color:#6b6b6b;margin-top:2px">+${items.length - 3} more</div>` : ''}</div>`;
  }
  const name = new Date(Date.UTC(y, m - 1, 1)).toLocaleString('en-CA', { month: 'long', year: 'numeric', timeZone: 'UTC' });
  return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><button class="btn btn-outline btn-sm" onclick="showContent('${ctShift(_ct.month, -1)}')">←</button><div style="font-size:14px;font-weight:600;min-width:140px;text-align:center">${name}</div><button class="btn btn-outline btn-sm" onclick="showContent('${ctShift(_ct.month, 1)}')">→</button><button class="btn btn-outline btn-sm" onclick="showContent('${today.slice(0, 7)}')">Today</button><span style="font-size:11px;color:#9a9a9a">Click a day to add something</span></div>
    <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:10px;color:#9a9a9a;margin-bottom:2px">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x => `<div>${x}</div>`).join('')}</div>
    <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid #ececec;border-left:1px solid #ececec">${cells}</div>`;
}
function renderContent() {

    <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">${tabBtn('calendar', 'Calendar')}${tabBtn('ideas', `Ideas (${_ct.ideas.length})`)}${tabBtn('links', 'Backlinks')}<button class="btn btn-outline btn-sm" onclick="ctNew('')" style="margin-left:auto">+ Add</button></div>
    <div id="ct-form"></div>

    ${tab === 'ideas' ? ctIdeas() : ''}

// ── Print Queue: send-date calendar and list for scheduled orders ───────────────────────────────
let _pq = { today: '', orders: [] };
function pqSchedule() {
  const list = _pq.orders, today = _pq.today;
  if (!list.length) return '';
  const byDate = {};
  list.forEach(o => (byDate[o.date] = byDate[o.date] || []).push(o));
  const first = (today && today < list[0].date ? today : list[0].date).slice(0, 7);
  const lastMonth = list[list.length - 1].date.slice(0, 7);
  const months = [];
  for (let [y, m] = first.split('-').map(Number); `${y}-${String(m).padStart(2, '0')}` <= lastMonth && months.length < 12; m++) {
    if (m > 12) { m = 1; y++; }
    months.push([y, m]);
  }
  const chip = o => `<a href="/admin/orders/${o.id}" onclick="event.preventDefault();go('/admin/orders/${o.id}')" title="${esc((o.name || '') + (o.approved ? ' (approved)' : ' (not approved)'))}" style="display:block;font-size:10px;line-height:1.4;margin-top:2px;padding:1px 4px;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:${o.held ? '#fee2e2' : o.approved ? '#dcfce7' : '#fef3c7'};color:${o.held ? '#991b1b' : o.approved ? '#166534' : '#92400e'}">#${o.id} ${esc(o.name || '')}</a>`;
  const grid = ([y, m]) => {
    const pad = n => String(n).padStart(2, '0');
    const start = new Date(Date.UTC(y, m - 1, 1)).getUTCDay(), days = new Date(Date.UTC(y, m, 0)).getUTCDate();
    let cells = '';
    for (let i = 0; i < start; i++) cells += '<div style="background:#fafafa"></div>';
    for (let d = 1; d <= days; d++) {
      const key = `${y}-${pad(m)}-${pad(d)}`, items = byDate[key] || [];
      const isToday = key === today, past = key < today;
      cells += `<div style="min-height:64px;padding:4px 6px;border:1px solid #ececec;margin:0 -1px -1px 0;background:${isToday ? '#f4f4f4' : '#fff'};min-width:0">
        <div style="font-size:11px;color:${past ? '#b0b0b0' : '#6b6b6b'};${isToday ? 'font-weight:700;color:#111' : ''}">${d}</div>${items.slice(0, 3).map(chip).join('')}${items.length > 3 ? `<div style="font-size:10px;color:#6b6b6b;margin-top:2px">+${items.length - 3} more</div>` : ''}</div>`;
    }
    const name = new Date(Date.UTC(y, m - 1, 1)).toLocaleString('en-CA', { month: 'long', year: 'numeric', timeZone: 'UTC' });
    return `<div style="margin-bottom:20px"><div style="font-size:13px;font-weight:600;margin-bottom:6px">${name}</div>
      <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:10px;color:#9a9a9a;margin-bottom:2px">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x => `<div>${x}</div>`).join('')}</div>
      <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid #ececec;border-left:1px solid #ececec">${cells}</div></div>`;
  };
  const rows = list.map(o => {
    const overdue = o.date <= today;
    return `<tr><td style="padding:8px 10px;white-space:nowrap">${esc(o.date)}${overdue ? ' <span style="color:#c1121f;font-size:11px">due</span>' : ''}</td>
      <td style="padding:8px 10px"><a class="link" href="/admin/orders/${o.id}" onclick="event.preventDefault();go('/admin/orders/${o.id}')">#${o.id}</a> ${esc(o.name || '')}${o.country && o.country !== 'CA' ? ' · ' + esc(o.country) : ''}${o.santa ? ' · Santa' : ''}</td>
      <td style="padding:8px 10px">${o.held ? '<span style="color:#991b1b">Held for content review</span>' : o.approved ? '<span style="color:#166534">Approved, sends automatically</span>' : '<span style="color:#92400e">Not approved yet</span>'}${o.error && !/^MANUAL: Scheduled/.test(o.error) && !o.held ? `<div style="font-size:11px;color:#c1121f">${esc(o.error.replace(/^(MANUAL|RETRY): /, ''))}</div>` : ''}</td>
      <td style="padding:8px 10px;text-align:right;white-space:nowrap">${o.held ? '' : o.approved
        ? `<button class="btn btn-outline btn-sm" onclick="pqAct(${o.id},'unapprove-scheduled')">Withdraw approval</button>`
        : (o.date > today ? `<button class="btn btn-primary btn-sm" onclick="pqAct(${o.id},'approve-scheduled')">Approve</button>` : `<a class="btn btn-primary btn-sm" href="/admin/approvals" onclick="event.preventDefault();go('/admin/approvals')">Open approvals</a>`)}</td></tr>`;
  }).join('');
  const approvedN = list.filter(o => o.approved).length;
  return `<div class="card no-print" style="margin-bottom:24px"><div class="card-header"><div class="card-title">Scheduled to send (${list.length})</div></div>
    <div style="padding:14px 20px">
      <div style="font-size:12px;color:#6b6b6b;line-height:1.6;margin-bottom:14px">${approvedN} approved, ${list.length - approvedN} still need your approval. Approved orders go to print on their date by themselves. <span style="background:#dcfce7;color:#166534;padding:1px 6px">approved</span> <span style="background:#fef3c7;color:#92400e;padding:1px 6px">not approved</span> <span style="background:#fee2e2;color:#991b1b;padding:1px 6px">held</span></div>
      ${months.map(grid).join('')}
      <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px"><tbody>${rows}</tbody></table></div>
    </div></div>`;
}

  _msgTemplates.forEach(t => { const o = document.createElement('option'); o.value = t.id; o.textContent = t.name; sel.appendChild(o); });
}

function applyMsgTemplate() {
  const t = _msgTemplates.find(x => String(x.id) === document.getElementById('msg-template').value);
  if (!t) return;
  document.getElementById('msg-subject').value = fillMerge(t.subject);
  document.getElementById('msg-body').value = fillMerge(t.body);
}
// Merge fields in templates: {name} {order} {recipient} {send_date} {country}
let _mergeOrder = null;
function fillMerge(text) {
  const o = _mergeOrder; if (!o) return text;
  const first = String(o.sender_name || '').trim().split(/\s+/)[0] || 'there';
  const map = { name: first, order: o.public_ref || ('#' + o.id), recipient: o.recipient_name || '', send_date: o.scheduled_date || 'the next business day', country: o.destination_country || '' };
  return String(text).replace(/\{(name|order|recipient|send_date|country)\}/g, (m, k) => map[k]);
}

async function loadMsgHistory(id) {
  const box = document.getElementById('msg-history');
  const rows = (await api(`/api/admin/orders/${id}/emails`)) || [];
  box.innerHTML = rows.length ? rows.map(r => `<div class="email-hist-item"><strong>${esc(r.subject)}</strong> <span style="color:#888">${fmtDateTime(r.created_at)} · ${esc(String(r.type || '').replace(/_/g, ' '))}</span>${r.body ? `<pre>${esc(r.body)}</pre>` : ''}</div>`).join('')
    : '<div class="notif-empty" style="padding:6px 0">No emails sent yet.</div>';
}

async function sendMessage(id) {
  const subject = document.getElementById('msg-subject').value.trim();
  const body    = document.getElementById('msg-body').value.trim();
  if (!subject || !body) return alert('Subject and message are required.');
  const r = await post(`/api/admin/orders/${id}/message`, { subject, body });
  if (r?.ok) {
    const s = document.getElementById('msg-status');
    s.style.display = 'inline';
    document.getElementById('msg-body').value = '';
    setTimeout(() => s.style.display = 'none', 3000);
    loadMsgHistory(id);
  } else {
    alert('Could not send: ' + (r?.error || 'unknown error'));
  }
}

// ── Notifications (new paid orders + unread contact messages) ────────────────
const NOTIF_KEY = 'lh-admin-notif-seen';
let _notifItems = [];
let _notifSince = null;
let _notifFirst = true;

const NOTIF_READ_KEY = 'lh-admin-notif-read';   // notifications clicked one by one
let _notifUnreadContacts = 0;
function readKeys() { try { return new Set(JSON.parse(localStorage.getItem(NOTIF_READ_KEY) || '[]')); } catch { return new Set(); } }
function writeKeys(set) { try { localStorage.setItem(NOTIF_READ_KEY, JSON.stringify([...set].slice(-300))); } catch {} }
function readSeen() { try { return localStorage.getItem(NOTIF_KEY); } catch { return null; } }
function writeSeen(v) { try { localStorage.setItem(NOTIF_KEY, v); } catch {} }

function showToast(text, onClick) {
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = text;
  el.onclick = () => { el.remove(); if (onClick) onClick(); };
  document.getElementById('toast-stack').appendChild(el);
  setTimeout(() => el.remove(), 9000);
}

function renderNotifs(unreadContacts) {
  const n = _notifItems.length;
  const badge = document.getElementById('notif-count');
  badge.textContent = n > 99 ? '99+' : n; badge.style.display = n ? 'grid' : 'none';
  document.title = (n ? `(${n}) ` : '') + 'Letterhome Admin';
  const list = document.getElementById('notif-list');
  list.innerHTML = n ? _notifItems.map((it, i) => `<button class="notif-item" onclick="openNotif(${i})">${it.html}<small>${esc(it.when)}</small></button>`).join('')
    : '<div class="notif-empty">Nothing new.</div>';
  document.getElementById('notif-foot').innerHTML = unreadContacts ? `<button onclick="go('/admin/contacts')">${unreadContacts} unread contact message${unreadContacts > 1 ? 's' : ''} →</button>` : '';
}

function openNotif(i) {
  const it = _notifItems[i];
  document.getElementById('notif-panel').style.display = 'none';
  if (!it) return;
  // Clicking one marks just that one as read; the rest stay until they are clicked or "Mark all read" is used.
  const keys = readKeys(); keys.add(it.key); writeKeys(keys);
  _notifItems = _notifItems.filter(x => x.key !== it.key);
  renderNotifs(_notifUnreadContacts);
  go(it.path);
}

function toggleNotifPanel() {
  const p = document.getElementById('notif-panel');
  const open = p.style.display === 'none';
  p.style.display = open ? 'block' : 'none';
  document.getElementById('notif-btn').setAttribute('aria-expanded', open);
  if (open && 'Notification' in window && Notification.permission === 'default') Notification.requestPermission();
}

function markNotifsRead() {
  if (_notifSince) writeSeen(_notifSince);
  try { localStorage.removeItem(NOTIF_READ_KEY); } catch {}   // everything before now is read, so the single-item list can start over
  _notifItems = []; renderNotifs(_notifUnreadContacts);
  document.getElementById('notif-panel').style.display = 'none';
}

async function pollNotifications() {
  const seen = readSeen();
  const d = await api('/api/admin/notifications' + (seen ? `?since=${encodeURIComponent(seen)}` : ''), { background: true });
  if (!d) return;
  _notifSince = d.now;
  if (d.mailUnread) updateMailBadge(d.mailUnread);
  if (typeof d.unreadContacts === 'number') { window._unreadContacts = d.unreadContacts; refreshBadges(); }
  if (!seen) { writeSeen(d.now); } // first ever visit: start counting from now, not the whole history
  const items = [];
  (seen ? d.orders : []).forEach(o => items.push({ key: 'o' + o.id, path: `/admin/orders/${o.id}`,
    html: `<strong>New order #${o.id}</strong> · $${(o.price_cents / 100).toFixed(2)} CAD<br>${esc(o.recipient_name || '')} (${esc(o.destination_country || '')})`, when: fmtDateTime(o.paid_at) }));
  (seen ? (d.mail || []) : []).forEach(m => items.push({ key: 'm' + m.box + m.id, path: '/admin/mail?box=' + encodeURIComponent(m.box) + '&id=' + encodeURIComponent(m.id) + '&folder=' + encodeURIComponent(m.folderId || ''),
    html: `<strong>New email (${esc(m.label || m.box)})</strong><br>${esc(String(m.from || '').replace(/<[^>]*>/g, '').trim())}: ${esc(m.subject || '')}`, when: fmtDateTime(new Date(m.at).toISOString().slice(0, 19).replace('T', ' ')) }));
  (seen ? d.contacts : []).forEach(c => items.push({ key: 'c' + c.id, path: '/admin/contacts?id=' + c.id,
    html: `<strong>Message from ${esc(c.name)}</strong><br>${esc(c.preview)}`, when: fmtDateTime(c.created_at) }));
  const readNow = readKeys();
  const unreadItems = items.filter(i => !readNow.has(i.key));
  const known = new Set(_notifItems.map(i => i.key));
  const fresh = unreadItems.filter(i => !known.has(i.key));
  _notifItems = unreadItems;
  if (!_notifFirst) fresh.forEach(i => {
    const plain = i.html.replace(/<br>/g, ' · ').replace(/<[^>]+>/g, '');
    showToast(plain, () => go(i.path));
    try { if ('Notification' in window && Notification.permission === 'granted' && document.hidden) new Notification('Letterhome', { body: plain }); } catch {}
  });
  _notifFirst = false;
  _notifUnreadContacts = d.unreadContacts;
  renderNotifs(d.unreadContacts);
}

function startNotifications() {
  pollNotifications();
  setInterval(() => { if (!document.hidden) pollNotifications(); }, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) pollNotifications(); });
  document.addEventListener('click', e => { if (!e.target.closest('.notif-wrap')) document.getElementById('notif-panel').style.display = 'none'; });
}

// Like post(), but returns the server's error message instead of null so it can be shown.
async function pgCall(url, method = 'POST', payload) {
  try {
    const headers = { 'Content-Type': 'application/json' };
    if (_csrfToken) headers['X-CSRF-Token'] = _csrfToken;
    const r = await fetch(url, { method, headers, body: method === 'GET' ? undefined : JSON.stringify(payload || {}) });
    if (r.status === 401) { window.location.href = '/admin/login'; return { ok: false }; }
    const data = await r.json().catch(() => ({}));
    return r.ok ? { ok: true, ...data } : { ok: false, error: data.error || ('HTTP ' + r.status) };
  } catch (e) { return { ok: false, error: e.message }; }
}
