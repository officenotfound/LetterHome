function leShow(r, fallback) {
  const m = document.getElementById('le-msg'); if (!m) return;
  if (!r || r.ok === false || r.error) { m.style.color = '#b42318'; m.textContent = (r && r.error) || fallback; return false; }
  return true;
}
async function leDone(id, r) {
  const bits = [];
  if (r.pages != null) bits.push(r.pages + (r.pages === 1 ? ' page' : ' pages') + (r.paid_pages != null && r.pages > r.paid_pages ? ` (the customer paid for ${r.paid_pages}; ${r.pages - r.paid_pages} more than paid)` : ''));
  if (r.flagged) bits.push('flagged by the content check, so it is held until you mark it safe');
  const warn = (r.paid_pages != null && r.pages > r.paid_pages) || r.flagged;
  await showOrder(id);
  const m = document.getElementById('le-msg'); const d = m && m.closest('details'); if (d) d.open = true;
  if (m) { m.style.color = warn ? '#b54708' : '#067647'; m.textContent = 'Saved.' + (bits.length ? ' Now ' + bits.join('; ') + '.' : ''); }
}
async function saveLetterText(id) {
  const t = document.getElementById('le-text'); const m = document.getElementById('le-msg');
  if (m) { m.style.color = '#6b6b6b'; m.textContent = 'Saving…'; }
  const r = await post(`/api/admin/orders/${id}/letter`, { letter_body: t.value });
  if (!leShow(r, 'Could not save')) return;
  if (r.unchanged) { m.style.color = '#6b6b6b'; m.textContent = 'No changes to save.'; return; }
  leDone(id, r);
}
async function addAttachments(id) {
  const inp = document.getElementById('le-files'); const m = document.getElementById('le-msg');
  if (!inp.files.length) { m.style.color = '#b42318'; m.textContent = 'Choose at least one file.'; return; }
  const fd = new FormData(); [...inp.files].forEach(f => fd.append('attachments', f));
  m.style.color = '#6b6b6b'; m.textContent = 'Uploading and checking…';
  let r;
  try {
    const resp = await fetch(`/api/admin/orders/${id}/attachments`, { method: 'POST', body: fd, headers: { 'X-CSRF-Token': _csrfToken || '' } });
    if (resp.status === 401) { window.location.href = '/admin/login'; return; }
    r = await resp.json().catch(() => ({ error: 'HTTP ' + resp.status }));
  } catch (e) { r = { error: 'Network error' }; }
  if (!leShow(r, 'Could not add the files')) return;
  leDone(id, r);
}
async function removeAttachment(id, name, label) {
  if (!confirm('Remove "' + label + '" from this order? The file is kept on the server, not deleted.')) return;
  const r = await del(`/api/admin/orders/${id}/attachments/${encodeURIComponent(name)}`);
  if (!leShow(r, 'Could not remove the file')) return;
  leDone(id, r);
}

function addressCard(o) {
  const locked = (o.postgrid_letter_id && o.postgrid_status !== 'cancelled') || ['mailed', 'delivered', 'refunded', 'awaiting_payment'].includes(o.status);
  const f = (id, label, val, wide) => `<div class="field" style="margin:0;${wide ? 'grid-column:1/-1' : ''}"><label for="ad-${id}">${label}</label><input type="text" id="ad-${id}" value="${esc(val || '')}"${locked ? ' disabled' : ''}></div>`;
  const countryOpts = Object.entries(COUNTRIES || {}).sort((a, b) => a[1].localeCompare(b[1])).map(([c, n]) => `<option value="${esc(c)}"${c === o.destination_country ? ' selected' : ''}>${esc(n)} (${esc(c)})</option>`).join('');
  const open = o.postgrid_error && !locked ? ' open' : '';
  return `<details class="card" style="margin-bottom:24px"${open}>
    <summary class="card-header" style="cursor:pointer"><span class="card-title">Fix addresses</span><span style="font-size:12px;color:#6b6b6b;font-weight:400">${locked ? 'Locked: a letter is already with PostGrid or the order is finished' : 'Change anything below, then save'}</span></summary>
    <div style="padding:16px 20px">
      <div style="font-weight:600;margin-bottom:8px">Recipient</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px">
        ${f('r-name', 'Name', o.recipient_name)}${f('r-street', 'Street (use new lines in the box for line 2)', o.recipient_street)}
        ${f('r-city', 'City', o.recipient_city)}${f('r-province', 'Province / state', o.recipient_province)}${f('r-postal', 'Postal code', o.recipient_postal)}
        <div class="field" style="margin:0"><label for="ad-r-country">Destination country</label><select id="ad-r-country"${locked ? ' disabled' : ''}>${countryOpts}</select></div>
      </div>
      <div style="font-weight:600;margin:18px 0 8px">Return address</div>
      <label style="display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:10px"><input type="checkbox" id="ad-skip"${o.skip_return ? ' checked' : ''}${locked ? ' disabled' : ''} onchange="document.getElementById('ad-sender').style.opacity=this.checked?.45:1"> Use the Letterhome return address instead of the customer's</label>
      <label style="display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:0 0 10px"><input type="checkbox" id="ad-inbody"${o.return_in_body ? ' checked' : ''}${locked ? ' disabled' : ''} style="margin-top:3px"> <span>Also print the customer's return address at the top of the letter<br><span style="color:#6b6b6b;font-size:12px">Only added if it does not push the letter past the pages they paid for (2 are included). If it would, it is left out and a note is added to the order.</span></span></label>
      ${(o.blank_return_allowed || o.blank_return) ? `<label style="display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:0 0 10px"><input type="checkbox" id="ad-blank"${o.blank_return ? ' checked' : ''}${locked || !o.blank_return_allowed ? ' disabled' : ''} style="margin-top:3px"><span><strong>Send with no return address at all</strong> (only when "Skip return address" is ticked). Nothing is printed in the return corner. Risk: if the letter cannot be delivered it may not come back, and returned letters are never re-mailed or refunded.${o.blank_return_allowed ? '' : ' <em>Switched off in Settings, PostGrid.</em>'}</span></label>` : ''}
      <div id="ad-sender" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;opacity:${o.skip_return ? .45 : 1}">
        ${f('s-name', 'Name', o.sender_name)}${f('s-street', 'Street', o.sender_street)}${f('s-city', 'City', o.sender_city)}
        ${f('s-province', 'Province / state', o.sender_province)}${f('s-postal', 'Postal code', o.sender_postal)}${f('s-country', 'Country', o.sender_country)}
      </div>
      <p style="font-size:12px;color:#6b6b6b;margin:12px 0 0;line-height:1.5">Changing the destination country does not change what the customer paid. Every edit is saved to the order's notes and the audit log.</p>
      ${locked ? '' : `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
        <button class="btn btn-outline btn-sm" onclick="saveAddresses(${o.id}, false)">Save</button>
        ${o.postgrid_configured && o.status === 'paid' ? `<button class="btn btn-primary btn-sm" onclick="saveAddresses(${o.id}, true)">Save and send via PostGrid</button>` : ''}
        ${o.sender_street && !o.skip_return ? `<button class="btn btn-outline btn-sm" onclick="document.getElementById('ad-skip').checked=true;saveAddresses(${o.id}, ${o.postgrid_configured && o.status === 'paid'})">${o.postgrid_configured && o.status === 'paid' ? 'Use Letterhome return address and send' : 'Use Letterhome return address'}</button>` : ''}

async function saveAddresses(id, resend) {
  const v = k => document.getElementById('ad-' + k)?.value ?? '';
  const msg = document.getElementById('ad-msg');
  if (resend && !confirm('Save these addresses and send the letter through PostGrid now?')) return;
  if (msg) { msg.style.color = '#6b6b6b'; msg.textContent = 'Saving…'; }
  const r = await post(`/api/admin/orders/${id}/addresses`, {
    recipient_name: v('r-name'), recipient_street: v('r-street'), recipient_city: v('r-city'), recipient_province: v('r-province'), recipient_postal: v('r-postal'),
    destination_country: v('r-country'),
    sender_name: v('s-name'), sender_street: v('s-street'), sender_city: v('s-city'), sender_province: v('s-province'), sender_postal: v('s-postal'), sender_country: v('s-country'),
    ...(document.getElementById('ad-blank') && !document.getElementById('ad-blank').disabled ? { blank_return: document.getElementById('ad-blank').checked ? 1 : 0 } : {}),
    skip_return: document.getElementById('ad-skip')?.checked ? 1 : 0, return_in_body: document.getElementById('ad-inbody')?.checked ? 1 : 0, resend: !!resend,
  });
  if (!r || r.ok === false || r.error) { if (msg) { msg.style.color = '#b42318'; msg.textContent = (r && r.error) || 'Could not save'; } return; }
  if (r.resend && !r.resend.ok) { await showOrder(id); const m2 = document.getElementById('pg-msg'); if (m2) { m2.style.color = '#b42318'; m2.textContent = 'Saved, but PostGrid said: ' + r.resend.error; } return; }
  showOrder(id);
}

function postgridCard(o) {
  if (!o.postgrid_configured) return '';
  const row = (k, v) => `<div class="detail-row"><span class="detail-label">${k}</span><span class="detail-value">${v}</span></div>`;
  const err = o.postgrid_error ? `<div style="background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:10px 12px;font-size:13px;margin:10px 0;line-height:1.5">${esc(o.postgrid_error)}</div>` : '';
  const modeBadge = m => m === 'live' ? '<span class="badge badge-green">LIVE</span>' : '<span class="badge badge-amber">TEST</span>';
  const later = (o.scheduled_date && o.scheduled_date > (o.today_toronto || '')) ? { date: o.scheduled_date, approved: !!o.send_approved_at } : null;
  const dateRow = (o.status === 'paid' && (!o.postgrid_letter_id || o.postgrid_status === 'cancelled'))
    ? `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0;font-size:13px"><span style="color:#6b6b6b">Send date</span>
        <input type="date" id="sd-input" value="${esc(o.scheduled_date || '')}" min="${esc(o.today_toronto || '')}" style="width:auto;padding:4px 8px">
        <button class="btn btn-outline btn-sm" onclick="saveSendDate(${o.id})">Save date</button>
        ${o.scheduled_date ? `<button class="btn btn-outline btn-sm" onclick="saveSendDate(${o.id}, true)">Remove date</button>` : ''}
        <span style="font-size:11px;color:#9a9a9a">Changing the date withdraws any approval.</span></div>` : '';
  let body;
  if (o.postgrid_letter_id) {
    const canCancel = o.postgrid_status === 'ready';
    body = row('Letter', `<span style="font-family:monospace;font-size:12px">${esc(o.postgrid_letter_id)}</span> ${modeBadge(o.postgrid_mode)}`)
      + row('PostGrid status', esc(o.postgrid_status || '—'))
      + (o.postgrid_tracking_number ? row('Tracking number', esc(o.postgrid_tracking_number)) : '')
      + row('Submitted', o.postgrid_submitted_at ? fmtDateTime(o.postgrid_submitted_at) : '—')
      + err
      + ((later && o.postgrid_status === 'cancelled' && o.status === 'paid') ? `<div style="font-size:13px;line-height:1.6;padding:10px 12px;margin:8px 0;background:${later.approved ? '#dcfce7' : '#fef3c7'};color:${later.approved ? '#166534' : '#92400e'}"><strong>${later.approved ? 'Approved.' : 'Scheduled.'}</strong> The customer chose <strong>${esc(later.date)}</strong> as the send date, but the first letter was already sent to print. ${later.approved ? 'A new letter goes to print automatically that day.' : 'Approve it and a new letter goes to print automatically that day.'}</div>` : '')
      + (o.postgrid_status === 'cancelled' ? dateRow : '')
      + `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
          ${o.postgrid_url ? `<a class="btn btn-outline btn-sm" href="${esc(o.postgrid_url)}" target="_blank" rel="noopener">PostGrid preview</a>` : ''}
          <button class="btn btn-outline btn-sm" onclick="pgAction(${o.id},'refresh')">Refresh status</button>
          ${canCancel ? `<button class="btn btn-outline btn-sm" style="color:#b42318;border-color:#b42318" onclick="pgAction(${o.id},'cancel')">Cancel letter</button>` : ''}
          ${(o.postgrid_status === 'cancelled' && o.status === 'paid' && o.letter_type === 'santa') ? `<button class="btn btn-outline btn-sm" onclick="pgAction(${o.id},'rebuild-santa')" title="Rewrites the letter with the current wording, then it prints on the Santa letterhead">Rebuild Santa letter</button><a class="btn btn-outline btn-sm" href="/api/admin/orders/${o.id}/postgrid/preview" target="_blank" rel="noopener">Preview letter</a>` : ''}
          ${(o.postgrid_status === 'cancelled' && o.status === 'paid' && later) ? (later.approved
            ? `<button class="btn btn-outline btn-sm" onclick="pgAction(${o.id},'unapprove-scheduled')">Withdraw approval</button>`
            : `<button class="btn btn-primary btn-sm" onclick="pgAction(${o.id},'approve-scheduled')">Approve, send on ${esc(later.date)}</button>`) : ''}
          ${(o.postgrid_status === 'cancelled' && o.status === 'paid') ? `<button class="btn ${later ? 'btn-outline' : 'btn-primary'} btn-sm" onclick="pgAction(${o.id},'submit')">${later ? 'Send now instead' : 'Send via PostGrid again'}</button>` : ''}
          ${o.postgrid_mode === 'test' && !['completed','cancelled'].includes(o.postgrid_status) ? `<button class="btn btn-outline btn-sm" onclick="pgAction(${o.id},'progress')">Advance test letter</button>` : ''}
          ${o.postgrid_mode === 'test' ? `<button class="btn btn-outline btn-sm" onclick="pgAction(${o.id},'clear-test')">Clear test letter</button>` : ''}
        </div>
        ${(o.postgrid_status === 'cancelled' && o.status === 'paid') ? `<p style="font-size:12px;color:#6b6b6b;margin-top:10px;line-height:1.5">This letter was cancelled at PostGrid. Sending again creates a new letter with the order's current return address, and the customer gets an update email.</p>` : ''}
        ${o.postgrid_mode === 'test' ? `<p style="font-size:12px;color:#92400e;margin-top:10px;line-height:1.5">Test letter: nothing is mailed, and the customer's order status and emails are not affected. Clear it to send this order for real once the live key is in place.</p>` : ''}`;
  } else {
    const why = o.postgrid_eligibility;
    body = row('Mode', modeBadge(o.postgrid_api_mode))
      + (later ? `<div style="font-size:13px;line-height:1.6;padding:10px 12px;margin:8px 0;background:${later.approved ? '#dcfce7' : '#fef3c7'};color:${later.approved ? '#166534' : '#92400e'}"><strong>${later.approved ? 'Approved.' : 'Scheduled.'}</strong> The customer chose <strong>${esc(later.date)}</strong> as the send date. ${later.approved ? 'It goes to print automatically that day. Nothing is sent before then.' : 'Approve it now and it goes to print automatically that day.'}</div>` : '')
      + dateRow
      + (why ? `<p style="font-size:13px;color:#6b6b6b;margin:8px 0;line-height:1.5">${esc(why)}</p>` : (later ? '' : `<p style="font-size:13px;color:#16a34a;margin:8px 0">Ready to send through PostGrid.</p>`))
      + err
      + `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
          <a class="btn btn-outline btn-sm" href="/api/admin/orders/${o.id}/postgrid/preview" target="_blank" rel="noopener" title="As it will look, with the addresses where PostGrid stamps them">Preview letter</a>
          <a class="btn btn-outline btn-sm" href="/api/admin/orders/${o.id}/postgrid/preview?raw=1" target="_blank" rel="noopener" title="The exact file uploaded to PostGrid (no addresses; PostGrid stamps them)">File sent to PostGrid</a>
          ${(o.letter_type === 'santa' && o.status === 'paid' && !o.postgrid_letter_id && !o.split_from && (o.letter_body||'').split('\f').filter(t => t.trim() && !t.trim().startsWith('#CERT#')).length > 1) ? `<button class="btn btn-outline btn-sm" onclick="pgAction(${o.id},'split-santa')" title="Makes one order per child so each letter goes in its own envelope and is approved and sent separately">Split into separate envelopes</button>${o.santa_separate ? ' <span style="font-size:12px;color:#b42318;font-weight:600">Customer asked for separate envelopes</span>' : ' <span style="font-size:12px;color:#6b6b6b">Customer chose one envelope</span>'}` : ''}
          ${(o.letter_type === 'santa' && o.status === 'paid') ? `<button class="btn btn-outline btn-sm" onclick="pgAction(${o.id},'rebuild-santa')" title="Rewrites the letter with the current wording">Rebuild Santa letter</button>` : ''}
          ${(later && o.status === 'paid') ? (later.approved
            ? `<button class="btn btn-outline btn-sm" onclick="pgAction(${o.id},'unapprove-scheduled')">Withdraw approval</button>`
            : `<button class="btn btn-primary btn-sm" onclick="pgAction(${o.id},'approve-scheduled')">Approve, send on ${esc(later.date)}</button>`) : ''}
          ${o.status === 'paid' ? (later ? `<button class="btn btn-outline btn-sm" onclick="pgAction(${o.id},'submit')" title="Ignores the customer's chosen date">Send now instead</button>` : `<button class="btn btn-primary btn-sm" onclick="pgAction(${o.id},'submit')">Send via PostGrid</button>`) : ''}
        </div>`;
  }
  return `<div class="card" style="margin-bottom:24px">
    <div class="card-header"><div class="card-title">PostGrid</div></div>
    <div style="padding:16px 20px">${body}<div id="pg-msg" style="font-size:12px;margin-top:10px"></div></div>
  </div>`;
}

async function pgAction(id, action) {
  const labels = { 'approve-scheduled': 'Approve this order? It goes to print automatically on the date the customer chose, not today.', 'unapprove-scheduled': 'Withdraw the approval? It will not be sent automatically.', submit: 'Send this letter through PostGrid now? If the customer chose a later send date, this ignores it.', cancel: 'Cancel this letter at PostGrid? It returns to the manual queue.', 'split-santa': 'Split this order into one order per child, so each letter goes in its own envelope? You then approve and send each one separately. The customer is not charged again.', 'rebuild-santa': 'Rewrite this Letter from Santa with the current wording? The child\'s details are kept.', 'clear-test': 'Clear the test letter from this order? The order stays paid and can then be sent for real.' };
  if (labels[action] && !confirm(labels[action])) return;
  const msg = document.getElementById('pg-msg');
  if (msg) { msg.style.color = '#6b6b6b'; msg.textContent = 'Working…'; }
  const r = await pgCall(`/api/admin/orders/${id}/postgrid/${action}`);
  if (!r.ok) { if (msg) { msg.style.color = '#b42318'; msg.textContent = r.error || 'Failed'; } return; }
  showOrder(id);
}

async function submitToPrinter(id) {
  const ref = document.getElementById('printer-ref').value.trim();
  if (!ref) return alert('Enter the printer reference number first.');
  const r = await post(`/api/admin/orders/${id}/submit-to-printer`, { printer_ref: ref });
  if (r?.ok) {
    document.getElementById('submit-msg').style.display = 'block';
    setTimeout(() => showOrder(id), 1200);
  } else {
    alert('Error: ' + (r?.error || 'could not save'));
  }
}

async function markMailed(id) {
  const est = document.getElementById('est-delivery').value.trim();
  if (!est) return alert('Enter the estimated delivery from the printer\'s email.');
  if (!confirm(`Mark as mailed and send the customer a notification email with estimated delivery: "${est}"?`)) return;
  const r = await post(`/api/admin/orders/${id}/mark-mailed`, { estimated_delivery: est });
  if (r?.ok) {
    document.getElementById('mailed-msg').style.display = 'block';
    setTimeout(() => showOrder(id), 1200);
  } else {
    alert('Error: ' + (r?.error || 'could not save'));
  }
}

function downloadAllFiles(orderId, files) {
  files.forEach((f, i) => {
    setTimeout(() => {
      const a = document.createElement('a');
      a.href = `/api/admin/orders/${orderId}/files/${encodeURIComponent(f)}`;
      a.download = f;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }, i * 600);
  });
}

async function updateStatus(id) {
  const status = document.getElementById('status-select').value;
  const r = await post(`/api/admin/orders/${id}/status`, { status });
  if (r?.ok) {
    const msg = document.getElementById('status-msg');
    msg.style.display = 'block';
    setTimeout(() => msg.style.display = 'none', 2500);
  }
}

async function showCustomers() {
  setTitle('Customers');
  const customers = await api('/api/admin/customers');
  if (!customers) return;

  const rows = customers.map(c => {
    const tags = c.tags.map(t => `<span class="tag" style="font-size:11px;padding:2px 8px">${esc(t)}</span>`).join('');
    const acctBadge = c.has_account
      ? '<span title="Has account" style="display:inline-block;font-size:10px;background:#dbeafe;color:#1e40af;padding:1px 7px;border-radius:0;font-weight:600;margin-left:6px">ACCOUNT</span>'
      : '';
    return `
    <tr>
      <td><button class="link" onclick="go('/admin/customers/${encodeURIComponent(c.email)}')">${esc(c.email)}${acctBadge}${c.display_name ? ` <span style="color:#9a9a9a;font-weight:400">(${esc(c.display_name)})</span>` : ''}</button></td>
      <td>${c.order_count}</td>
      <td>${fmtCAD(c.total_spent)}</td>
      <td>${fmtDate(c.last_order)}</td>
      <td>${tags || '<span style="color:#9a9a9a;font-size:12px">—</span>'}</td>
      <td>
        <button class="link" onclick="go('/admin/customers/${encodeURIComponent(c.email)}')">View</button>
        &nbsp;<button class="btn-ghost" onclick="deleteCustomer('${encodeURIComponent(c.email)}')">Delete</button>
      </td>
    </tr>`;
  }).join('');

  setMain(`
    <div class="page-header">
      <div class="page-title">Customers</div>
      <div style="display:flex;gap:8px">
        <a class="btn btn-outline btn-sm" href="/api/admin/customers/export.csv" style="text-decoration:none">Export CSV</a>
        <button class="btn btn-primary btn-sm" onclick="toggleAddCustomer()">+ Add Customer</button>
      </div>
    </div>
    <div class="card" id="add-customer-card" style="display:none;margin-bottom:16px">
      <div class="card-header"><div class="card-title">Add Customer</div></div>
      <div style="padding:20px">
        <div class="form-row" style="margin-bottom:0">
          <div class="field"><label>Email</label><input id="new-cust-email" type="email" placeholder="customer@example.com"></div>
          <div class="field"><label>Name (optional)</label><input id="new-cust-name" type="text" placeholder="Margaret Tremblay"></div>
          <button class="btn btn-primary" onclick="addCustomer()">Add</button>
        </div>
      </div>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>Email</th><th>Orders</th><th>Spent</th><th>Last Order</th><th>Tags</th><th></th></tr></thead>
        <tbody>${rows || '<tr><td colspan="6" class="empty">No customers yet.</td></tr>'}</tbody>
      </table>
    </div>`);
}

function toggleAddCustomer() {
  const card = document.getElementById('add-customer-card');
  card.style.display = card.style.display === 'none' ? 'block' : 'none';
}

async function addCustomer() {
  const email = document.getElementById('new-cust-email').value.trim();
  const name  = document.getElementById('new-cust-name').value.trim();
  if (!email) return;
  const r = await post('/api/admin/customers', { email, display_name: name });
  if (r?.ok) showCustomers();
  else alert('Could not add customer. Check the email format.');
}

async function deleteCustomer(encodedEmail) {
  if (!confirm('Move this customer and all their orders to Trash? You can restore them later.')) return;
  await del(`/api/admin/customers/${encodedEmail}`);
  go('/admin/customers');
}

async function showCustomer(email) {
  setTitle('Customer');
  const [c, occasions, emailLog] = await Promise.all([
    api(`/api/admin/customers/${encodeURIComponent(email)}`),

function updateAcctStrength() {
  const pwd = document.getElementById('acct-new-pwd')?.value || '';
  let score = 0;
  if (pwd.length >= 8)  score++;
  if (pwd.length >= 12) score++;
  if (/[A-Za-z]/.test(pwd) && /[0-9]/.test(pwd)) score++;
  if (/[!@#$%^&*()\-_=+[\]{}|;:,.<>?]/.test(pwd)) score++;
  const colors = ['#ef4444','#f97316','#eab308','#22c55e'];
  const labels = ['Too weak','Weak','Fair','Strong','Very strong'];
  const fill = document.getElementById('acct-pwd-fill');
  const lbl  = document.getElementById('acct-pwd-lbl');
  if (!fill || !lbl) return;
  fill.style.width = pwd.length === 0 ? '0' : Math.max(20, score * 25) + '%';
  fill.style.background = pwd.length === 0 ? '#9a9a9a' : colors[Math.min(score, 3)];
  lbl.textContent = pwd.length === 0 ? '' : labels[Math.min(score, 4)];
  lbl.style.color = pwd.length === 0 ? '#9a9a9a' : colors[Math.min(score, 3)];
}

async function resetCustomerPassword(encodedEmail) {
  const pwd = document.getElementById('acct-new-pwd').value;
  const msg = document.getElementById('acct-msg');
  if (!pwd) { msg.style.color = '#e63946'; msg.textContent = 'Enter a new password.'; return; }
  const r = await post(`/api/admin/customers/${encodedEmail}/reset-password`, { new_password: pwd });
  if (r?.ok) {
    msg.style.color = '#16a34a';
    msg.textContent = '✓ Password updated. Share it with the customer through a secure channel.';
    document.getElementById('acct-new-pwd').value = '';
    updateAcctStrength();
  } else {
    msg.style.color = '#e63946';
    msg.textContent = r?.error || 'Error updating password.';
  }
}

function formatOccasionDate(mmdd) {
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const [mm, dd] = (mmdd || '').split('-').map(Number);
  if (!mm || !dd) return mmdd || '—';
  return `${monthNames[mm-1]} ${dd}`;
}

async function addOccasion(encodedEmail) {
  const occasion_name      = document.getElementById('occ-name').value.trim();
  const occasion_date      = document.getElementById('occ-date').value.trim();
  const remind_days_before = parseInt(document.getElementById('occ-days').value, 10);
  if (!occasion_name) return alert('Occasion name is required.');
  if (!/^\d{2}-\d{2}$/.test(occasion_date)) return alert('Date must be in MM-DD format, e.g. 06-15.');
  const r = await post(`/api/admin/customers/${encodedEmail}/occasions`, { occasion_name, occasion_date, remind_days_before });
  if (r?.ok) showCustomer(decodeURIComponent(encodedEmail));
  else alert('Error: ' + (r?.error || 'could not add occasion'));
}

async function deleteOccasion(id, encodedEmail) {
  if (!confirm('Delete this reminder?')) return;
  await del(`/api/admin/occasions/${id}`);
  showCustomer(decodeURIComponent(encodedEmail));
}

  const body    = document.getElementById('bc-body').value.trim();
  if (!name) return alert('Template name is required.');

async function sendBroadcast() {

  const subject = document.getElementById('bc-subject').value.trim();

  if (!subject || !body) return alert('Subject and message body are required.');

// ── Spreadsheet paste → contacts ─────────────────────────────────────────────
/* outreach-parser:start */
const OR_FIELDS = [['', 'Ignore'], ['business_name', 'Business'], ['contact_name', 'Contact name'], ['first_name', 'First name'], ['last_name', 'Last name'],
                   ['email', 'Email'], ['source_url', 'Website'], ['phone', 'Phone'], ['notes', 'Notes']];
const OR_EMAIL = /[^\s@<>,;:"'()]+@[^\s@<>,;:"'()]+\.[a-z]{2,}/i;

// Splits pasted text into rows of cells. Tabs (Excel, Sheets) win; otherwise commas or semicolons, with "quoted, cells" kept whole.
function orParseTable(raw) {
  const text = String(raw || '').replace(/\r\n?/g, '\n').replace(/^﻿/, '');
  const first = text.split('\n').find(l => l.trim()) || '';
  const delim = text.includes('\t') ? '\t' : (first.split(';').length > first.split(',').length ? ';' : ',');
  const rows = []; let row = [], cell = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quoted) {
      if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (ch === '"') quoted = false;
      else cell += ch;
    } else if (ch === '"' && cell === '') quoted = true;
    else if (ch === delim) { row.push(cell); cell = ''; }
    else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  row.push(cell); rows.push(row);
  return rows.map(r => r.map(c => c.replace(/\s+/g, ' ').trim())).filter(r => r.some(c => c));
}

// Works out what each column holds: from the header row when there is one, otherwise from what the cells look like.
function orGuessColumns(rows) {
  const width = Math.max(0, ...rows.map(r => r.length));
  const head = (rows[0] || []).map(c => c.toLowerCase());
  const hasHeader = rows.length > 1 && !head.some(c => OR_EMAIL.test(c)) &&
    head.some(c => /e-?mail|courriel|correo|company|business|organi[sz]ation|firm|name|contact|website|url|phone|tel|mobile|notes?/.test(c));
  const map = new Array(width).fill('');
  const take = (i, f) => { if (!map[i] && (f === 'notes' || !map.includes(f))) map[i] = f; };
  if (hasHeader) head.forEach((c, i) => {
    if (/e-?mail|courriel|correo/.test(c)) take(i, 'email');
    else if (/first|given|prénom|nombre/.test(c)) take(i, 'first_name');
    else if (/last|surname|family|apellido/.test(c)) take(i, 'last_name');
    else if (/company|business|organi[sz]ation|firm|agency|brokerage|employer|account/.test(c)) take(i, 'business_name');
    else if (/contact|owner|person|full ?name|^name$|manager|agent|principal/.test(c)) take(i, 'contact_name');
    else if (/web|url|site|link|source|domain/.test(c)) take(i, 'source_url');
    else if (/phone|tel|mobile|cell/.test(c)) take(i, 'phone');
    else if (/note|comment|city|address|province|state|title|role|type|category|industry/.test(c)) take(i, 'notes');
  });
  const body = hasHeader ? rows.slice(1) : rows;
  const share = (i, re) => body.length ? body.filter(r => re.test(r[i] || '')).length / body.length : 0;
  for (let i = 0; i < width; i++) {
    if (map[i]) continue;
    if (share(i, OR_EMAIL) > 0.5) take(i, 'email');
    else if (share(i, /^(https?:\/\/|www\.)|^[a-z0-9-]+(\.[a-z0-9-]+)+(\/\S*)?$/i) > 0.5) take(i, 'source_url');
    else if (share(i, /^[+(]?\d[\d\s().-]{6,}(\s*(x|ext\.?)\s*\d+)?$/i) > 0.5) take(i, 'phone');
  }
  if (!hasHeader) {   // remaining text columns, left to right: business, then contact
    for (let i = 0; i < width; i++) if (!map[i] && share(i, /[a-z]/i) > 0.5) take(i, map.includes('business_name') ? 'contact_name' : 'business_name');
  }
  return { map, hasHeader };
}

// Turns rows + column choices into contacts, and counts what will be left out.
function orBuildContacts(rows, map, hasHeader) {
  const body = hasHeader ? rows.slice(1) : rows;
  const seen = new Set(), contacts = []; let noEmail = 0, repeats = 0;
  for (const r of body) {
    const c = { notes: [] };
    map.forEach((f, i) => {
      const v = r[i] || ''; if (!f || !v) return;
      if (f === 'notes') c.notes.push(v);
      else if (f === 'email') { const m = v.match(OR_EMAIL); if (m && !c.email) c.email = m[0].toLowerCase().replace(/[.,;]+$/, ''); }
      else if (!c[f]) c[f] = v;
    });
    if (!c.email) { noEmail++; continue; }
    if (seen.has(c.email)) { repeats++; continue; }
    seen.add(c.email);
    const name = c.contact_name || [c.first_name, c.last_name].filter(Boolean).join(' ');
    contacts.push({ business_name: c.business_name || '', contact_name: name, email: c.email, source_url: c.source_url || '', phone: c.phone || '', notes: c.notes.join(' · ') });
  }
  return { contacts, noEmail, repeats };
}
/* outreach-parser:end */

let orPaste = null;   // { rows, map, hasHeader }
function previewOutreachPaste(keepMap) {
  const rows = orParseTable(document.getElementById('or-bulk').value);
  const box = document.getElementById('or-preview'), btn = document.getElementById('or-import-btn');
  if (!rows.length) { orPaste = null; box.innerHTML = ''; btn.disabled = true; btn.textContent = 'Import contacts'; return; }
  const guess = orGuessColumns(rows);
  const width = guess.map.length;
  if (keepMap && orPaste && orPaste.map.length === width) { guess.map = orPaste.map; guess.hasHeader = orPaste.hasHeader; }
  orPaste = { rows, map: guess.map, hasHeader: guess.hasHeader };
  const { contacts, noEmail, repeats } = orBuildContacts(rows, orPaste.map, orPaste.hasHeader);
  const body = orPaste.hasHeader ? rows.slice(1) : rows;
  const selects = orPaste.map.map((f, i) => `<th style="padding:6px 8px"><select onchange="orPaste.map[${i}]=this.value;previewOutreachPaste(true)" style="font-size:12px;padding:4px 6px;min-width:112px">${
    OR_FIELDS.map(([v, l]) => `<option value="${v}" ${v === f ? 'selected' : ''}>${l}</option>`).join('')}</select></th>`).join('');
  const sample = body.slice(0, 6).map(r => `<tr>${orPaste.map.map((_, i) => `<td style="padding:6px 8px;font-size:12px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r[i] || '')}</td>`).join('')}</tr>`).join('');
  const hasEmailCol = orPaste.map.includes('email');
  box.innerHTML = `
    <div style="border:1px solid #e5e5e5;border-radius:6px;margin-bottom:12px;overflow-x:auto">
      <table style="border-collapse:collapse;width:100%"><thead><tr style="background:#fafafa">${selects}</tr></thead><tbody>${sample}</tbody></table>
    </div>
    <div style="font-size:13px;margin-bottom:12px;color:#444">
      <label style="margin-right:14px"><input type="checkbox" ${orPaste.hasHeader ? 'checked' : ''} onchange="orPaste.hasHeader=this.checked;previewOutreachPaste(true)"> First row is a header</label>
      ${hasEmailCol ? `<strong>${contacts.length}</strong> contact${contacts.length === 1 ? '' : 's'} ready` : '<span style="color:#e63946">Pick which column is the Email.</span>'}
      ${noEmail ? ` · ${noEmail} row${noEmail === 1 ? '' : 's'} without a valid email left out` : ''}
      ${repeats ? ` · ${repeats} repeated email${repeats === 1 ? '' : 's'} left out` : ''}
      ${body.length > 6 ? ` · showing the first 6 of ${body.length} rows` : ''}
    </div>`;
  btn.disabled = !contacts.length;
  btn.textContent = contacts.length ? `Import ${contacts.length} contact${contacts.length === 1 ? '' : 's'}` : 'Import contacts';
}

function loadOutreachFile(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { alert('That file is larger than 5 MB.'); input.value = ''; return; }
  const reader = new FileReader();
  reader.onload = () => { document.getElementById('or-bulk').value = String(reader.result || ''); previewOutreachPaste(); input.value = ''; };
  reader.readAsText(file);
}

async function addOutreachContacts() {
  if (!orPaste) return;
  const { contacts } = orBuildContacts(orPaste.rows, orPaste.map, orPaste.hasHeader);
  if (!contacts.length) return alert('No rows with a valid email.');
  const btn = document.getElementById('or-import-btn'); btn.disabled = true;
  const r = await post('/api/admin/outreach/contacts', { campaign: outreachCampaign, contacts });
  if (r?.ok) {
    const parts = [`Added ${r.added}`];
    if (r.duplicates) parts.push(`${r.duplicates} already in this campaign`);
    if (r.unsubscribed) parts.push(`${r.unsubscribed} unsubscribed, not added`);
    if (r.invalid) parts.push(`${r.invalid} invalid`);
    orPaste = null;
    await showOutreach();
    const s = document.getElementById('or-add-status');
    if (s) { s.style.color = '#16a34a'; s.textContent = parts.join(' · ') + '.'; }
  } else {
    btn.disabled = false;
    const s = document.getElementById('or-add-status');
    s.style.color = '#e63946';
    s.textContent = 'Failed: ' + (r?.error || 'unknown error');
  }
}

const FLAG_EMOJI = cc => {
  if (!cc || cc.length !== 2) return '🌐';
  const A = 0x1F1E6, base = 'A'.charCodeAt(0);
  return String.fromCodePoint(A + cc.toUpperCase().charCodeAt(0) - base) +
         String.fromCodePoint(A + cc.toUpperCase().charCodeAt(1) - base);
};

let visitorsCFDays = 7;
let visitorsSite = 'all';   // all | ca | us | uk
const VISITOR_SITES = [['all', 'All sites'], ['ca', 'letterhome.ca'], ['us', 'letterhome.us'], ['uk', 'letterhome.co.uk']];

async function showVisitors(cfDays, site) {
  if (cfDays !== undefined && cfDays !== null) visitorsCFDays = cfDays;
  if (site) visitorsSite = site;
  const q = visitorsSite === 'all' ? '' : `site=${visitorsSite}`;
  setTitle('Visitors');
  setMain('<div class="empty">Loading…</div>');
  const [cf, dbStats, recent] = await Promise.all([
    api(`/api/admin/cloudflare/analytics?days=${visitorsCFDays}${q ? '&' + q : ''}`),
    api(`/api/admin/visitors/stats${q ? '?' + q : ''}`),
    api(`/api/admin/visitors/recent?limit=50${q ? '&' + q : ''}`),
  ]);
  renderVisitors(cf, dbStats, recent || []);
}

function renderVisitors(cf, s, recent) {
  const fmtBytes = b => b > 1073741824 ? (b/1073741824).toFixed(1)+' GB' : b > 1048576 ? (b/1048576).toFixed(1)+' MB' : Math.round(b/1024)+' KB';

    let cfHtml = '';
  if (!cf || cf.configured === false) {
    cfHtml = `<div class="card" style="margin-bottom:24px;padding:20px 24px;color:#6b6b6b;font-size:13px">
      <strong>Cloudflare Analytics</strong> — not configured. ${cf && cf.missing && cf.missing.length ? 'Missing on the server: <code>' + cf.missing.map(esc).join('</code>, <code>') + '</code>. Add it to <code>.env</code> and run <code>pm2 reload letterhome --update-env</code>.' : 'Add <code>CF_API_TOKEN</code> and <code>CF_ZONE_ID</code> to your .env and restart (the country domains use <code>CF_ZONE_ID_US</code> and <code>CF_ZONE_ID_UK</code>).'}</div>`;
  } else if (cf.error) {
    cf.error = /permission/i.test(cf.error) ? 'The Cloudflare API token does not have Analytics Read permission for this domain. In Cloudflare, edit the token and set Zone Resources to All zones. (' + cf.error + ')' : cf.error;
    cfHtml = `<div class="card" style="margin-bottom:24px;padding:20px 24px;color:#e63946;font-size:13px">
      Cloudflare error: ${esc(cf.error)}</div>`;
  } else {
    const t = cf.totals;
    const cachedPct = t.requests > 0 ? Math.round((t.cachedRequests / t.requests) * 100) : 0;
    const maxCF = Math.max(1, ...(cf.daily || []).map(d => d.sum?.requests || 0));
    const cfBars = (cf.daily || []).map(d => {
      const req = d.sum?.requests || 0;
      const pv  = d.sum?.pageViews || 0;
      const h   = Math.max(4, Math.round((req / maxCF) * 110));
      const pvH = Math.max(0, Math.round((pv / maxCF) * 110));
      const label = (d.dimensions?.date || '').slice(5);
      return `<div style="display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;min-width:0"
          title="${d.dimensions?.date}: ${req.toLocaleString()} requests · ${pv.toLocaleString()} page views · ${(d.uniq?.uniques||0).toLocaleString()} unique">
        <div style="width:100%;height:${h}px;background:#bfdbfe;border-radius:2px 2px 0 0;min-height:4px;position:relative">
          <div style="position:absolute;bottom:0;left:0;right:0;height:${pvH}px;background:#2563eb;border-radius:2px 2px 0 0"></div>
        </div>
        <span style="font-size:9px;color:#9a9a9a">${esc(label)}</span>
      </div>`;
    }).join('') || '<div class="empty" style="padding:20px;width:100%">No data.</div>';

    const periodBtns = [7, 14, 30].map(d =>
      `<button class="filter-btn ${visitorsCFDays===d?'active':''}" onclick="showVisitors(${d}, visitorsSite)">${d}d</button>`
    ).join('');

    cfHtml = `
    <div class="card" style="margin-bottom:24px">
      <div class="card-header">
        <div class="card-title">Cloudflare — Last ${cf.days} Days${(cf.failed || []).length ? ` <span style="font-size:11px;color:#b45309;font-weight:400;margin-left:8px">Not included: ${cf.failed.map(f => esc(({ ca: 'letterhome.ca', us: 'letterhome.us', uk: 'letterhome.co.uk' })[f.site] || f.site)).join(', ')} (token has no access)</span>` : ''} <span style="font-size:11px;color:#9a9a9a;font-weight:400;margin-left:8px">█ requests &nbsp; █ page views</span></div>
        <div style="display:flex;gap:6px">${periodBtns}</div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:0;border-bottom:1px solid #fafafa">
        <div style="padding:14px 20px;border-right:1px solid #fafafa">
          <div style="font-size:11px;color:#6b6b6b;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px">Requests</div>
          <div style="font-size:22px;font-weight:700;color:#111111">${t.requests.toLocaleString()}</div>
        </div>
        <div style="padding:14px 20px;border-right:1px solid #fafafa">
          <div style="font-size:11px;color:#6b6b6b;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px">Page Views</div>
          <div style="font-size:22px;font-weight:700;color:#111111">${t.pageViews.toLocaleString()}</div>
        </div>
        <div style="padding:14px 20px;border-right:1px solid #fafafa">
          <div style="font-size:11px;color:#6b6b6b;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px">Unique Visitors</div>
          <div style="font-size:22px;font-weight:700;color:#111111">${t.uniques.toLocaleString()}</div>
        </div>
        <div style="padding:14px 20px;border-right:1px solid #fafafa">
          <div style="font-size:11px;color:#6b6b6b;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px">Bandwidth</div>
          <div style="font-size:22px;font-weight:700;color:#111111">${fmtBytes(t.bytes)}</div>
          <div style="font-size:11px;color:#9a9a9a;margin-top:2px">${cachedPct}% cached</div>
        </div>
        <div style="padding:14px 20px">
          <div style="font-size:11px;color:#6b6b6b;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px">Threats Blocked</div>
          <div style="font-size:22px;font-weight:700;color:${t.threats > 0 ? '#e63946' : '#16a34a'}">${t.threats.toLocaleString()}</div>
        </div>
      </div>
      <div style="padding:16px 20px">
        <div style="display:flex;align-items:flex-end;gap:3px;height:130px">${cfBars}</div>
      </div>
    </div>`;
  }

    let dbHtml = '';
  if (s) {
    const topPagesRows = (s.topPages || []).map(p =>
      `<tr><td style="font-family:monospace;font-size:12px">${esc(p.path)}</td><td style="text-align:right">${p.count}</td></tr>`
    ).join('') || '<tr><td colspan="2" class="empty">No page data yet.</td></tr>';

    const topCountriesRows = (s.topCountries || []).map(c =>
      `<tr><td>${FLAG_EMOJI(c.country_code)} ${esc(c.country_name || c.country_code)}</td><td style="text-align:right">${c.count}</td></tr>`
    ).join('') || '<tr><td colspan="2" class="empty">No country data yet.</td></tr>';

    const totalDevices = (s.devices || []).reduce((sum, d) => sum + d.count, 0) || 1;
    const deviceRows = (s.devices || []).map(d => {
      const pct = Math.round((d.count / totalDevices) * 100);
      return `<tr><td style="text-transform:capitalize">${esc(d.device_type || 'unknown')}</td><td style="text-align:right">${d.count} <span style="color:#9a9a9a">(${pct}%)</span></td></tr>`;
    }).join('') || '<tr><td colspan="2" class="empty">—</td></tr>';

    const browserRows = (s.browsers || []).map(b =>
      `<tr><td>${esc(b.browser)}</td><td style="text-align:right">${b.count}</td></tr>`
    ).join('') || '<tr><td colspan="2" class="empty">—</td></tr>';

    const referrerRows = (s.referrers || []).map(r =>
      `<tr><td style="font-family:monospace;font-size:12px">${esc(r.referrer)}</td><td style="text-align:right">${r.count}</td></tr>`
    ).join('') || '<tr><td colspan="2" class="empty">No referrers yet.</td></tr>';

    const recentRows = (recent || []).map(r => `
      <tr>
        <td style="white-space:nowrap;font-size:12px">${fmtDateTime(r.created_at)}</td>
        <td>${r.country_code ? FLAG_EMOJI(r.country_code) + ' ' + esc(r.country_name || r.country_code) : '<span style="color:#9a9a9a">—</span>'}</td>
        <td style="font-family:monospace;font-size:11px;color:#6b6b6b">${esc(r.ip || '')}</td>
        <td style="font-size:11px;color:#6b6b6b">${esc(({ ca: '.ca', us: '.us', uk: '.co.uk' })[r.site] || '.ca')}</td>
        <td style="font-family:monospace;font-size:11px">${esc(r.path)}</td>
        <td style="text-transform:capitalize">${esc(r.device_type || '')}</td>
        <td>${esc(r.browser || '')}</td>
        <td style="font-size:11px;color:#6b6b6b">${esc(r.referrer || '')}</td>
      </tr>`).join('') || '<tr><td colspan="8" class="empty">No app-level sessions recorded yet — will populate after deployment.</td></tr>';

    dbHtml = `
    <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:#9a9a9a;margin-bottom:12px">App-level detail (30 days · ${s.total} total logged)</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px">
      <div class="card">
        <div class="card-header"><div class="card-title">Top Pages</div></div>
        <table><thead><tr><th>Path</th><th style="text-align:right">Views</th></tr></thead>
          <tbody>${topPagesRows}</tbody></table>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">Top Countries</div></div>
        <table><thead><tr><th>Country</th><th style="text-align:right">Views</th></tr></thead>
          <tbody>${topCountriesRows}</tbody></table>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-bottom:20px">
      <div class="card">
        <div class="card-header"><div class="card-title">Devices</div></div>
        <table><thead><tr><th>Type</th><th style="text-align:right">Views</th></tr></thead>
          <tbody>${deviceRows}</tbody></table>

      <div class="card">
        <div class="card-header"><div class="card-title">Browsers</div></div>

          <tbody>${browserRows}</tbody></table>

        <div class="card-header"><div class="card-title">Referrers</div></div>
        <table><thead><tr><th>Source</th><th style="text-align:right">Views</th></tr></thead>
          <tbody>${referrerRows}</tbody></table>

    <div class="card">
      <div class="card-header">
        <div class="card-title">Recent Sessions</div>
        <button class="btn btn-outline btn-sm" onclick="showVisitors()">Refresh</button>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Time</th><th>Country</th><th>IP</th><th>Site</th><th>Page</th><th>Device</th><th>Browser</th><th>Referrer</th></tr></thead>
          <tbody>${recentRows}</tbody>
        </table>
      </div>
    </div>`;
  }

  setMain(`
    <div class="page-header">
      <div class="page-title">Visitors</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${VISITOR_SITES.map(([k, l]) => `<button class="filter-btn ${visitorsSite === k ? 'active' : ''}" onclick="showVisitors(null, '${k}')">${l}</button>`).join('')}</div>
    </div>
    ${cfHtml}
    ${dbHtml}
  `);
}

async function createTemplate() {
  const name    = document.getElementById('tmpl-new-name').value.trim();
  const subject = document.getElementById('tmpl-new-subject').value.trim();
  const body    = document.getElementById('tmpl-new-body').value.trim();
  if (!name || !subject || !body) return alert('Name, subject, and body are all required.');
  const r = await post('/api/admin/templates', { name, subject, body });
  if (r?.ok) {
    ['tmpl-new-name','tmpl-new-subject','tmpl-new-body'].forEach(id => document.getElementById(id).value = '');
    const msg = document.getElementById('tmpl-save-msg');
    msg.style.display = 'inline';
    setTimeout(() => { msg.style.display = 'none'; showTemplates(); }, 1200);
  } else alert('Error: ' + (r?.error || 'could not save'));
}

async function deleteTemplate(id) {
  if (!confirm('Delete this template?')) return;
  await del(`/api/admin/templates/${id}`);
  showTemplates();
}

            <option value="customer"${action==='customer'?' selected':''}>customer.*</option>
            <option value="order"${action==='order'?' selected':''}>order.*</option>
            <option value="contact"${action==='contact'?' selected':''}>contact.*</option>
            <option value="broadcast"${action==='broadcast'?' selected':''}>broadcast.*</option>
            <option value="settings"${action==='settings'?' selected':''}>settings.*</option>

async function savePostgridSettings() {
  const live = PG_DESTS.map(([cc]) => cc).filter(cc => document.getElementById('pg-dest-' + cc)?.checked);
  const svc = PG_SERVICES.map(([k]) => k).filter(k => document.getElementById('pg-svc-' + k.replace(':','-'))?.checked);
  const body = {
    postgrid_auto_submit: 'false',   // owner approves every order by hand
    allow_blank_return: document.getElementById('pg-blank-return')?.checked ? '1' : '0',
    postgrid_countries: live.join(','),
    services_enabled: JSON.stringify(svc),
    price_uk_cents: String(parseInt(document.getElementById('pg-price-uk')?.value) || 900),
    price_au_cents: String(parseInt(document.getElementById('pg-price-au')?.value) || 900),
  };
  PG_SERVICES.forEach(([k, , pkey, def]) => { body[pkey] = String(parseInt(document.getElementById('pg-svcprice-' + k.replace(':','-'))?.value) || def); });
  const r = await post('/api/admin/settings/batch', body);
  const msg = document.getElementById('pg-settings-msg');
  if (msg) { msg.style.color = r?.ok ? '#16a34a' : '#b42318'; msg.textContent = r?.ok ? '✓ Saved' : 'Could not save'; }
}

function addBlockedCountry() {
  const sel = document.getElementById('block-country-select');
  const code = sel.value;
  if (!code) return;
  if (!window._blockedCountries) window._blockedCountries = [];
  if (window._blockedCountries.includes(code)) return;
  window._blockedCountries.push(code);
  sel.value = '';
  renderBlockedChips();
}

function removeBlockedCountry(code) {
  window._blockedCountries = (window._blockedCountries || []).filter(c => c !== code);
  renderBlockedChips();
}

function renderBlockedChips() {
  const el = document.getElementById('blocked-chips');
  if (!el) return;
  const blocked = window._blockedCountries || [];
  el.innerHTML = blocked.length
    ? blocked.map(code => `
        <span style="display:inline-flex;align-items:center;gap:5px;background:#fee2e2;color:#991b1b;padding:3px 10px;border-radius:0;font-size:12px;font-weight:500;margin:3px">
          ${esc(COUNTRIES[code] || code)} (${code})
          <button onclick="removeBlockedCountry('${code}')" style="background:none;border:none;cursor:pointer;color:#991b1b;font-size:14px;line-height:1;padding:0">×</button>
        </span>`).join('')
    : '<span style="font-size:12px;color:#9a9a9a">No countries blocked.</span>';
}

async function saveAllSettings() {
  const announcement = document.getElementById('setting-announcement')?.value || '';
  const priceDom     = parseInt(document.getElementById('setting-price-dom')?.value) || 600;
  const priceUsa     = parseInt(document.getElementById('setting-price-usa')?.value) || 600;
  const priceIntl    = parseInt(document.getElementById('setting-price-intl')?.value) || 1500;
  const priceUk      = parseInt(document.getElementById('setting-price-uk')?.value) || 900;
  const priceAu      = parseInt(document.getElementById('setting-price-au')?.value) || 900;
  const dailyCap     = parseInt(document.getElementById('setting-daily-cap')?.value) || 0;
  const blocked      = JSON.stringify(window._blockedCountries || []);

  const r = await post('/api/admin/settings/batch', {
    announcement,
    price_domestic_cents:      String(priceDom),
    price_usa_cents:           String(priceUsa),
    price_international_cents: String(priceIntl),
    price_uk_cents:            String(priceUk),
    price_au_cents:            String(priceAu),
    daily_order_cap:           String(dailyCap),
    blocked_countries:         blocked,
  });
  const msg = document.getElementById('settings-saved-msg');
  if (r?.ok && msg) {
    msg.style.display = 'inline';
    setTimeout(() => { msg.style.display = 'none'; }, 2500);
  } else alert('Error saving: ' + (r?.error || 'unknown'));
}

async function runBackupNow() {

  if (btn) { btn.disabled = true; btn.textContent = 'Running…'; }
  const r = await post('/api/admin/backups/run', {});
  if (btn) { btn.disabled = false; btn.textContent = 'Backup Now'; }
  if (r?.ok) {
    if (msg) {
      msg.style.color = '#16a34a';

      msg.textContent = line;

  const r = await del(`/api/admin/backups/${encodeURIComponent(filename)}`);
  if (r?.ok) showSettings();
  else alert('Delete failed: ' + (r?.error || 'unknown'));
}

async function purgeCfCache() {
  if (!confirm('Purge all Cloudflare cached assets? This will briefly increase origin traffic until the cache warms back up.')) return;
  const btn = document.getElementById('cf-purge-btn');
  const msg = document.getElementById('cf-purge-msg');
  btn.disabled = true; btn.textContent = 'Purging…';
  msg.style.display = 'none';
  const r = await post('/api/admin/cloudflare/purge', {});
  btn.disabled = false; btn.textContent = 'Purge Everything';
  if (r?.ok) {
    msg.style.color = '#16a34a'; msg.textContent = '✓ Cache purged'; msg.style.display = 'inline';
    setTimeout(() => { msg.style.display = 'none'; }, 4000);
  } else {
    msg.style.color = '#e63946'; msg.textContent = 'Error: ' + (r?.error || 'unknown'); msg.style.display = 'inline';
  }
}

function fmtBytes(bytes) {
  if (bytes < 1024)        return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

async function createCode() {
  const code    = document.getElementById('dc-code')?.value?.trim().toUpperCase();
  const desc    = document.getElementById('dc-desc')?.value?.trim();
  const pct     = document.getElementById('dc-pct')?.value;
  const cents   = document.getElementById('dc-cents')?.value;
  const max     = document.getElementById('dc-max')?.value;
  const expires = document.getElementById('dc-expires')?.value;
  const msg     = document.getElementById('dc-msg');
  if (!code) { msg.textContent = 'Code required.'; msg.style.color='#dc2626'; return; }
  if (!pct && !cents) { msg.textContent = 'Enter a % or fixed amount.'; msg.style.color='#dc2626'; return; }
  msg.textContent = 'Creating…'; msg.style.color = '#9a9a9a';
  const r = await post('/api/admin/discount-codes', { code, description: desc, discount_pct: pct||null, discount_cents: cents||null, max_uses: max||null, expires_at: expires||null });
  if (r?.ok) {
    msg.textContent = `✓ Created ${code}`; msg.style.color = '#065f46';
    showCodes();
  } else {
    msg.textContent = r?.error || 'Error.'; msg.style.color = '#dc2626';
  }
}

  const lp = overview.lastPayout;

function toggleApplicantMail(id) {
  const row = document.getElementById('applicant-mail-' + id);
  if (row) row.style.display = row.style.display === 'none' ? '' : 'none';
}

function loadApplicantTemplate(id, select, name) {
  const opt = select.options[select.selectedIndex];
  const subj = document.getElementById('ap-subject-' + id), body = document.getElementById('ap-body-' + id);
  if (!opt.value || !subj || !body) return;
  if (opt.value === '__call') {
    const first = String(name || '').trim().split(/\s+/)[0] || 'there';
    body.value = `Hi ${first},\n\nThanks for applying to be an independent sales representative with Letterhome. I read your application and would like to talk it through.\n\nCould we set up a quick call? It would take about 20 minutes. Let me know a few times that work for you this week or next, and your time zone.\n\nThanks again,\nJeffrey George\nLetterhome\nsupport@letterhome.ca`;
    return;
  }
  subj.value = opt.dataset.subject || subj.value;
  body.value = opt.dataset.body || '';
}

async function sendApplicantMail(id, email) {
  const subject = document.getElementById('ap-subject-' + id)?.value.trim();
  const body = document.getElementById('ap-body-' + id)?.value.trim();
  if (!subject || !body) return alert('Subject and message are required.');
  if (!confirm('Send this email to ' + email + '?')) return;
  const r = await post(`/api/admin/contacts/${id}/reply`, { subject, body });
  if (r?.ok) { alert('Email sent.'); showApplicants(); }
  else alert('Error: ' + (r?.error || 'could not send the email'));
}

function toggleApplicant(id) {
  const row = document.getElementById('applicant-' + id);
  if (row) row.style.display = row.style.display === 'none' ? '' : 'none';
}

async function markApplicantRead(id) {
  await post(`/api/admin/contacts/${id}/read`, {});

}

function toggleContactExpand(id) {
  const row = document.getElementById('contact-expand-' + id);

function toggleContactReply(id) {
  const row = document.getElementById('contact-reply-' + id);

}

function loadContactTemplate(id, select) {
  const opt = select.options[select.selectedIndex];
  if (!opt.value) return;
  const subjectEl = document.getElementById('reply-subject-' + id);
  const bodyEl    = document.getElementById('reply-body-'    + id);
  if (subjectEl) subjectEl.value = opt.dataset.subject || '';
  if (bodyEl)    bodyEl.value    = opt.dataset.body    || '';
}

async function sendContactReply(id) {
  const subject = document.getElementById('reply-subject-' + id)?.value.trim();
  const body    = document.getElementById('reply-body-'    + id)?.value.trim();
  if (!subject || !body) return alert('Subject and body are required.');
  const r = await post(`/api/admin/contacts/${id}/reply`, { subject, body });
  if (r?.ok) {
    alert('Reply sent.');
    showContacts();
  } else {
    alert('Error: ' + (r?.error || 'could not send reply'));
  }
}

function updateContactsBadge(unread) {
  window._unreadContacts = unread;
  refreshBadges();
}
function updateMailBadge(list) {
  window._unreadMailBoxes = list || [];
  window._unreadMail = (list || []).reduce((n, b) => n + (b.unread || 0), 0);
  refreshBadges();
}
function refreshBadges() {
  const c = window._unreadContacts || 0, m = window._unreadMail || 0, total = c + m;
  document.querySelectorAll('.contacts-tab-badge').forEach(b => { const v = b.classList.contains('mail-tab-badge') ? m : c; b.textContent = v; b.style.display = v > 0 ? 'inline-block' : 'none'; });
  const chipC = document.getElementById('need-contacts'), chipM = document.getElementById('need-mail');
  if (chipC) { chipC.querySelector('b').textContent = c; chipC.classList.toggle('hot', c > 0); }
  if (chipM) { chipM.querySelector('b').textContent = m; chipM.classList.toggle('hot', m > 0); }
  document.querySelectorAll('#inbox-badge, #tab-inbox-badge').forEach(badge => { if (total > 0) { badge.textContent = total > 99 ? '99+' : total; badge.style.display = 'inline-block'; } else badge.style.display = 'none'; });
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}


function toggleMobSidebar() {
  const s = document.querySelector('.sidebar');

  const open = s.classList.toggle('mob-open');
  if (o) o.classList.toggle('mob-open', open);
}
function closeMobSidebar() {
  document.querySelector('.sidebar')?.classList.remove('mob-open');
  const o = document.getElementById('sidebar-overlay');
  if (o) o.classList.remove('mob-open');
}

const SITE_LABELS = { ca: 'letterhome.ca', us: 'letterhome.us', uk: 'letterhome.co.uk', au: 'letterhome.ca/au' };
const tbl = (head, rows, empty) => rows.length
  ? `<div style="overflow-x:auto"><table><thead><tr>${head.map((h, i) => `<th${i ? ' style="text-align:right"' : ''}>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`
  : `<div class="empty" style="padding:28px">${esc(empty || 'Nothing here yet.')}</div>`;
const nf = n => Math.round(n || 0).toLocaleString();
const pf = (n, d = 1) => (n * 100).toFixed(d) + '%';
const cad = c => '$' + ((c || 0) / 100).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const statCard = (label, value, sub, color) => `<div class="stat-card"><div class="stat-label">${esc(label)}</div><div class="stat-value"${color ? ` style="color:${color}"` : ''}>${value}</div>${sub ? `<div class="stat-sub">${sub}</div>` : ''}</div>`;
const siteTabs = (cur, fn) => ['ca', 'us', 'uk', 'au'].map(s => `<button class="filter-btn ${cur === s ? 'active' : ''}" onclick="${fn}('${s}')">${esc(SITE_LABELS[s])}</button>`).join('');
const deltaTxt = (now, before) => before == null ? '' : (now - before === 0 ? 'no change' : (now > before ? '+' : '') + nf(now - before) + ' vs last import');

let growthSite = 'ca';
async function showGrowth(site) {
  if (site) growthSite = site;
  setTitle('Search growth');
  setMain('<div class="empty">Loading…</div>');
  const g = await api('/api/admin/growth?site=' + growthSite);
  if (!g) return setMain('<div class="empty">Could not load this section.</div>');
  const upload = `
    <div class="card"><div class="card-header"><div class="card-title">Import a Search Console export</div></div>
      <div style="padding:16px 24px;font-size:13px;color:#6b6b6b;line-height:1.7">
        In Search Console open <strong>Performance → Search results</strong>, choose a date range, then <strong>Export → Download Excel</strong> (or CSV, which comes as a .zip). Choose that file here for <strong>${esc(SITE_LABELS[growthSite])}</strong>.
        Each import is kept, so the next one shows what moved.
        <div style="margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <input type="file" id="gsc-file" accept=".zip,.xlsx,.csv" style="font-size:12px">
          <button class="btn btn-primary btn-sm" onclick="importGrowth()">Import</button>
          <span id="gsc-msg" style="font-size:12px"></span>
        </div></div></div>`;
  const head = `<div style="display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap">${siteTabs(growthSite, 'showGrowth')}</div>`;
  if (g.empty) return setMain(head + upload + '<div class="empty">No export imported for this site yet.</div>');

  const l = g.latest, p = g.previous;
  const maxI = Math.max(1, ...g.chart.map(d => d.impressions));
  const bars = g.chart.map(d => {
    const h = Math.max(2, Math.round(d.impressions / maxI * 110)), c = Math.round(d.clicks / maxI * 110);
    return `<div style="flex:1;min-width:0" title="${esc(d.key)}: ${nf(d.impressions)} impressions, ${nf(d.clicks)} clicks, position ${d.position.toFixed(1)}"><div style="height:${h}px;background:#bfdbfe;position:relative"><div style="position:absolute;bottom:0;left:0;right:0;height:${c}px;background:#2563eb"></div></div></div>`;
  }).join('');
  const kpis = `<div class="stats-grid">
    ${statCard('Clicks', nf(l.clicks), p ? deltaTxt(l.clicks, p.clicks) : esc(l.date_from || '') + ' to ' + esc(l.date_to || ''))}
    ${statCard('Impressions', nf(l.impressions), p ? deltaTxt(l.impressions, p.impressions) : '')}
    ${statCard('Click rate', l.impressions ? pf(l.clicks / l.impressions, 2) : '–', 'clicks per impression')}
    ${statCard('Average position', g.avgPosition ? g.avgPosition.toFixed(1) : '–', 'lower is better')}
  </div>`;
  const chartCard = g.chart.length ? `<div class="card"><div class="card-header"><div class="card-title">Daily impressions (clicks in dark blue)</div><span style="font-size:11px;color:#6b6b6b">${esc(l.date_from || '')} to ${esc(l.date_to || '')}</span></div><div style="padding:16px 20px;display:flex;align-items:flex-end;gap:2px;height:140px">${bars}</div></div>` : '';

  const pageRow = r => `<tr><td style="font-family:monospace;font-size:12px;word-break:break-all">${esc(r.key)}</td><td style="text-align:right">${nf(r.impressions)}</td><td style="text-align:right">${nf(r.clicks)}</td><td style="text-align:right">${pf(r.ctr, 2)}</td><td style="text-align:right">${r.position.toFixed(1)}</td></tr>`;
  const qRow = r => `<tr><td>${esc(r.key)}</td><td style="text-align:right">${nf(r.impressions)}</td><td style="text-align:right">${nf(r.clicks)}</td><td style="text-align:right">${r.position.toFixed(1)}</td></tr>`;
  const sect = (title, note, body) => `<div class="card"><div class="card-header"><div class="card-title">${esc(title)}</div></div>${note ? `<div style="padding:10px 24px 0;font-size:12px;color:#6b6b6b">${note}</div>` : ''}${body}</div>`;

  const html = head + kpis + chartCard +
    sect('Page one, few clicks', 'These pages already show on page one but few people click. The fix is the title or the first lines, not more links. Change them carefully: a ranking title is not worth risking.',
      tbl(['Page', 'Impressions', 'Clicks', 'Click rate', 'Position'], g.pageOneQuiet.map(pageRow), 'No page-one pages with many impressions and few clicks.')) +
    sect('Close to page one', 'Searches where you sit at positions 11 to 20. A better answer, or links from related pages, can move these up.',
      tbl(['Search', 'Impressions', 'Clicks', 'Position'], g.nearPageOne.map(qRow), 'None yet.')) +
    sect('Questions people search', 'Each question is a candidate for a short, sourced guide, or a better answer at the top of an existing page.',

async function importGrowth() {
  const f = document.getElementById('gsc-file').files[0];
  const msg = document.getElementById('gsc-msg');
  if (!f) { msg.style.color = '#c1121f'; msg.textContent = 'Choose a file first.'; return; }

  msg.style.color = '#6b6b6b'; msg.textContent = 'Importing…';
  try {
    const r = await fetch('/api/admin/growth/import', { method: 'POST', body: f, headers: { 'Content-Type': 'application/octet-stream', 'X-Site': growthSite, 'X-Filename': f.name, 'X-CSRF-Token': _csrfToken || '' } });

    if (!r.ok || !j.ok) { msg.style.color = '#c1121f'; msg.textContent = j.error || ('Import failed (' + r.status + ')'); return; }

async function showHealth() {
  setTitle('Server health');
  setMain('<div class="empty">Loading…</div>');
  const h = await api('/api/admin/health-detail');
  if (!h) return setMain('<div class="empty">Could not load this section.</div>');
  const GB = b => (b / 1073741824).toFixed(1) + ' GB';
  const col = (bad, warn) => bad ? '#c1121f' : warn ? '#b45309' : '#15803d';
  const usedMem = h.mem.available != null ? h.mem.total - h.mem.available : h.mem.total - h.mem.free;
  const memPct = usedMem / h.mem.total;
  const load = h.load[0] / h.cpus;
  const dur = s => s < 3600 ? Math.floor(s / 60) + ' min' : s < 172800 ? Math.floor(s / 3600) + ' h' : Math.floor(s / 86400) + ' days';
  const diskPct = h.disk ? 1 - h.disk.free / h.disk.total : null;
  const swapPct = h.swap && h.swap.total ? h.swap.used / h.swap.total : 0;
  const clam = h.clamav === 'active';
  const b = h.backup;
  const cards = `<div class="stats-grid">
    ${statCard('CPU load', h.load[0].toFixed(2), h.cpus + ' cores, ' + h.load[1].toFixed(2) + ' (5 min)', col(load > 1, load > 0.7))}
    ${statCard('Memory used', pf(memPct, 0), GB(usedMem) + ' of ' + GB(h.mem.total), col(memPct > 0.9, memPct > 0.75))}
    ${statCard('Swap used', h.swap ? GB(h.swap.used) : '–', h.swap ? 'of ' + GB(h.swap.total) : 'not readable here', col(swapPct > 0.5, swapPct > 0.1))}
    ${statCard('Disk used', diskPct == null ? '–' : pf(diskPct, 0), h.disk ? GB(h.disk.free) + ' free' : '', diskPct == null ? '' : col(diskPct > 0.9, diskPct > 0.75))}
  </div><div class="stats-grid">
    ${statCard('Virus scanner', h.clamav == null ? '–' : (clam ? 'Running' : esc(h.clamav)), 'ClamAV', h.clamav == null ? '' : col(!clam, false))}
    ${statCard('App restarts', h.pm2 ? nf(h.pm2.count) : '–', h.pm2 ? esc(h.pm2.status) + ', up ' + dur(h.uptime_s) : 'pm2 not readable here', h.pm2 ? col(h.pm2.status !== 'online', h.pm2.count > 20) : '')}
    ${statCard('Certificate', h.cert_days == null ? '–' : h.cert_days + ' days', 'until it expires', h.cert_days == null ? '' : col(h.cert_days < 7, h.cert_days < 21))}
    ${statCard('Last backup', b ? (b.ageHours < 48 ? b.ageHours + ' h ago' : Math.round(b.ageHours / 24) + ' days ago') : 'none', b ? esc(b.file) + ', ' + (b.size / 1024).toFixed(0) + ' KB' : '', b ? col(b.ageHours > 36, b.ageHours > 26) : '#c1121f')}
  </div>`;
  const rows = [['Database (with write-ahead files)', (h.db_bytes / 1048576).toFixed(1) + ' MB'], ['Server up', dur(h.host_uptime_s)], ['Node', h.node], ['Backups kept', b ? nf(b.count) : '0']];
  setMain(cards +
    `<div class="card"><div class="card-header"><div class="card-title">Restore drill</div><button class="btn btn-primary btn-sm" id="drill-btn" onclick="runDrill()">Run drill</button></div>
      <div id="drill-out" style="padding:16px 24px;font-size:13px;color:#6b6b6b;line-height:1.7">Opens the newest backup in a scratch file, checks it is intact, compares it with the live order count, then deletes the scratch file. It never touches the live database. Run it monthly.</div></div>` +
    `<div class="card"><div class="card-header"><div class="card-title">Details</div></div>${tbl(['Item', 'Value'], rows.map(r => `<tr><td>${esc(r[0])}</td><td style="text-align:right">${esc(r[1])}</td></tr>`))}</div>`);
}
async function runDrill() {
  const btn = document.getElementById('drill-btn'), out = document.getElementById('drill-out');
  btn.disabled = true; out.style.color = '#6b6b6b'; out.textContent = 'Running… this takes a few seconds.';
  const r = await api('/api/admin/backups/drill', { method: 'POST', body: '{}' });
  btn.disabled = false;
  if (!r || !r.ok) { out.style.color = '#c1121f'; out.textContent = 'Drill failed: ' + ((r && r.error) || 'no answer') + (r && r.file ? ' (' + r.file + ')' : ''); return; }
  const gap = r.liveOrders - r.backupOrders;
  out.style.color = '#15803d';
  out.innerHTML = `Passed. <strong>${esc(r.file)}</strong> (${r.ageHours} h old) opened in ${r.ms} ms. Integrity check: <strong>${esc(r.integrity)}</strong>. The backup holds ${nf(r.backupOrders)} orders (last id ${nf(r.backupLastId)}); the live database has ${nf(r.liveOrders)} (last id ${nf(r.liveLastId)})${gap > 0 ? ', so ' + gap + ' newer order' + (gap > 1 ? 's' : '') + ' arrived since that backup, which is normal.' : '.'}`;
}

function indexNowCard(x) {
