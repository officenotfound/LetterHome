function addrBadge(o) {
  const st = o.addr_check;
  const btn = `<button class="btn btn-outline btn-sm" style="margin-left:8px" onclick="apprRecheck(${o.id})">Check again</button>`;
  if (st === 'verified') return `<div style="font-size:12px;color:#15803d;margin-bottom:6px">Address verified by PostGrid ${btn}</div>`;
  if (st === 'unverified') return `<div style="font-size:12px;color:#92400e;margin-bottom:6px">PostGrid could not verify this address (${esc(o.addr_note || 'no details')}). If you approve, it prints exactly as entered. ${btn}</div>`;
  if (st === 'error') return `<div style="font-size:12px;color:#6b6b6b;margin-bottom:6px">Address check did not run (${esc(o.addr_note || 'error')}). ${btn}</div>`;
  return `<div style="font-size:12px;color:#6b6b6b;margin-bottom:6px">Address check queued, runs within 10 minutes. ${btn}</div>`;
}
async function apprRecheck(id) {
  const r = await api('/api/admin/orders/' + id + '/address-check', { method: 'POST', body: '{}' });
  const o = _appr.orders.find(x => x.id === id);
  if (o && r) { o.addr_check = r.status; o.addr_note = r.note || null; renderApprovals(); }
}
async function apprSummary() {
  const r = await api('/api/admin/daily-summary/send', { method: 'POST', body: '{}' });
  alert(r && r.ok ? 'Summary emailed to the owner address.' : ((r && r.error) || 'Could not send the summary.'));
}
function apprCard(o, i) {
  const tag = (txt, bad) => `<span style="display:inline-block;margin:0 6px 4px 0;padding:2px 8px;font-size:11px;border:1px solid ${bad ? '#c1121f' : '#d4d4d4'};color:${bad ? '#c1121f' : '#6b6b6b'}">${esc(txt)}</span>`;
  const status = o.clean ? '<span style="color:#15803d">Looks clean</span>' : '<span style="color:#c1121f">Needs a look</span>';
  const problems = [
    ...(o.held ? ['Held for content review' + (o.flags.length ? ': ' + o.flags.join(', ') : '') + '. Open the order and mark it safe first.'] : []),
    ...o.issues,
    ...(o.error && /^MANUAL/.test(o.error) && !o.held && !o.scheduled ? [o.error.replace(/^MANUAL: /, '')] : []),
  ];
  const focus = i === _appr.focus;
  const open = _appr.open.has(o.id);
  return `<div id="appr-${o.id}" class="card" style="margin-bottom:16px;${focus ? 'outline:2px solid #111111;' : ''}">
    <div style="display:grid;grid-template-columns:${open ? 'minmax(260px,1fr) minmax(300px,1.4fr)' : '1fr'};gap:0">
      <div style="padding:16px 20px;min-width:0">
        <div style="display:flex;justify-content:space-between;gap:10px;font-size:11px;color:#6b6b6b;font-family:monospace;margin-bottom:10px">
          <label style="display:flex;gap:8px;align-items:center;cursor:${o.clean ? 'pointer' : 'not-allowed'}"><input type="checkbox" ${_appr.ticked.has(o.id) ? 'checked' : ''} ${o.clean && !o.approved_for ? '' : 'disabled'} onchange="apprTick(${o.id}, this.checked)"> ORDER #${o.id} · ${fmtDate(o.paid_at || o.created_at)} · ${esc(o.site)}</label>
          <span>${status}</span></div>
        <div style="font-size:14px;line-height:1.7;font-weight:500;color:#111111;margin-bottom:10px">${o.to.map(esc).join('<br>')}</div>
        <div style="margin-bottom:8px">${tag(o.pages ? o.pages + (o.pages > 1 ? ' pages' : ' page') : 'pages unknown', !o.pages)}${tag(o.colour ? 'colour' : 'black and white')}${o.large_envelope ? tag('large envelope') : ''}${o.extras.map(x => tag(x)).join('')}${o.no_return ? tag('no return address') : ''}${tag((o.price_cents / 100).toLocaleString(undefined, { style: 'currency', currency: 'CAD' }))}</div>
        ${addrBadge(o)}
        ${(o.tags || []).map(t => `<div style="font-size:12px;color:#92400e;background:#fef3c7;padding:6px 10px;margin-bottom:6px;line-height:1.5"><strong>${esc(t.label)}.</strong> ${esc(t.hint)}</div>`).join('')}
        ${o.waiting_hours >= (o.santa ? 12 : 24) ? `<div style="font-size:12px;color:#c1121f;margin-bottom:6px">Waiting ${o.waiting_hours} hours</div>` : ''}
        ${o.scheduled ? `<div style="font-size:12px;color:${o.approved_for ? '#15803d' : '#92400e'};background:${o.approved_for ? '#dcfce7' : '#fef3c7'};padding:6px 10px;margin-bottom:6px;line-height:1.5"><strong>${o.approved_for ? 'Approved.' : 'Scheduled.'}</strong> ${o.approved_for ? 'Goes to print automatically on ' + esc(o.scheduled) + '.' : 'The customer chose ' + esc(o.scheduled) + ' as the send date. Approve now and it goes to print that day.'}</div>` : ''}
        ${problems.length ? `<div style="font-size:12px;color:#c1121f;line-height:1.6;margin-bottom:8px">${problems.map(p => '• ' + esc(p)).join('<br>')}</div>` : ''}
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
          <button class="btn btn-outline btn-sm" onclick="apprPreview(${o.id})">${open ? 'Hide preview' : 'Preview letter'}</button>
          <a class="btn btn-outline btn-sm" href="/admin/orders/${o.id}" onclick="event.preventDefault();go('/admin/orders/${o.id}')">Open order</a>
          ${o.approved_for ? `<button class="btn btn-outline btn-sm" ${_appr.busy ? 'disabled' : ''} onclick="apprUnapprove(${o.id})">Withdraw approval</button>`
            : `<button class="btn btn-primary btn-sm" ${_appr.configured && !_appr.busy ? '' : 'disabled'} onclick="apprApprove([${o.id}])">${o.scheduled ? 'Approve, send on ' + esc(o.scheduled) : (o.addr_check === 'unverified' ? 'Approve and send as entered' : 'Approve and send to print')}</button>`}
        </div>
        <div id="appr-res-${o.id}" style="font-size:12px;margin-top:8px"></div>
      </div>
      ${open ? `<div style="border-left:1px solid #ececec;min-width:0"><div style="padding:8px 14px;font-size:11px;border-bottom:1px solid #ececec"><a class="link" href="/api/admin/orders/${o.id}/postgrid/preview" target="_blank" rel="noopener">Open full size</a> <span style="color:#6b6b6b">· if the letter does not appear here, your browser is not showing PDFs in frames</span></div><iframe src="/api/admin/orders/${o.id}/postgrid/preview" title="Letter preview for order ${o.id}" style="width:100%;height:540px;border:0;background:#f5f5f5"></iframe></div>` : ''}
    </div></div>`;
}
function renderApprovals() {
  const a = _appr, n = a.ticked.size;
  const cleanCount = a.orders.filter(o => o.clean).length;
  if (!a.orders.length) return setMain('<div class="empty" style="padding:60px">Nothing is waiting for approval.</div>');
  setMain(`
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px">
      <div style="font-size:12px;color:#6b6b6b;line-height:1.6">${a.orders.length} paid order${a.orders.length > 1 ? 's' : ''} waiting, ${cleanCount} look clean. Nothing is sent until you approve it.<br>
        Keys: <strong>j</strong> / <strong>k</strong> move, <strong>p</strong> preview, <strong>x</strong> tick, <strong>a</strong> approve this order, <strong>o</strong> open it.</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-outline btn-sm" onclick="apprSummary()">Email me the summary</button>
        <button class="btn btn-outline btn-sm" onclick="apprTickAll()">Tick all clean (up to ${a.max || 10})</button>
        <button class="btn btn-primary btn-sm" ${n && a.configured && !a.busy ? '' : 'disabled'} onclick="apprApprove([...(_appr.ticked)])">Approve ${n || ''} ticked</button>
      </div>
    </div>
    ${a.configured ? '' : '<div class="card" style="padding:14px 20px;color:#b45309;font-size:13px">PostGrid is not set up on this server, so orders can be checked here but not sent.</div>'}
    ${a.orders.map(apprCard).join('')}`);
}
function apprTick(id, on) { on ? _appr.ticked.add(id) : _appr.ticked.delete(id); if (_appr.ticked.size > (_appr.max || 10)) { _appr.ticked.delete(id); } renderApprovals(); }
function apprTickAll() { _appr.ticked = new Set(_appr.orders.filter(o => o.clean && !o.approved_for).slice(0, _appr.max || 10).map(o => o.id)); renderApprovals(); }
function apprPreview(id) { _appr.open.has(id) ? _appr.open.delete(id) : _appr.open.add(id); renderApprovals(); }
async function apprApprove(ids) {
  if (!ids.length || _appr.busy) return;
  const list = _appr.orders.filter(o => ids.includes(o.id));
  const warn = list.filter(o => !o.clean).length;
  const later = list.filter(o => o.scheduled);
  const msg = (later.length === list.length ? `Approve ${ids.length} scheduled order${ids.length > 1 ? 's' : ''} (#${ids.join(', #')})? Each goes to print automatically on its chosen date, not today.` : `Send ${ids.length} order${ids.length > 1 ? 's' : ''} to print (#${ids.join(', #')})?` + (later.length ? `\n\n${later.length} of them are scheduled and will only be approved, then sent on their date.` : '')) + (warn ? `\n\n${warn} of them need a look. Send anyway?` : '') + '\n\nThis cannot be undone from here.';
  if (!confirm(msg)) return;
  _appr.busy = true; renderApprovals();
  const r = await api('/api/admin/approvals/approve', { method: 'POST', body: JSON.stringify({ ids }) });
  _appr.busy = false;
  if (!r || !r.results) { alert((r && r.error) || 'Nothing was sent. Check the order page.'); return renderApprovals(); }
  const failed = r.results.filter(x => !x.ok);
  const held = r.results.filter(x => x.ok && x.scheduled_for);
  held.forEach(x => { const o = _appr.orders.find(y => y.id === x.id); if (o) { o.approved_for = x.scheduled_for; o.scheduled = x.scheduled_for; } });
  const sent = r.results.filter(x => x.ok && !x.scheduled_for).map(x => x.id);
  _appr.orders = _appr.orders.filter(o => !sent.includes(o.id));
  sent.forEach(id => _appr.ticked.delete(id));
  _appr.focus = Math.min(_appr.focus, Math.max(0, _appr.orders.length - 1));
  renderApprovals();
  failed.forEach(f => { const el = document.getElementById('appr-res-' + f.id); if (el) { el.style.color = '#c1121f'; el.textContent = 'Not sent: ' + (f.error || 'unknown error'); } });
  if (sent.length) toastApproved(sent.length);
  if (held.length) { const t = document.createElement('div'); t.textContent = held.length + ' scheduled order' + (held.length > 1 ? 's' : '') + ' approved. They go to print on their dates.'; t.style.cssText = 'position:fixed;bottom:24px;right:24px;background:#111111;color:#fff;padding:12px 18px;font-size:13px;z-index:9999'; document.body.appendChild(t); setTimeout(() => t.remove(), 3500); }
}
async function apprUnapprove(id) {
  const r = await api('/api/admin/approvals/unapprove', { method: 'POST', body: JSON.stringify({ id }) });
  const o = _appr.orders.find(x => x.id === id);
  if (r && r.ok && o) { o.approved_for = null; renderApprovals(); } else alert((r && r.error) || 'Could not withdraw the approval.');
}
function toastApproved(n) {
  const t = document.createElement('div');
  t.textContent = n + ' order' + (n > 1 ? 's' : '') + ' sent to print.';
  t.style.cssText = 'position:fixed;bottom:24px;right:24px;background:#111111;color:#fff;padding:12px 18px;font-size:13px;z-index:9999';
  document.body.appendChild(t); setTimeout(() => t.remove(), 3500);
}
document.addEventListener('keydown', e => {
  if (window.location.pathname !== '/admin/approvals' || e.metaKey || e.ctrlKey || e.altKey) return;
  const tg = e.target && e.target.tagName;
  if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT') return;
  const a = _appr, o = a.orders[a.focus];
  if (!o) return;
  const move = d => { a.focus = Math.max(0, Math.min(a.orders.length - 1, a.focus + d)); renderApprovals(); const el = document.getElementById('appr-' + a.orders[a.focus].id); if (el) el.scrollIntoView({ block: 'center' }); };
  if (e.key === 'j') move(1);
  else if (e.key === 'k') move(-1);
  else if (e.key === 'p') apprPreview(o.id);
  else if (e.key === 'x' && o.clean && !o.approved_for) apprTick(o.id, !a.ticked.has(o.id));
  else if (e.key === 'a') apprApprove([o.id]);
  else if (e.key === 'o') go('/admin/orders/' + o.id);
});

// ── Outreach follow-ups: who has not answered yet. Nothing is sent from here. ────────────────────
let followDays = 7;
async function showFollowups(days) {
  if (days) followDays = days;
  setTitle('Follow-ups');
  setMain('<div class="empty">Loading…</div>');
  const f = await api('/api/admin/outreach/followups?days=' + followDays);
  if (!f) return setMain('<div class="empty">Could not load this section.</div>');
  const ago = d => { const n = Math.floor((Date.now() - new Date(String(d).replace(' ', 'T') + 'Z')) / 86400000); return n <= 0 ? 'today' : n + ' day' + (n > 1 ? 's' : '') + ' ago'; };
  const who = r => `<strong>${esc(r.business_name || r.contact_name || r.email)}</strong>${r.contact_name && r.business_name ? ' · ' + esc(r.contact_name) : ''}<br><span style="font-family:monospace;font-size:12px">${esc(r.email)}</span>${r.phone ? ' · ' + esc(r.phone) : ''}`;
  const noteCell = r => `<input type="text" value="${esc(r.followup_note || '')}" maxlength="500" placeholder="Note" style="width:100%;font-size:12px;padding:6px 8px;border:1px solid #ececec" onchange="followAct(${r.id}, 'note', this.value)">`;
  const dueRows = f.due.map(r => `<tr><td>${who(r)}<div style="font-size:11px;color:#6b6b6b;margin-top:4px">${esc(r.campaign)} · sent ${ago(r.followup_done_at || r.sent_at)}${r.opens ? ` · <span style="color:#15803d">opened ${r.opens} time${r.opens > 1 ? 's' : ''}</span>` : ''}</div></td><td style="min-width:160px">${noteCell(r)}</td><td style="text-align:right;white-space:nowrap"><button class="btn btn-outline btn-sm" onclick="followAct(${r.id}, 'followed_up')">I followed up</button> <button class="btn btn-primary btn-sm" onclick="followAct(${r.id}, 'replied')">They replied</button></td></tr>`);
  const repliedRows = f.replied.map(r => `<tr><td>${who(r)}</td><td>${esc(r.followup_note || '')}</td><td style="text-align:right;white-space:nowrap">${ago(r.replied_at)} <button class="link" onclick="followAct(${r.id}, 'reopen')">Reopen</button></td></tr>`);
  const failedRows = f.failed.map(r => `<tr><td>${who(r)}</td><td style="font-size:12px;color:#c1121f">${esc(r.error || 'Could not be sent')}</td><td></td></tr>`);
  const dayBtns = [3, 7, 14, 30].map(d => `<button class="filter-btn ${followDays === d ? 'active' : ''}" onclick="showFollowups(${d})">${d} days</button>`).join('');
  setMain(`<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px">
      <div style="font-size:12px;color:#6b6b6b;line-height:1.6;max-width:640px">Contacts you emailed more than ${followDays} days ago who have not replied. Contacts who opened your email come first. Replies arrive in your own inbox, so mark them here when they do. Unsubscribed contacts never show up.</div>
      <div style="display:flex;gap:6px">${dayBtns}</div></div>
    <div class="stats-grid">
      ${statCard('To follow up', nf(f.due.length), f.due.filter(r => r.opens).length + ' opened the email')}
      ${statCard('Still waiting', nf(f.waiting), 'sent in the last ' + f.days + ' days')}
      ${statCard('Replied', nf(f.replied.length), 'marked by you')}
      ${statCard('Unsubscribed', nf(f.unsubscribed), 'left alone')}
    </div>
    <div class="card"><div class="card-header"><div class="card-title">Follow up</div></div>${tbl(['Contact', 'Note', ''], dueRows, 'No one is due a follow-up right now.')}</div>
    <div class="card"><div class="card-header"><div class="card-title">Replied</div></div>${tbl(['Contact', 'Note', ''], repliedRows, 'No replies marked yet.')}</div>
    <div class="card"><div class="card-header"><div class="card-title">Could not be sent</div></div>${tbl(['Contact', 'Problem', ''], failedRows, 'No failed sends.')}</div>`);
}
async function followAct(id, action, note) {
  const r = await api(`/api/admin/outreach/contacts/${id}/followup`, { method: 'POST', body: JSON.stringify({ action, note }) });
  if (action === 'note') return;
  if (!r || !r.ok) return alert((r && r.error) || 'Could not save that.');
  showFollowups();
}
</script>

<div id="bulk-delete-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center;padding:20px">
  <div style="background:#ffffff;border:1px solid #ececec;border-radius:0;max-width:480px;width:100%;padding:28px 32px;font-family:'Inter',system-ui,sans-serif" id="bulk-delete-modal-card">
    <div style="font-family:Georgia,serif;font-size:22px;font-weight:600;letter-spacing:-0.02em;color:#111;margin-bottom:8px">Move orders to Trash</div>
    <div style="font-size:13px;color:#6b6b6b;line-height:1.55;margin-bottom:18px">
      You are about to move <strong id="bulk-delete-count" style="color:#111">0</strong> order(s) to Trash. They can be restored from the Trash page.<br>
      <span style="color:#6b6b6b;font-size:12px">Customer accounts are not affected.</span>
    </div>
    <div style="font-size:11px;font-family:'DM Mono',ui-monospace,monospace;text-transform:uppercase;letter-spacing:0.12em;color:#6b6b6b;margin-bottom:8px">Type <strong style="color:#c1121f">delete</strong> to confirm</div>
    <input id="bulk-delete-input" type="text" autocomplete="off" oninput="onBulkDeleteInput(this.value)" onkeydown="if(event.key==='Enter'&&!document.getElementById('bulk-delete-confirm').disabled)runBulkDelete();if(event.key==='Escape')closeBulkDeleteModal()" style="width:100%;padding:10px 12px;border:1px solid #ececec;border-radius:0;font-size:14px;font-family:'DM Mono',ui-monospace,monospace;margin-bottom:20px;background:#fafafa">
    <div style="display:flex;justify-content:flex-end;gap:10px">
      <button class="btn btn-outline btn-sm" onclick="closeBulkDeleteModal()">Cancel</button>
      <button id="bulk-delete-confirm" class="btn btn-primary btn-sm" onclick="runBulkDelete()" disabled style="background:#c1121f;border-color:#c1121f">Delete</button>
    </div>
  </div>
</div>
<style>
html[data-theme="dark"] #bulk-delete-modal-card{background:#141414;border-color:rgba(255,255,255,0.08)}
html[data-theme="dark"] #bulk-delete-modal-card div[style*="color:#111"]{color:#f5f5f5!important}
html[data-theme="dark"] #bulk-delete-input{background:#0a0a0a;border-color:rgba(255,255,255,0.15);color:#f5f5f5}
#bulk-delete-confirm:disabled{opacity:0.45;cursor:not-allowed}
.btn:disabled{opacity:0.45;cursor:not-allowed}
</style>
