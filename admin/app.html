<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Letterhome</title>
<script>(function(){try{var t=localStorage.getItem('lh-admin-theme')||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#f1f5f9;color:#0f172a;min-height:100vh;display:flex}
/* ── Dark mode overrides ── */
html[data-theme="dark"] body{background:#0f172a;color:#f1f5f9}
html[data-theme="dark"] .topbar{background:#1e293b;border-bottom-color:rgba(255,255,255,0.06)}
html[data-theme="dark"] .topbar-title{color:#f1f5f9}
html[data-theme="dark"] .topbar-user{color:#94a3b8}
html[data-theme="dark"] .stat-card{background:#1e293b;border-color:rgba(255,255,255,0.06)}
html[data-theme="dark"] .stat-value{color:#f1f5f9}
html[data-theme="dark"] .stat-label{color:#94a3b8}
html[data-theme="dark"] .stat-sub{color:#64748b}
html[data-theme="dark"] .card{background:#1e293b;border-color:rgba(255,255,255,0.06)}
html[data-theme="dark"] .card-header{border-bottom-color:rgba(255,255,255,0.06)}
html[data-theme="dark"] .card-title{color:#f1f5f9}
html[data-theme="dark"] th{background:#0f172a;color:#94a3b8;border-bottom-color:rgba(255,255,255,0.08)}
html[data-theme="dark"] td{color:#cbd5e1;border-bottom-color:rgba(255,255,255,0.04)}
html[data-theme="dark"] tr:hover td{background:rgba(255,255,255,0.04)}
html[data-theme="dark"] .detail-card{background:#1e293b;border-color:rgba(255,255,255,0.06)}
html[data-theme="dark"] .detail-card-title{color:#94a3b8}
html[data-theme="dark"] .detail-row{border-bottom-color:rgba(255,255,255,0.04)}
html[data-theme="dark"] .detail-label{color:#94a3b8}
html[data-theme="dark"] .detail-value{color:#f1f5f9}
html[data-theme="dark"] .address-block{color:#cbd5e1}
html[data-theme="dark"] .letter-body{background:#0f172a;color:#cbd5e1;border-color:rgba(255,255,255,0.06)}
html[data-theme="dark"] .page-title{color:#f1f5f9}
html[data-theme="dark"] .filter-btn{background:#1e293b;color:#94a3b8;border-color:rgba(255,255,255,0.08)}
html[data-theme="dark"] .filter-btn:hover,html[data-theme="dark"] .filter-btn.active{background:#f1f5f9;color:#0f172a;border-color:#f1f5f9}
html[data-theme="dark"] input[type=text],html[data-theme="dark"] input[type=email],html[data-theme="dark"] textarea,html[data-theme="dark"] select{background:#0f172a;color:#f1f5f9;border-color:rgba(255,255,255,0.1)}
html[data-theme="dark"] .field label{color:#94a3b8}
html[data-theme="dark"] .btn-outline{background:#1e293b;color:#cbd5e1;border-color:rgba(255,255,255,0.1)}
html[data-theme="dark"] .btn-outline:hover{background:#0f172a}
html[data-theme="dark"] .btn-ghost{color:#94a3b8}
html[data-theme="dark"] .btn-ghost:hover{background:rgba(255,255,255,0.06);color:#fca5a5}
html[data-theme="dark"] .tag{background:rgba(255,255,255,0.06);color:#cbd5e1}
html[data-theme="dark"] .file-item{background:#0f172a;border-color:rgba(255,255,255,0.06)}
html[data-theme="dark"] .file-name{color:#cbd5e1}
html[data-theme="dark"] .note-item{border-bottom-color:rgba(255,255,255,0.04)}
html[data-theme="dark"] .note-text{color:#cbd5e1}
html[data-theme="dark"] .note-meta{color:#64748b}
html[data-theme="dark"] .empty{color:#64748b}
html[data-theme="dark"] .back-link{color:#94a3b8}
html[data-theme="dark"] .back-link:hover{color:#fca5a5}
html[data-theme="dark"] .badge-gray{background:rgba(148,163,184,0.15);color:#cbd5e1}
html[data-theme="dark"] .badge-blue{background:rgba(59,130,246,0.15);color:#93c5fd}
html[data-theme="dark"] .badge-amber{background:rgba(245,158,11,0.15);color:#fcd34d}
html[data-theme="dark"] .badge-violet{background:rgba(139,92,246,0.15);color:#c4b5fd}
html[data-theme="dark"] .badge-green{background:rgba(16,185,129,0.15);color:#6ee7b7}
/* Admin theme toggle button */
.admin-theme-toggle{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;color:#64748b;font-size:13px;cursor:pointer;transition:all 0.15s;border:none;background:none;width:100%;font-family:inherit;text-align:left;margin-bottom:6px}
.admin-theme-toggle:hover{color:#94a3b8;background:rgba(255,255,255,0.04)}
.admin-theme-toggle .label-light{display:inline}
.admin-theme-toggle .label-dark{display:none}
html[data-theme="dark"] .admin-theme-toggle .label-light{display:none}
html[data-theme="dark"] .admin-theme-toggle .label-dark{display:inline}
/* ── Sidebar ── */
.sidebar{width:220px;min-height:100vh;background:#0f172a;display:flex;flex-direction:column;flex-shrink:0;position:fixed;top:0;left:0;bottom:0}
.sidebar-logo{padding:24px 20px 20px;border-bottom:1px solid rgba(255,255,255,0.06)}
.sidebar-logo-inner{display:flex;align-items:center;gap:10px}
.logo-mark{width:32px;height:32px;background:#dc2626;border-radius:4px;display:grid;place-items:center;color:#fff;font-size:16px;font-family:Georgia,serif;font-weight:700;flex-shrink:0}
.logo-text{color:#f8fafc;font-size:15px;font-weight:600;letter-spacing:-0.02em}
.sidebar-nav{flex:1;padding:16px 12px}
.nav-label{color:#475569;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;padding:0 8px;margin:16px 0 6px}
.nav-link{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;color:#94a3b8;font-size:13px;font-weight:500;text-decoration:none;cursor:pointer;transition:all 0.15s;margin-bottom:2px;border:none;background:none;width:100%;text-align:left}
.nav-link:hover{background:rgba(255,255,255,0.06);color:#e2e8f0}
.nav-link.active{background:rgba(220,38,38,0.15);color:#fca5a5}
.nav-icon{font-size:15px;width:18px;text-align:center}
.sidebar-footer{padding:16px 12px;border-top:1px solid rgba(255,255,255,0.06)}
.logout-btn{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;color:#64748b;font-size:13px;cursor:pointer;transition:all 0.15s;border:none;background:none;width:100%}
.logout-btn:hover{color:#94a3b8;background:rgba(255,255,255,0.04)}
/* ── Content ── */
.content{margin-left:220px;flex:1;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-title{font-size:16px;font-weight:600;color:#0f172a;letter-spacing:-0.01em}
.topbar-user{font-size:13px;color:#64748b}
.main{padding:32px;flex:1}
/* ── Cards & Stats ── */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
.stat-card{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:20px 24px}
.stat-label{font-size:12px;color:#64748b;font-weight:500;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px}
.stat-value{font-size:28px;font-weight:700;color:#0f172a;letter-spacing:-0.03em}
.stat-sub{font-size:12px;color:#94a3b8;margin-top:4px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:8px;overflow:hidden;margin-bottom:24px}
.card-header{padding:16px 20px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:14px;font-weight:600;color:#0f172a}
/* ── Tables ── */
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:left;font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:0.08em;background:#f8fafc;border-bottom:1px solid #e2e8f0}
td{padding:13px 16px;font-size:13px;color:#334155;border-bottom:1px solid #f1f5f9}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f8fafc}
.link{color:#dc2626;text-decoration:none;font-weight:500;cursor:pointer;background:none;border:none;font-size:13px;padding:0}
.link:hover{text-decoration:underline}
/* ── Status badges ── */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase}
.badge-gray{background:#f1f5f9;color:#64748b}
.badge-blue{background:#eff6ff;color:#1d4ed8}
.badge-amber{background:#fffbeb;color:#b45309}
.badge-violet{background:#f5f3ff;color:#6d28d9}
.badge-green{background:#f0fdf4;color:#15803d}
/* ── Forms & Inputs ── */
.form-row{display:flex;gap:12px;align-items:flex-end;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:6px;flex:1}
.field label{font-size:12px;font-weight:500;color:#64748b;text-transform:uppercase;letter-spacing:0.06em}
input[type=text],input[type=email],textarea,select{width:100%;border:1px solid #e2e8f0;border-radius:6px;padding:9px 12px;font-size:13px;color:#0f172a;outline:none;font-family:inherit;background:#fff;transition:border-color 0.15s}
input[type=text]:focus,input[type=email]:focus,textarea:focus,select:focus{border-color:#dc2626}
textarea{resize:vertical;min-height:80px}
.btn{padding:9px 18px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all 0.15s;letter-spacing:0.01em}
.btn-primary{background:#dc2626;color:#fff}
.btn-primary:hover{background:#b91c1c}
.btn-outline{background:#fff;color:#334155;border:1px solid #e2e8f0}
.btn-outline:hover{background:#f8fafc}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-ghost{background:none;border:none;color:#64748b;cursor:pointer;font-size:12px;padding:4px 8px;border-radius:4px}
.btn-ghost:hover{background:#f1f5f9;color:#dc2626}
/* ── Detail views ── */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
.detail-card{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:20px}
.detail-card-title{font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:14px}
.detail-row{display:flex;justify-content:space-between;align-items:flex-start;padding:7px 0;border-bottom:1px solid #f1f5f9;font-size:13px}
.detail-row:last-child{border-bottom:none}
.detail-label{color:#64748b;flex-shrink:0;margin-right:16px}
.detail-value{color:#0f172a;font-weight:500;text-align:right;word-break:break-word}
.address-block{font-size:13px;color:#334155;line-height:1.7;white-space:pre-line}
.letter-body{font-size:13px;color:#334155;line-height:1.75;white-space:pre-wrap;font-family:Georgia,serif;padding:16px;background:#f8fafc;border-radius:6px;border:1px solid #e2e8f0}
/* ── Tags ── */
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:6px;background:#f1f5f9;color:#475569;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:500}
.tag-remove{background:none;border:none;cursor:pointer;color:#94a3b8;font-size:14px;line-height:1;padding:0}
.tag-remove:hover{color:#dc2626}
/* ── Notes ── */
.note-item{padding:12px 0;border-bottom:1px solid #f1f5f9}
.note-item:last-child{border-bottom:none}
.note-meta{font-size:11px;color:#94a3b8;margin-bottom:4px}
.note-text{font-size:13px;color:#334155;line-height:1.6}
/* ── Filters ── */
.filter-row{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.filter-btn{padding:6px 14px;border-radius:999px;border:1px solid #e2e8f0;background:#fff;font-size:12px;font-weight:500;color:#64748b;cursor:pointer;transition:all 0.15s}
.filter-btn.active,.filter-btn:hover{background:#0f172a;color:#fff;border-color:#0f172a}
/* ── Misc ── */
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.page-title{font-size:22px;font-weight:700;color:#0f172a;letter-spacing:-0.03em}
.empty{text-align:center;padding:60px 20px;color:#94a3b8;font-size:14px}
.files-list{display:flex;flex-direction:column;gap:8px;padding:16px 20px}
.file-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;font-size:13px}
.file-name{color:#334155;font-weight:500}
.back-link{display:inline-flex;align-items:center;gap:6px;color:#64748b;font-size:13px;cursor:pointer;background:none;border:none;margin-bottom:20px;padding:0}
.back-link:hover{color:#dc2626}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-inner">
      <div class="logo-mark">L</div>
      <div class="logo-text">Letterhome</div>
    </div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-label">Menu</div>
    <button class="nav-link" id="nav-dashboard"  onclick="go('/admin')"><span class="nav-icon">◈</span> Dashboard</button>
<button class="nav-link" id="nav-orders"     onclick="go('/admin/orders')"><span class="nav-icon">✉</span> Orders</button>

<div class="content">
  <div class="topbar">
    <div class="topbar-title" id="topbar-title">Dashboard</div>
    <div class="topbar-user" id="topbar-user"></div>
  </div>
  <div class="main" id="main">
    <div class="empty">Loading…</div>
  </div>
</div>

<script>
let currentUser = '';

// ── Router ────────────────────────────────────────────────────────────────────
async function init() {
  const me = await api('/api/admin/me');
  if (!me) { window.location.href = '/admin/login'; return; }
  currentUser = me.username;
  document.getElementById('topbar-user').textContent = me.username;
  window.addEventListener('popstate', () => route());
  startCountdownTicker();
  api('/api/admin/contacts/unread').then(d => { if (d) updateContactsBadge(d.unread); });
  route();
}

function go(path) {
  history.pushState({}, '', path);
  route();
}

function route() {
  const p = window.location.pathname;
  setActiveNav(p);
  if (p === '/admin' || p === '/admin/')           return showDashboard();
  if (p === '/admin/orders')                        return showOrders();
  if (p.match(/^\/admin\/orders\/\d+$/))            return showOrder(p.split('/').pop());
  if (p === '/admin/customers')                     return showCustomers();
  if (p.match(/^\/admin\/customers\/.+$/))          return showCustomer(decodeURIComponent(p.replace('/admin/customers/', '')));
  if (p === '/admin/accounts')                      return showAccounts();
  if (p.match(/^\/admin\/accounts\/.+$/))           return showAccount(decodeURIComponent(p.replace('/admin/accounts/', '')));
  if (p === '/admin/trash')                         return showTrash();
  if (p === '/admin/broadcast')                     return showBroadcast();
  if (p === '/admin/print-queue')                   return showPrintQueue();
  if (p === '/admin/insights')                      return showInsights();
  if (p === '/admin/visitors')                      return showVisitors();
  if (p === '/admin/stripe')                        return showStripe();
  if (p === '/admin/contacts')                      return showContacts();
  if (p === '/admin/templates')                     return showTemplates();
  if (p === '/admin/settings')                      return showSettings();
  showDashboard();
}

function setActiveNav(p) {
  ['dashboard','orders','customers','accounts','broadcast','insights','visitors','stripe','contacts','templates','settings','trash'].forEach(k => document.getElementById('nav-'+k)?.classList.remove('active'));
  if (p.startsWith('/admin/orders'))          document.getElementById('nav-orders')?.classList.add('active');
  else if (p.startsWith('/admin/accounts'))   document.getElementById('nav-accounts')?.classList.add('active');
  else if (p.startsWith('/admin/customers'))  document.getElementById('nav-customers')?.classList.add('active');
  else if (p.startsWith('/admin/broadcast'))  document.getElementById('nav-broadcast')?.classList.add('active');
  else if (p.startsWith('/admin/insights'))   document.getElementById('nav-insights')?.classList.add('active');
  else if (p.startsWith('/admin/visitors'))   document.getElementById('nav-visitors')?.classList.add('active');
  else if (p.startsWith('/admin/stripe'))     document.getElementById('nav-stripe')?.classList.add('active');
  else if (p.startsWith('/admin/contacts'))   document.getElementById('nav-contacts')?.classList.add('active');
  else if (p.startsWith('/admin/templates'))  document.getElementById('nav-templates')?.classList.add('active');
  else if (p.startsWith('/admin/settings'))   document.getElementById('nav-settings')?.classList.add('active');
  else if (p.startsWith('/admin/trash'))      document.getElementById('nav-trash')?.classList.add('active');
  else                                        document.getElementById('nav-dashboard')?.classList.add('active');
}

function setTitle(t) { document.getElementById('topbar-title').textContent = t; }
function setMain(html) { document.getElementById('main').innerHTML = html; }

// ── API helper ────────────────────────────────────────────────────────────────
async function api(url, opts = {}) {
  try {
    const r = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts });
    if (r.status === 401) { window.location.href = '/admin/login'; return null; }
    return r.ok ? r.json() : null;
  } catch { return null; }
}

async function post(url, body) {
  return api(url, { method: 'POST', body: JSON.stringify(body) });
}

async function del(url) {
  return api(url, { method: 'DELETE' });
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function statusBadge(s) {
  const map = {
    awaiting_payment:     ['badge-gray',   'Awaiting Payment'],
    paid:                 ['badge-blue',   'Paid'],
    submitted_to_printer: ['badge-amber',  'At Printer'],
    printing:             ['badge-amber',  'Printing'],
    mailed:               ['badge-violet', 'Mailed'],
    delivered:            ['badge-green',  'Delivered'],
    refunded:             ['badge-gray',   'Refunded'],
  };
  const [cls, label] = map[s] || ['badge-gray', s];
  return `<span class="badge ${cls}">${label}</span>`;
}

function fmtDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('en-CA', { year:'numeric', month:'short', day:'numeric' });
}

function fmtDateTime(d) {
  if (!d) return '—';
  return new Date(d).toLocaleString('en-CA', {
    month:'short', day:'numeric', year:'numeric',
    hour:'numeric', minute:'2-digit'
  });
}

function fmtCAD(cents) {
  return '$' + (cents / 100).toFixed(2) + ' CAD';
}

// ── 24h fulfillment countdown ─────────────────────────────────────────────────
function timeLeftHTML(createdAt, status) {
  if (status === 'mailed' || status === 'delivered')
    return `<span data-countdown-created="${createdAt}" data-countdown-status="${status}" style="color:#64748b;font-size:12px">Completed</span>`;
  if (status === 'awaiting_payment')
    return `<span data-countdown-created="${createdAt}" data-countdown-status="${status}" style="color:#94a3b8;font-size:12px">—</span>`;

  const deadline  = new Date(createdAt).getTime() + 24 * 3600000;
  const remaining = deadline - Date.now();
  const h = Math.floor(Math.abs(remaining) / 3600000);
  const m = Math.floor((Math.abs(remaining) % 3600000) / 60000);

  let color, text;
  if (remaining < 0)                  { color='#dc2626'; text=`⚠ Overdue ${h}h ${m}m`; }
  else if (remaining < 4 * 3600000)   { color='#dc2626'; text=`${h}h ${m}m left`; }
  else if (remaining < 12 * 3600000)  { color='#d97706'; text=`${h}h ${m}m left`; }
  else                                { color='#16a34a'; text=`${h}h ${m}m left`; }
  return `<span data-countdown-created="${createdAt}" data-countdown-status="${status}" style="color:${color};font-weight:600;font-size:12px">${text}</span>`;
}

function slaBanner(createdAt, status) {
  if (status === 'mailed' || status === 'delivered' || status === 'awaiting_payment') return '';
  const deadline  = new Date(createdAt).getTime() + 24 * 3600000;
  const remaining = deadline - Date.now();
  const h = Math.floor(Math.abs(remaining) / 3600000);
  const m = Math.floor((Math.abs(remaining) % 3600000) / 60000);

  let bg, color, icon, text;
  if (remaining < 0)                  { bg='#fef2f2'; color='#991b1b'; icon='⚠'; text=`Overdue by ${h}h ${m}m — mail this order immediately.`; }
  else if (remaining < 4 * 3600000)   { bg='#fef2f2'; color='#991b1b'; icon='⚠'; text=`${h}h ${m}m left to mail this order.`; }
  else if (remaining < 12 * 3600000)  { bg='#fffbeb'; color='#92400e'; icon='⏱'; text=`${h}h ${m}m left to mail this order.`; }
  else                                { bg='#f0fdf4'; color='#166534'; icon='✓'; text=`${h}h ${m}m left to mail this order.`; }
  return `<div data-sla-created="${createdAt}" data-sla-status="${status}" style="background:${bg};color:${color};padding:14px 20px;border-radius:6px;margin-bottom:20px;font-size:14px;display:flex;align-items:center;gap:12px;border:1px solid ${color}33">
    <span style="font-size:18px">${icon}</span>
    <span><strong>24-hour fulfillment SLA — </strong>${text}</span>
  </div>`;
}

function startCountdownTicker() {
  setInterval(() => {
    document.querySelectorAll('[data-countdown-created]').forEach(el => {
      const created = el.dataset.countdownCreated;
      const status  = el.dataset.countdownStatus;
      const tmp = document.createElement('div');
      tmp.innerHTML = timeLeftHTML(created, status);
      el.replaceWith(tmp.firstElementChild);
    });
    document.querySelectorAll('[data-sla-created]').forEach(el => {
      const created = el.dataset.slaCreated;
      const status  = el.dataset.slaStatus;
      const tmp = document.createElement('div');
      tmp.innerHTML = slaBanner(created, status);
      if (tmp.firstElementChild) el.replaceWith(tmp.firstElementChild);
    });
  }, 60000);
}

function renderBarChart(data, maxBarPx) {
  if (!data || !data.length) return '<div class="empty" style="padding:20px">No data yet.</div>';
  const maxRev = Math.max(...data.map(d => d.revenue_cents), 1);
  const bars = data.map(d => {
    const h = Math.max(4, Math.round((d.revenue_cents / maxRev) * maxBarPx));
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:0">
      <span style="font-size:10px;color:#64748b">${fmtCAD(d.revenue_cents).replace(' CAD','')}</span>
      <div style="width:100%;height:${h}px;background:#a8472d;border-radius:2px 2px 0 0;min-height:4px" title="${d.label}: ${d.orders} orders, ${fmtCAD(d.revenue_cents)}"></div>
      <span style="font-size:10px;color:#94a3b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%">${esc(d.label)}</span>
    </div>`;
  }).join('');
  return `<div style="display:flex;align-items:flex-end;gap:4px;height:${maxBarPx + 50}px;padding:0 4px">${bars}</div>`;
}

function renderOrdersTable() {
  const q = (document.getElementById('order-search')?.value || '').toLowerCase();
  const filtered = q
    ? allOrders.filter(o =>
        String(o.id).includes(q) ||
        (o.recipient_name  || '').toLowerCase().includes(q) ||
        (o.customer_email  || '').toLowerCase().includes(q) ||
        (o.destination_country || '').toLowerCase().includes(q))
    : allOrders;

  const rows = filtered.map(o => `
    <tr>
      <td><input type="checkbox" class="order-cb" value="${o.id}" onchange="updateBulkBar()"></td>
      <td><button class="link" onclick="go('/admin/orders/${o.id}')">#${o.id}</button></td>
      <td>${fmtDateTime(o.created_at)}</td>
      <td>${esc(o.recipient_name)}</td>
      <td>${esc(o.recipient_city||'')}${o.recipient_city&&o.destination_country?', ':''}${o.destination_country||''}</td>
      <td>${statusBadge(o.status)}</td>
      <td>${timeLeftHTML(o.created_at, o.status)}</td>
      <td>${fmtCAD(o.price_cents)}</td>
      <td><button class="link" onclick="go('/admin/orders/${o.id}')">View →</button></td>
    </tr>`).join('');

  const tbody = document.getElementById('orders-tbody');
  if (tbody) tbody.innerHTML = rows || '<tr><td colspan="9" class="empty">No orders.</td></tr>';
}

function toggleSelectAll(checked) {
  document.querySelectorAll('.order-cb').forEach(cb => cb.checked = checked);
  updateBulkBar();
}

function updateBulkBar() {
  const selected = document.querySelectorAll('.order-cb:checked');
  const bar = document.getElementById('bulk-bar');
  const count = document.getElementById('bulk-count');
  if (!bar) return;
  if (selected.length > 0) {
    bar.style.display = 'flex';
    count.textContent = `${selected.length} order${selected.length>1?'s':''} selected`;
  } else {
    bar.style.display = 'none';
  }
}

function clearSelection() {
  document.querySelectorAll('.order-cb').forEach(cb => cb.checked = false);
  const sa = document.getElementById('select-all');
  if (sa) sa.checked = false;
  updateBulkBar();
}

async function applyBulkStatus() {
  const status = document.getElementById('bulk-status-select').value;
  if (!status) return alert('Choose a status first.');
  const ids = [...document.querySelectorAll('.order-cb:checked')].map(cb => Number(cb.value));
  if (!ids.length) return;
  if (!confirm(`Mark ${ids.length} order(s) as "${status}"?`)) return;
  const r = await post('/api/admin/orders/bulk-status', { ids, status });
  if (r?.ok) { showOrders(); }
  else alert('Error: ' + (r?.error || 'unknown'));
}

  const fromAddr = o.skip_return ? 'No return address'
    : [o.sender_name, o.sender_street,
       [o.sender_city, o.sender_province, o.sender_postal].filter(Boolean).join(' '),
       o.sender_country].filter(Boolean).join('\n');

  const toAddr = [o.recipient_name, o.recipient_street,
    [o.recipient_city, o.recipient_province, o.recipient_postal].filter(Boolean).join(' '),
    o.destination_country].filter(Boolean).join('\n');

  const userFiles = (o.files || []).filter(f => f !== 'order.json');
  const fileItems = userFiles.map(f => `
      <div class="file-item">
        <span class="file-name">📄 ${esc(f)}</span>
        <a class="btn btn-outline btn-sm" href="/api/admin/orders/${o.id}/files/${encodeURIComponent(f)}" target="_blank">Download</a>
      </div>`).join('');

  const allStatuses = ['awaiting_payment','paid','submitted_to_printer','printing','mailed','delivered','refunded'];
  const statusOpts = allStatuses.map(s => `<option value="${s}" ${o.status===s?'selected':''}>${s.replace(/_/g,' ')}</option>`).join('');

  setMain(`
    <button class="back-link" onclick="go('/admin/orders')">← Back to Orders</button>
    <div class="page-header">
      <div class="page-title">Order #${o.id}</div>
      <div style="display:flex;align-items:center;gap:12px">

      <div style="padding:20px">
        <div class="field" style="margin-bottom:12px">
          <label>Subject</label>
          <input id="msg-subject" type="text" value="Re: Letterhome order #${o.id}">
        </div>
        <div class="field" style="margin-bottom:12px">
          <label>Message</label>
          <textarea id="msg-body" placeholder="Hi — about your order…"></textarea>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary btn-sm" onclick="sendMessage(${o.id})">Send Email</button>
          <button class="btn btn-outline btn-sm" onclick="toggleMessageForm(${o.id})">Cancel</button>
          <span id="msg-status" style="font-size:12px;color:#16a34a;align-self:center;display:none">✓ Sent</span>
        </div>
      </div>
    </div>
    ${slaBanner(o.created_at, o.status)}
    <div class="detail-grid">
      <div class="detail-card">
        <div class="detail-card-title">From</div>
        <div class="address-block">${esc(fromAddr)}</div>
      </div>
      <div class="detail-card">
        <div class="detail-card-title">To</div>
        <div class="address-block">${esc(toAddr)}</div>
      </div>
    </div>
    <div class="detail-grid">
      <div class="detail-card">
        <div class="detail-card-title">Order Info</div>
        <div class="detail-row"><span class="detail-label">Customer</span><span class="detail-value"><button class="link" onclick="go('/admin/customers/${encodeURIComponent(o.customer_email)}')">${esc(o.customer_email)}</button></span></div>
        <div class="detail-row"><span class="detail-label">Submitted</span><span class="detail-value">${fmtDateTime(o.created_at)}</span></div>
        <div class="detail-row"><span class="detail-label">IP address</span><span class="detail-value">${o.customer_ip ? esc(o.customer_ip) : '<span style="color:#94a3b8">—</span>'}</span></div>
        <div class="detail-row"><span class="detail-label">Type</span><span class="detail-value">${esc(o.letter_type||'standard')}</span></div>
        <div class="detail-row"><span class="detail-label">Price</span><span class="detail-value">${fmtCAD(o.price_cents)}</span></div>
        ${o.actual_cost_cents != null ? `<div class="detail-row"><span class="detail-label">Actual Cost</span><span class="detail-value">${fmtCAD(o.actual_cost_cents)}</span></div>` : ''}
        ${o.printer_ref ? `<div class="detail-row"><span class="detail-label">Printer Ref</span><span class="detail-value" style="font-family:monospace;font-size:13px">${esc(o.printer_ref)}</span></div>` : ''}
        ${o.estimated_delivery ? `<div class="detail-row"><span class="detail-label">Est. Delivery</span><span class="detail-value">${esc(o.estimated_delivery)}</span></div>` : ''}
        ${o.status_token ? `<div class="detail-row"><span class="detail-label">Status Page</span><span class="detail-value"><a href="/status/${o.status_token}" target="_blank" class="link" style="font-size:12px">View →</a></span></div>` : ''}
        <div class="detail-row" style="border-bottom:none;flex-direction:column;gap:8px;align-items:flex-start">
          <span class="detail-label">Record actual cost</span>
          <div style="display:flex;gap:8px;align-items:center;width:100%">
            <span style="font-size:13px;color:#64748b">$</span>
            <input type="number" id="actual-cost-input" min="0" step="0.01" placeholder="0.00" style="width:100px" value="${o.actual_cost_cents != null ? (o.actual_cost_cents/100).toFixed(2) : ''}">
            <span style="font-size:13px;color:#64748b">CAD</span>
            <button class="btn btn-outline btn-sm" onclick="saveActualCost(${o.id})">Save</button>
          </div>

      </div>
      ${fulfillmentCard(o, statusOpts)}

    ${o.letter_body ? `
    <div class="card" style="margin-bottom:24px">
      <div class="card-header"><div class="card-title">Letter Content</div></div>
      <div style="padding:20px"><div class="letter-body">${esc(o.letter_body)}</div></div>
    </div>` : ''}
    ${fileItems ? `

        <div class="card-title">Attachments</div>

    </div>` : ''}

      <div class="card-header"><div class="card-title">Order Notes</div></div>
      <div style="padding:16px 20px">

    </div>`);
}

function toggleMessageForm() {
  const f = document.getElementById('message-form');
  f.style.display = f.style.display === 'none' ? 'block' : 'none';
}

async function sendMessage(id) {
  const subject = document.getElementById('msg-subject').value.trim();
  const body    = document.getElementById('msg-body').value.trim();
  if (!subject || !body) return alert('Subject and message are required.');
  const r = await post(`/api/admin/orders/${id}/message`, { subject, body });
  if (r?.ok) {
    const s = document.getElementById('msg-status');
    s.style.display = 'inline';
    document.getElementById('msg-body').value = '';
    setTimeout(() => s.style.display = 'none', 3000);
  } else {
    alert('Could not send: ' + (r?.error || 'unknown error'));
  }
}

async function saveActualCost(id) {
  const val = parseFloat(document.getElementById('actual-cost-input').value);
  if (isNaN(val) || val < 0) return alert('Enter a valid non-negative cost.');
  const cents = Math.round(val * 100);
  const r = await post(`/api/admin/orders/${id}/actual-cost`, { actual_cost_cents: cents });
  if (r?.ok) showOrder(id);
  else alert('Error: ' + (r?.error || 'could not save'));
}

async function addOrderNote(id) {
  const note = document.getElementById('order-note-input').value.trim();
  if (!note) return;
  const r = await post(`/api/admin/orders/${id}/notes`, { note });
  if (r?.ok) showOrder(id);
  else alert('Error: ' + (r?.error || 'could not add note'));
}

function fulfillmentCard(o, statusOpts) {
  if (o.status === 'paid') {
    return `<div class="detail-card">
      <div class="detail-card-title">Fulfillment — Submit to Printer</div>
      <p style="font-size:13px;color:#64748b;margin-bottom:16px;line-height:1.6">Upload this order to the printer's portal, then enter the reference number they assign.</p>
      <div class="field" style="margin-bottom:12px">
        <label>Printer Reference Number</label>
        <input id="printer-ref" type="text" placeholder="8-digit ref" maxlength="20" style="font-family:monospace">
      </div>
      <button class="btn btn-primary" onclick="submitToPrinter(${o.id})">Mark as Submitted to Printer</button>
      <div id="submit-msg" style="font-size:12px;color:#16a34a;margin-top:10px;display:none">✓ Saved — status updated to At Printer</div>
    </div>`;
  }
  if (o.status === 'submitted_to_printer') {
    return `<div class="detail-card">
      <div class="detail-card-title">Fulfillment — Mark as Mailed</div>
      <p style="font-size:13px;color:#64748b;margin-bottom:16px;line-height:1.6">When the printer confirms the letter has been dropped with Canada Post, enter the estimated delivery and notify the customer.</p>
      <div class="field" style="margin-bottom:12px">
        <label>Estimated Delivery (from printer's email)</label>
        <input id="est-delivery" type="text" placeholder="e.g. 5–10 business days">
      </div>
      <button class="btn btn-primary" onclick="markMailed(${o.id})">Mark as Mailed &amp; Notify Customer</button>
      <div id="mailed-msg" style="font-size:12px;color:#16a34a;margin-top:10px;display:none">✓ Mailed — customer has been notified</div>
    </div>`;
  }
  return `<div class="detail-card">
    <div class="detail-card-title">Update Status</div>
    <div class="form-row" style="margin-bottom:0">
      <div class="field"><select id="status-select">${statusOpts}</select></div>
      <button class="btn btn-primary" onclick="updateStatus(${o.id})">Save</button>
    </div>
    <div id="status-msg" style="font-size:12px;color:#16a34a;margin-top:10px;display:none">✓ Status updated</div>
  </div>`;
}

async function submitToPrinter(id) {
  const ref = document.getElementById('printer-ref').value.trim();
  if (!ref) return alert('Enter the printer reference number first.');
  const r = await post(`/api/admin/orders/${id}/submit-to-printer`, { printer_ref: ref });
  if (r?.ok) {
    document.getElementById('submit-msg').style.display = 'block';
    setTimeout(() => showOrder(id), 1200);
  } else {
    alert('Error: ' + (r?.error || 'could not save'));
  }
}

async function markMailed(id) {
  const est = document.getElementById('est-delivery').value.trim();
  if (!est) return alert('Enter the estimated delivery from the printer\'s email.');
  if (!confirm(`Mark as mailed and send the customer a notification email with estimated delivery: "${est}"?`)) return;
  const r = await post(`/api/admin/orders/${id}/mark-mailed`, { estimated_delivery: est });
  if (r?.ok) {
    document.getElementById('mailed-msg').style.display = 'block';
    setTimeout(() => showOrder(id), 1200);
  } else {
    alert('Error: ' + (r?.error || 'could not save'));
  }
}

function downloadAllFiles(orderId, files) {
  files.forEach((f, i) => {
    setTimeout(() => {
      const a = document.createElement('a');
      a.href = `/api/admin/orders/${orderId}/files/${encodeURIComponent(f)}`;
      a.download = f;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }, i * 600);
  });
}

async function updateStatus(id) {
  const status = document.getElementById('status-select').value;
  const r = await post(`/api/admin/orders/${id}/status`, { status });
  if (r?.ok) {
    const msg = document.getElementById('status-msg');
    msg.style.display = 'block';
    setTimeout(() => msg.style.display = 'none', 2500);
  }
}

// ── Customers list ────────────────────────────────────────────────────────────
async function showCustomers() {
  setTitle('Customers');
  const customers = await api('/api/admin/customers');
  if (!customers) return;

  const rows = customers.map(c => {
    const tags = c.tags.map(t => `<span class="tag" style="font-size:11px;padding:2px 8px">${esc(t)}</span>`).join('');
    const acctBadge = c.has_account
      ? '<span title="Has account" style="display:inline-block;font-size:10px;background:#dbeafe;color:#1e40af;padding:1px 7px;border-radius:4px;font-weight:600;margin-left:6px">ACCOUNT</span>'
      : '';
    return `
    <tr>
      <td><button class="link" onclick="go('/admin/customers/${encodeURIComponent(c.email)}')">${esc(c.email)}${acctBadge}${c.display_name ? ` <span style="color:#94a3b8;font-weight:400">(${esc(c.display_name)})</span>` : ''}</button></td>
      <td>${c.order_count}</td>
      <td>${fmtCAD(c.total_spent)}</td>
      <td>${fmtDate(c.last_order)}</td>
      <td>${tags || '<span style="color:#94a3b8;font-size:12px">—</span>'}</td>
      <td>
        <button class="link" onclick="go('/admin/customers/${encodeURIComponent(c.email)}')">View</button>
        &nbsp;<button class="btn-ghost" onclick="deleteCustomer('${encodeURIComponent(c.email)}')">Delete</button>
      </td>
    </tr>`;
  }).join('');

  setMain(`
    <div class="page-header">
      <div class="page-title">Customers</div>
      <div style="display:flex;gap:8px">
        <a class="btn btn-outline btn-sm" href="/api/admin/customers/export.csv" style="text-decoration:none">Export CSV</a>
        <button class="btn btn-primary btn-sm" onclick="toggleAddCustomer()">+ Add Customer</button>
      </div>
    </div>
    <div class="card" id="add-customer-card" style="display:none;margin-bottom:16px">
      <div class="card-header"><div class="card-title">Add Customer</div></div>
      <div style="padding:20px">
        <div class="form-row" style="margin-bottom:0">
          <div class="field"><label>Email</label><input id="new-cust-email" type="email" placeholder="customer@example.com"></div>
          <div class="field"><label>Name (optional)</label><input id="new-cust-name" type="text" placeholder="Margaret Tremblay"></div>
          <button class="btn btn-primary" onclick="addCustomer()">Add</button>
        </div>
      </div>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>Email</th><th>Orders</th><th>Spent</th><th>Last Order</th><th>Tags</th><th></th></tr></thead>
        <tbody>${rows || '<tr><td colspan="6" class="empty">No customers yet.</td></tr>'}</tbody>
      </table>
    </div>`);
}

function toggleAddCustomer() {
  const card = document.getElementById('add-customer-card');
  card.style.display = card.style.display === 'none' ? 'block' : 'none';
}

async function addCustomer() {
  const email = document.getElementById('new-cust-email').value.trim();
  const name  = document.getElementById('new-cust-name').value.trim();
  if (!email) return;
  const r = await post('/api/admin/customers', { email, display_name: name });
  if (r?.ok) showCustomers();
  else alert('Could not add customer. Check the email format.');
}

async function deleteCustomer(encodedEmail) {
  if (!confirm('Move this customer and all their orders to Trash? You can restore them later.')) return;
  await del(`/api/admin/customers/${encodedEmail}`);
  go('/admin/customers');
}

function updateAcctStrength() {
  const pwd = document.getElementById('acct-new-pwd')?.value || '';
  let score = 0;
  if (pwd.length >= 8)  score++;
  if (pwd.length >= 12) score++;
  if (/[A-Za-z]/.test(pwd) && /[0-9]/.test(pwd)) score++;
  if (/[!@#$%^&*()\-_=+[\]{}|;:,.<>?]/.test(pwd)) score++;
  const colors = ['#ef4444','#f97316','#eab308','#22c55e'];
  const labels = ['Too weak','Weak','Fair','Strong','Very strong'];
  const fill = document.getElementById('acct-pwd-fill');
  const lbl  = document.getElementById('acct-pwd-lbl');
  if (!fill || !lbl) return;
  fill.style.width = pwd.length === 0 ? '0' : Math.max(20, score * 25) + '%';
  fill.style.background = pwd.length === 0 ? '#94a3b8' : colors[Math.min(score, 3)];
  lbl.textContent = pwd.length === 0 ? '' : labels[Math.min(score, 4)];
  lbl.style.color = pwd.length === 0 ? '#94a3b8' : colors[Math.min(score, 3)];
}

async function resetCustomerPassword(encodedEmail) {
  const pwd = document.getElementById('acct-new-pwd').value;

  if (!pwd) { msg.style.color = '#dc2626'; msg.textContent = 'Enter a new password.'; return; }
  const r = await post(`/api/admin/customers/${encodedEmail}/reset-password`, { new_password: pwd });
  if (r?.ok) {
    msg.style.color = '#16a34a';
    msg.textContent = '✓ Password updated. Share it with the customer through a secure channel.';
    document.getElementById('acct-new-pwd').value = '';
    updateAcctStrength();
  } else {
    msg.style.color = '#dc2626';
    msg.textContent = r?.error || 'Error updating password.';
  }
}

function formatOccasionDate(mmdd) {
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const [mm, dd] = (mmdd || '').split('-').map(Number);
  if (!mm || !dd) return mmdd || '—';
  return `${monthNames[mm-1]} ${dd}`;
}

async function addOccasion(encodedEmail) {

  const occasion_date      = document.getElementById('occ-date').value.trim();

  if (!occasion_name) return alert('Occasion name is required.');
  if (!/^\d{2}-\d{2}$/.test(occasion_date)) return alert('Date must be in MM-DD format, e.g. 06-15.');
  const r = await post(`/api/admin/customers/${encodedEmail}/occasions`, { occasion_name, occasion_date, remind_days_before });
  if (r?.ok) showCustomer(decodeURIComponent(encodedEmail));
  else alert('Error: ' + (r?.error || 'could not add occasion'));
}

  await del(`/api/admin/occasions/${id}`);

function loadBroadcastTemplate() {
  const sel = document.getElementById('bc-template');
  const opt = sel.options[sel.selectedIndex];
  if (!opt.value) return;
  const subject = opt.getAttribute('data-subject') || '';
  const body    = opt.getAttribute('data-body') || '';
  document.getElementById('bc-subject').value = subject.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');
  document.getElementById('bc-body').value    = body.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');
}

function toggleSaveTemplate() {
  const f = document.getElementById('save-tmpl-form');
  f.style.display = f.style.display === 'none' ? 'block' : 'none';
}

async function saveAsTemplate() {
  const name    = document.getElementById('tmpl-name').value.trim();
  const subject = document.getElementById('bc-subject').value.trim();
  const body    = document.getElementById('bc-body').value.trim();
  if (!name) return alert('Template name is required.');
  if (!subject || !body) return alert('Subject and body are required.');
  const r = await post('/api/admin/templates', { name, subject, body });
  if (r?.ok) { toggleSaveTemplate(); document.getElementById('tmpl-name').value = ''; alert('Template saved.'); }
  else alert('Error: ' + (r?.error || 'could not save'));
}

async function previewBroadcast() {
  const tag = document.getElementById('bc-tag').value;
  const r = await api('/api/admin/broadcast/preview' + (tag ? '?tag=' + encodeURIComponent(tag) : ''));
  document.getElementById('bc-count').textContent = r ? `Will send to ${r.count} ${r.count === 1 ? 'customer' : 'customers'}.` : '';
}

async function sendBroadcast() {
  const tag     = document.getElementById('bc-tag').value;
  const subject = document.getElementById('bc-subject').value.trim();
  const body    = document.getElementById('bc-body').value.trim();
  if (!subject || !body) return alert('Subject and message body are required.');
  if (!confirm('Send this broadcast? This cannot be undone.')) return;
  const r = await post('/api/admin/broadcast', { subject, body, tag: tag || null });
  const s = document.getElementById('bc-status');
  if (r?.ok) {
    s.style.color = '#16a34a';
    s.textContent = `Queued ${r.sentTo} emails — sending in background.`;
  } else {
    s.style.color = '#dc2626';
    s.textContent = 'Failed: ' + (r?.error || 'unknown error');
  }
  s.style.display = 'inline';
}

const FLAG_EMOJI = cc => {
  if (!cc || cc.length !== 2) return '🌐';
  const A = 0x1F1E6, base = 'A'.charCodeAt(0);
  return String.fromCodePoint(A + cc.toUpperCase().charCodeAt(0) - base) +
         String.fromCodePoint(A + cc.toUpperCase().charCodeAt(1) - base);
};

let visitorsCFDays = 7;

async function showVisitors(cfDays) {
  if (cfDays !== undefined) visitorsCFDays = cfDays;
  setTitle('Visitors');

  const [cf, dbStats, recent] = await Promise.all([
    api(`/api/admin/cloudflare/analytics?days=${visitorsCFDays}`),
    api('/api/admin/visitors/stats'),
    api('/api/admin/visitors/recent?limit=50'),
  ]);
  renderVisitors(cf, dbStats, recent || []);

function renderVisitors(cf, s, recent) {
  const fmtBytes = b => b > 1073741824 ? (b/1073741824).toFixed(1)+' GB' : b > 1048576 ? (b/1048576).toFixed(1)+' MB' : Math.round(b/1024)+' KB';

  // ── Cloudflare section ────────────────────────────────────────────────────
  let cfHtml = '';
  if (!cf || cf.configured === false) {
    cfHtml = `<div class="card" style="margin-bottom:24px;padding:20px 24px;color:#64748b;font-size:13px">
      <strong>Cloudflare Analytics</strong> — not configured. Add <code>CF_API_TOKEN</code> and <code>CF_ZONE_ID</code> to your .env and restart.</div>`;
  } else if (cf.error) {
    cfHtml = `<div class="card" style="margin-bottom:24px;padding:20px 24px;color:#dc2626;font-size:13px">
      Cloudflare error: ${esc(cf.error)}</div>`;
  } else {
    const t = cf.totals;
    const cachedPct = t.requests > 0 ? Math.round((t.cachedRequests / t.requests) * 100) : 0;
    const maxCF = Math.max(1, ...(cf.daily || []).map(d => d.sum?.requests || 0));
    const cfBars = (cf.daily || []).map(d => {
      const req = d.sum?.requests || 0;
      const pv  = d.sum?.pageViews || 0;
      const h   = Math.max(4, Math.round((req / maxCF) * 110));
      const pvH = Math.max(0, Math.round((pv / maxCF) * 110));
      const label = (d.dimensions?.date || '').slice(5);
      return `<div style="display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;min-width:0"
          title="${d.dimensions?.date}: ${req.toLocaleString()} requests · ${pv.toLocaleString()} page views · ${(d.uniq?.uniques||0).toLocaleString()} unique">
        <div style="width:100%;height:${h}px;background:#bfdbfe;border-radius:2px 2px 0 0;min-height:4px;position:relative">
          <div style="position:absolute;bottom:0;left:0;right:0;height:${pvH}px;background:#2563eb;border-radius:2px 2px 0 0"></div>
        </div>
        <span style="font-size:9px;color:#94a3b8">${esc(label)}</span>
      </div>`;
    }).join('') || '<div class="empty" style="padding:20px;width:100%">No data.</div>';

    const periodBtns = [7, 14, 30].map(d =>
      `<button class="filter-btn ${visitorsCFDays===d?'active':''}" onclick="showVisitors(${d})">${d}d</button>`
    ).join('');

    cfHtml = `
    <div class="card" style="margin-bottom:24px">
      <div class="card-header">
        <div class="card-title">Cloudflare — Last ${cf.days} Days <span style="font-size:11px;color:#94a3b8;font-weight:400;margin-left:8px">█ requests &nbsp; █ page views</span></div>
        <div style="display:flex;gap:6px">${periodBtns}</div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:0;border-bottom:1px solid #f1f5f9">
        <div style="padding:14px 20px;border-right:1px solid #f1f5f9">
          <div style="font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px">Requests</div>
          <div style="font-size:22px;font-weight:700;color:#0f172a">${t.requests.toLocaleString()}</div>
        </div>
        <div style="padding:14px 20px;border-right:1px solid #f1f5f9">
          <div style="font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px">Page Views</div>
          <div style="font-size:22px;font-weight:700;color:#0f172a">${t.pageViews.toLocaleString()}</div>
        </div>
        <div style="padding:14px 20px;border-right:1px solid #f1f5f9">
          <div style="font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px">Unique Visitors</div>
          <div style="font-size:22px;font-weight:700;color:#0f172a">${t.uniques.toLocaleString()}</div>
        </div>
        <div style="padding:14px 20px;border-right:1px solid #f1f5f9">
          <div style="font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px">Bandwidth</div>
          <div style="font-size:22px;font-weight:700;color:#0f172a">${fmtBytes(t.bytes)}</div>
          <div style="font-size:11px;color:#94a3b8;margin-top:2px">${cachedPct}% cached</div>
        </div>
        <div style="padding:14px 20px">
          <div style="font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px">Threats Blocked</div>
          <div style="font-size:22px;font-weight:700;color:${t.threats > 0 ? '#dc2626' : '#16a34a'}">${t.threats.toLocaleString()}</div>
        </div>
      </div>
      <div style="padding:16px 20px">
        <div style="display:flex;align-items:flex-end;gap:3px;height:130px">${cfBars}</div>
      </div>
    </div>`;
  }

  // ── App-level page detail (from our DB) ───────────────────────────────────
  let dbHtml = '';
  if (s) {
    const topPagesRows = (s.topPages || []).map(p =>
      `<tr><td style="font-family:monospace;font-size:12px">${esc(p.path)}</td><td style="text-align:right">${p.count}</td></tr>`
    ).join('') || '<tr><td colspan="2" class="empty">No page data yet.</td></tr>';

    const topCountriesRows = (s.topCountries || []).map(c =>
      `<tr><td>${FLAG_EMOJI(c.country_code)} ${esc(c.country_name || c.country_code)}</td><td style="text-align:right">${c.count}</td></tr>`
    ).join('') || '<tr><td colspan="2" class="empty">No country data yet.</td></tr>';

    const totalDevices = (s.devices || []).reduce((sum, d) => sum + d.count, 0) || 1;
    const deviceRows = (s.devices || []).map(d => {
      const pct = Math.round((d.count / totalDevices) * 100);
      return `<tr><td style="text-transform:capitalize">${esc(d.device_type || 'unknown')}</td><td style="text-align:right">${d.count} <span style="color:#94a3b8">(${pct}%)</span></td></tr>`;
    }).join('') || '<tr><td colspan="2" class="empty">—</td></tr>';

    const browserRows = (s.browsers || []).map(b =>
      `<tr><td>${esc(b.browser)}</td><td style="text-align:right">${b.count}</td></tr>`
    ).join('') || '<tr><td colspan="2" class="empty">—</td></tr>';

    const referrerRows = (s.referrers || []).map(r =>
      `<tr><td style="font-family:monospace;font-size:12px">${esc(r.referrer)}</td><td style="text-align:right">${r.count}</td></tr>`
    ).join('') || '<tr><td colspan="2" class="empty">No referrers yet.</td></tr>';

    const recentRows = (recent || []).map(r => `
      <tr>
        <td style="white-space:nowrap;font-size:12px">${fmtDateTime(r.created_at)}</td>
        <td>${r.country_code ? FLAG_EMOJI(r.country_code) + ' ' + esc(r.country_name || r.country_code) : '<span style="color:#94a3b8">—</span>'}</td>
        <td style="font-family:monospace;font-size:11px;color:#64748b">${esc(r.ip || '')}</td>
        <td style="font-family:monospace;font-size:11px">${esc(r.path)}</td>
        <td style="text-transform:capitalize">${esc(r.device_type || '')}</td>
        <td>${esc(r.browser || '')}</td>
        <td style="font-size:11px;color:#64748b">${esc(r.referrer || '')}</td>
      </tr>`).join('') || '<tr><td colspan="7" class="empty">No app-level sessions recorded yet — will populate after deployment.</td></tr>';

    dbHtml = `
    <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:#94a3b8;margin-bottom:12px">App-level detail (30 days · ${s.total} total logged)</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px">
      <div class="card">
        <div class="card-header"><div class="card-title">Top Pages</div></div>
        <table><thead><tr><th>Path</th><th style="text-align:right">Views</th></tr></thead>
          <tbody>${topPagesRows}</tbody></table>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">Top Countries</div></div>
        <table><thead><tr><th>Country</th><th style="text-align:right">Views</th></tr></thead>
          <tbody>${topCountriesRows}</tbody></table>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-bottom:20px">
      <div class="card">
        <div class="card-header"><div class="card-title">Devices</div></div>
        <table><thead><tr><th>Type</th><th style="text-align:right">Views</th></tr></thead>
          <tbody>${deviceRows}</tbody></table>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">Browsers</div></div>
        <table><thead><tr><th>Browser</th><th style="text-align:right">Views</th></tr></thead>
          <tbody>${browserRows}</tbody></table>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">Referrers</div></div>
        <table><thead><tr><th>Source</th><th style="text-align:right">Views</th></tr></thead>
          <tbody>${referrerRows}</tbody></table>
      </div>
    </div>
    <div class="card">
      <div class="card-header">
        <div class="card-title">Recent Sessions</div>
        <button class="btn btn-outline btn-sm" onclick="showVisitors()">Refresh</button>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Time</th><th>Country</th><th>IP</th><th>Page</th><th>Device</th><th>Browser</th><th>Referrer</th></tr></thead>
          <tbody>${recentRows}</tbody>
        </table>
      </div>
    </div>`;
  }

  setMain(`
    <div class="page-header">
      <div class="page-title">Visitors</div>
    </div>
    ${cfHtml}
    ${dbHtml}
  `);
}

async function showTemplates() {
  setTitle('Email Templates');
  const templates = await api('/api/admin/templates');
  if (templates === null) return;

  const rows = (templates||[]).map(t => `
    <tr>
      <td>${esc(t.name)}</td>
      <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.subject)}</td>
      <td>${fmtDate(t.created_at)}</td>
      <td><button class="btn-ghost" onclick="deleteTemplate(${t.id})">Delete</button></td>
    </tr>`).join('');

  setMain(`
    <div class="page-header"><div class="page-title">Email Templates</div></div>
    <div class="card" style="margin-bottom:24px;max-width:720px">
      <div class="card-header"><div class="card-title">New Template</div></div>
      <div style="padding:20px">
        <div class="field" style="margin-bottom:12px"><label>Name</label><input id="tmpl-new-name" type="text" placeholder="e.g. Holiday greeting"></div>
        <div class="field" style="margin-bottom:12px"><label>Subject</label><input id="tmpl-new-subject" type="text" placeholder="Email subject line"></div>
        <div class="field" style="margin-bottom:12px"><label>Body</label><textarea id="tmpl-new-body" rows="8" placeholder="Email body…"></textarea></div>
        <button class="btn btn-primary btn-sm" onclick="createTemplate()">Save Template</button>
        <span id="tmpl-save-msg" style="font-size:12px;color:#16a34a;margin-left:12px;display:none">✓ Saved</span>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">Saved Templates</div></div>
      <table>
        <thead><tr><th>Name</th><th>Subject</th><th>Created</th><th></th></tr></thead>
        <tbody>${rows||'<tr><td colspan="4" class="empty">No templates yet.</td></tr>'}</tbody>
      </table>
    </div>`);
}

async function createTemplate() {
  const name    = document.getElementById('tmpl-new-name').value.trim();
  const subject = document.getElementById('tmpl-new-subject').value.trim();
  const body    = document.getElementById('tmpl-new-body').value.trim();
  if (!name || !subject || !body) return alert('Name, subject, and body are all required.');
  const r = await post('/api/admin/templates', { name, subject, body });
  if (r?.ok) {
    ['tmpl-new-name','tmpl-new-subject','tmpl-new-body'].forEach(id => document.getElementById(id).value = '');
    const msg = document.getElementById('tmpl-save-msg');
    msg.style.display = 'inline';
    setTimeout(() => { msg.style.display = 'none'; showTemplates(); }, 1200);
  } else alert('Error: ' + (r?.error || 'could not save'));
}

async function deleteTemplate(id) {
  if (!confirm('Delete this template?')) return;
  await del(`/api/admin/templates/${id}`);
  showTemplates();
}

function addBlockedCountry() {
  const sel = document.getElementById('block-country-select');
  const code = sel.value;
  if (!code) return;
  if (!window._blockedCountries) window._blockedCountries = [];
  if (window._blockedCountries.includes(code)) return;
  window._blockedCountries.push(code);
  sel.value = '';
  renderBlockedChips();
}

function removeBlockedCountry(code) {
  window._blockedCountries = (window._blockedCountries || []).filter(c => c !== code);
  renderBlockedChips();
}

function renderBlockedChips() {
  const el = document.getElementById('blocked-chips');
  if (!el) return;
  const blocked = window._blockedCountries || [];
  el.innerHTML = blocked.length
    ? blocked.map(code => `
        <span style="display:inline-flex;align-items:center;gap:5px;background:#fee2e2;color:#991b1b;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;margin:3px">
          ${esc(COUNTRIES[code] || code)} (${code})
          <button onclick="removeBlockedCountry('${code}')" style="background:none;border:none;cursor:pointer;color:#991b1b;font-size:14px;line-height:1;padding:0">×</button>
        </span>`).join('')
    : '<span style="font-size:12px;color:#94a3b8">No countries blocked.</span>';
}

async function saveAllSettings() {
  const announcement = document.getElementById('setting-announcement')?.value || '';
  const priceDom     = parseInt(document.getElementById('setting-price-dom')?.value) || 1000;
  const priceIntl    = parseInt(document.getElementById('setting-price-intl')?.value) || 2000;
  const dailyCap     = parseInt(document.getElementById('setting-daily-cap')?.value) || 0;
  const blocked      = JSON.stringify(window._blockedCountries || []);

  const r = await post('/api/admin/settings/batch', {
    announcement,
    price_domestic_cents:      String(priceDom),
    price_international_cents: String(priceIntl),
    daily_order_cap:           String(dailyCap),
    blocked_countries:         blocked,
  });
  const msg = document.getElementById('settings-saved-msg');
  if (r?.ok && msg) {
    msg.style.display = 'inline';
    setTimeout(() => { msg.style.display = 'none'; }, 2500);
  } else alert('Error saving: ' + (r?.error || 'unknown'));
}

async function saveSetting(key, value) {
  return post('/api/admin/settings', { key, value: String(value) });
}

async function toggleServicePause(currentlyPaused) {
  const newVal = !currentlyPaused;
  const r = await saveSetting('service_paused', newVal ? 'true' : 'false');
  if (r?.ok) showSettings();
  else alert('Error saving setting.');
}

async function toggleAwayMode(currentlyOn) {
  const r = await saveSetting('away_mode', currentlyOn ? 'false' : 'true');
  if (r?.ok) showSettings();
  else alert('Error saving setting.');
}

async function saveAwaySettings() {
  const msg = document.getElementById('away-message')?.value || '';
  const r = await saveSetting('away_message', msg);
  const el = document.getElementById('away-saved-msg');
  if (r?.ok && el) {
    el.style.display = 'inline';
    setTimeout(() => { el.style.display = 'none'; }, 2500);
  } else alert('Error saving: ' + (r?.error || 'unknown'));
}

async function runBackupNow() {
  const btn = document.getElementById('backup-now-btn');
  const msg = document.getElementById('backup-status');
  if (btn) { btn.disabled = true; btn.textContent = 'Running…'; }
  const r = await post('/api/admin/backups/run', {});
  if (btn) { btn.disabled = false; btn.textContent = 'Backup Now'; }
  if (r?.ok) {
    if (msg) { msg.style.color = '#16a34a'; msg.textContent = `✓ Backup created: ${r.filename}`; }
    setTimeout(() => showSettings(), 800);
  } else {
    if (msg) { msg.style.color = '#dc2626'; msg.textContent = `Error: ${r?.error || 'unknown'}`; }
  }
}

function fmtBytes(bytes) {
  if (bytes < 1024)        return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

// ── Trash ─────────────────────────────────────────────────────────────────────
async function showTrash() {
  setTitle('Trash');
  const t = await api('/api/admin/trash');
  if (!t) return;

  const custRows = t.customers.map(c => `
    <tr>
      <td>${esc(c.email)}${c.display_name ? ` <span style="color:#94a3b8">(${esc(c.display_name)})</span>` : ''}</td>
      <td>${fmtDate(c.deleted_at)}</td>
      <td><button class="link" onclick="restoreCustomer('${encodeURIComponent(c.email)}')">Restore</button></td>
    </tr>`).join('');

  const orderRows = t.orders.map(o => `
    <tr>
      <td>#${o.id}</td>
      <td>${fmtDate(o.created_at)}</td>
      <td>${esc(o.recipient_name)}</td>
      <td>${o.destination_country || '—'}</td>
      <td>${statusBadge(o.status)}</td>
      <td>${fmtCAD(o.price_cents)}</td>
      <td>${fmtDate(o.deleted_at)}</td>
      <td><button class="link" onclick="restoreOrder(${o.id})">Restore</button></td>
    </tr>`).join('');

  setMain(`
    <div class="page-header"><div class="page-title">Trash</div></div>
    <p style="color:#64748b;font-size:13px;margin-bottom:20px">Soft-deleted records. Restore them to bring back to active.</p>
    <div class="card" style="margin-bottom:24px">
      <div class="card-header"><div class="card-title">Deleted Customers</div></div>
      <table>
        <thead><tr><th>Email</th><th>Deleted</th><th></th></tr></thead>
        <tbody>${custRows || '<tr><td colspan="3" class="empty">No deleted customers.</td></tr>'}</tbody>
      </table>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">Deleted Orders</div></div>
      <table>
        <thead><tr><th>#</th><th>Created</th><th>Recipient</th><th>Country</th><th>Status</th><th>Price</th><th>Deleted</th><th></th></tr></thead>
        <tbody>${orderRows || '<tr><td colspan="8" class="empty">No deleted orders.</td></tr>'}</tbody>
      </table>
    </div>`);
}

async function restoreCustomer(encodedEmail) {
  await post(`/api/admin/customers/${encodedEmail}/restore`);
  showTrash();
}

async function restoreOrder(id) {
  await post(`/api/admin/orders/${id}/restore`);
  showTrash();
}

async function deleteOrder(id) {
  if (!confirm('Move this order to Trash? You can restore it later.')) return;
  await del(`/api/admin/orders/${id}`);
  go('/admin/orders');
}

function toggleAdminTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('lh-admin-theme', next); } catch {}
}

// ── Stripe ────────────────────────────────────────────────────────────────────
async function showStripe() {
  setTitle('Stripe');
  setMain('<div class="empty">Loading…</div>');
  const [overview, payouts, disputes, revenue] = await Promise.all([
    api('/api/admin/stripe/overview'),
    api('/api/admin/stripe/payouts'),
    api('/api/admin/stripe/disputes'),
    api('/api/admin/stripe/revenue?days=30'),
  ]);
  if (!overview) return setMain('<div class="empty">Could not load Stripe data. Check STRIPE_SECRET_KEY.</div>');

  const fmtAmt = (amt, cur) => '$' + (amt/100).toFixed(2) + ' ' + (cur||'CAD').toUpperCase();

  const payoutStatusHTML = s => {
    const m = { paid:'#16a34a', pending:'#d97706', failed:'#dc2626', in_transit:'#2563eb' };
    return `<span style="color:${m[s]||'#64748b'};font-weight:600;text-transform:capitalize">${(s||'').replace(/_/g,' ')}</span>`;
  };

  const maxRev = Math.max(1, ...(revenue?.daily||[]).map(d => d.amount));
  const revBars = (revenue?.daily||[]).map(d => {
    const h = Math.max(4, Math.round((d.amount / maxRev) * 110));
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;min-width:0"
        title="${d.date}: ${fmtAmt(d.amount,'CAD')} · ${d.count} orders">
      <div style="width:100%;height:${h}px;background:#16a34a;border-radius:2px 2px 0 0;min-height:4px"></div>
      <span style="font-size:9px;color:#94a3b8">${esc(d.date.slice(5))}</span>
    </div>`;
  }).join('') || '<div class="empty" style="padding:20px;width:100%">No charges yet.</div>';

  const payoutRows = (payouts||[]).map(p => `
    <tr>
      <td>${new Date(p.created*1000).toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'})}</td>
      <td>${fmtAmt(p.amount, p.currency)}</td>
      <td>${payoutStatusHTML(p.status)}</td>
      <td>${p.arrival_date ? new Date(p.arrival_date*1000).toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'}) : '—'}</td>
      <td style="font-family:monospace;font-size:11px;color:#94a3b8">${esc(p.id)}</td>
    </tr>`).join('') || '<tr><td colspan="5" class="empty">No payouts yet.</td></tr>';

  const disputeColor = s => ({needs_response:'#dc2626',under_review:'#d97706',won:'#16a34a',lost:'#7c3aed'}[s]||'#64748b');

  const disputeRows = (disputes||[]).map(d => `
    <tr>
      <td>${new Date(d.created*1000).toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'})}</td>
      <td>${fmtAmt(d.amount, d.currency)}</td>
      <td><span style="color:${disputeColor(d.status)};font-weight:600;text-transform:capitalize">${esc((d.status||'').replace(/_/g,' '))}</span></td>
      <td style="text-transform:capitalize">${esc((d.reason||'—').replace(/_/g,' '))}</td>
      <td><a href="https://dashboard.stripe.com/disputes/${esc(d.id)}" target="_blank" rel="noopener" class="link">View ↗</a></td>
    </tr>`).join('') || '<tr><td colspan="5" class="empty" style="color:#16a34a">No disputes — all clear!</td></tr>';

  const lp = overview.lastPayout;
  setMain(`
    <div class="page-header">
      <div class="page-title">Stripe</div>
      <a href="https://dashboard.stripe.com" target="_blank" rel="noopener" class="btn btn-outline btn-sm">Open Stripe ↗</a>
    </div>
    <div class="stats-grid" style="grid-template-columns:repeat(4,1fr)">
      <div class="stat-card">
        <div class="stat-label">Available Balance</div>
        <div class="stat-value" style="color:#16a34a">${fmtAmt(overview.available, overview.currency)}</div>
        <div class="stat-sub">ready to pay out</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pending Balance</div>
        <div class="stat-value">${fmtAmt(overview.pending, overview.currency)}</div>
        <div class="stat-sub">in transit</div>
      </div>
      <div class="stat-card" ${overview.openDisputeCount > 0 ? 'style="border-left:3px solid #dc2626"' : ''}>
        <div class="stat-label">Open Disputes</div>
        <div class="stat-value" style="color:${overview.openDisputeCount > 0 ? '#dc2626' : '#16a34a'}">${overview.openDisputeCount}</div>
        <div class="stat-sub">${overview.openDisputeCount > 0 ? '⚠ needs action' : 'all clear'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Last Payout</div>
        ${lp ? `<div class="stat-value" style="font-size:18px">${fmtAmt(lp.amount,lp.currency)}</div><div class="stat-sub">${new Date(lp.arrival_date*1000).toLocaleDateString('en-CA',{month:'short',day:'numeric'})} · ${payoutStatusHTML(lp.status)}</div>` : `<div class="stat-value" style="font-size:18px;color:#94a3b8">—</div><div class="stat-sub">no payouts yet</div>`}
      </div>
    </div>
    <div class="card" style="margin-bottom:24px">
      <div class="card-header">
        <div class="card-title">Revenue — Last 30 Days (from Stripe)</div>
        <div style="font-size:12px;color:#64748b">${revenue ? fmtAmt(revenue.total,'CAD') + ' total' : ''}</div>
      </div>
      <div style="padding:16px 20px"><div style="display:flex;align-items:flex-end;gap:3px;height:140px">${revBars}</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
      <div class="card">
        <div class="card-header"><div class="card-title">Recent Payouts</div></div>
        <table><thead><tr><th>Date</th><th>Amount</th><th>Status</th><th>Arrival</th><th>ID</th></tr></thead>
        <tbody>${payoutRows}</tbody></table>
      </div>
      <div class="card">
        <div class="card-header">
          <div class="card-title">Disputes ${overview.openDisputeCount > 0 ? `<span style="background:#dc2626;color:#fff;border-radius:999px;padding:1px 8px;font-size:10px;margin-left:6px">${overview.openDisputeCount} open</span>` : ''}</div>
        </div>
        <table><thead><tr><th>Date</th><th>Amount</th><th>Status</th><th>Reason</th><th></th></tr></thead>
        <tbody>${disputeRows}</tbody></table>
      </div>
    </div>`);
}

// ── Contacts ──────────────────────────────────────────────────────────────────
async function showContacts() {
  setTitle('Contacts');
  setMain('<div class="empty">Loading…</div>');
  const [data, templates] = await Promise.all([
    api('/api/admin/contacts'),
    api('/api/admin/templates'),
  ]);
  if (!data) return;
  updateContactsBadge(data.unread);

  const tmplOpts = ['<option value="">— Load a canned reply —</option>']
    .concat((templates||[]).map(t => `<option value="${t.id}" data-subject="${esc(t.subject)}" data-body="${esc(t.body)}">${esc(t.name)}</option>`))
    .join('');

  const rows = (data.submissions||[]).map(s => {
    const preview = s.message.length > 90 ? s.message.slice(0, 90) + '…' : s.message;
    const unread = !s.read_at;
    return `
    <tr id="contact-row-${s.id}">
      <td style="white-space:nowrap;font-size:12px">${fmtDateTime(s.created_at)}</td>
      <td style="${unread ? 'font-weight:600' : ''}">${esc(s.name)} ${unread ? '<span style="background:#dc2626;color:#fff;border-radius:999px;font-size:9px;padding:1px 5px;vertical-align:middle">NEW</span>' : ''}</td>
      <td><a href="mailto:${esc(s.email)}" class="link">${esc(s.email)}</a></td>
      <td style="color:#64748b;font-size:12px;max-width:300px">${esc(preview)}</td>
      <td style="font-family:monospace;font-size:11px;color:#94a3b8">${esc(s.ip||'')}</td>
      <td style="white-space:nowrap">
        ${unread ? `<button class="btn btn-outline btn-sm" style="margin-right:4px" onclick="markContactRead(${s.id})">Mark read</button>` : `<span style="color:#94a3b8;font-size:12px">${fmtDate(s.read_at)}</span> `}
        <button class="btn-ghost" onclick="toggleContactExpand(${s.id})">View</button>
        <button class="btn-ghost" onclick="toggleContactReply(${s.id})">Reply</button>
      </td>
    </tr>
    <tr id="contact-expand-${s.id}" style="display:none">
      <td colspan="6" style="background:#f8fafc;padding:16px 20px;font-size:13px;color:#334155;white-space:pre-wrap;line-height:1.7;border-bottom:1px solid #e2e8f0">${esc(s.message)}</td>
    </tr>
    <tr id="contact-reply-${s.id}" style="display:none">
      <td colspan="6" style="background:#f0f9ff;padding:16px 20px;border-bottom:1px solid #e2e8f0">
        <div style="max-width:600px">
          <div style="margin-bottom:10px">
            <select onchange="loadContactTemplate(${s.id}, this)" style="font-size:13px;padding:6px 10px;border:1px solid #e2e8f0;border-radius:6px;background:#fff">${tmplOpts}</select>
          </div>
          <div style="margin-bottom:8px">
            <input id="reply-subject-${s.id}" type="text" placeholder="Subject" value="Re: Your Letterhome enquiry" style="width:100%;font-size:13px;padding:8px 10px;border:1px solid #e2e8f0;border-radius:6px">
          </div>
          <div style="margin-bottom:10px">
            <textarea id="reply-body-${s.id}" rows="6" placeholder="Type your reply…" style="width:100%;font-size:13px;padding:8px 10px;border:1px solid #e2e8f0;border-radius:6px;resize:vertical"></textarea>
          </div>
          <div style="display:flex;gap:8px;align-items:center">
            <button class="btn btn-primary btn-sm" onclick="sendContactReply(${s.id})">Send to ${esc(s.email)}</button>
            <button class="btn btn-outline btn-sm" onclick="toggleContactReply(${s.id})">Cancel</button>
          </div>
        </div>
      </td>
    </tr>`;
  }).join('') || '<tr><td colspan="6" class="empty">No contact submissions yet.</td></tr>';

  setMain(`
    <div class="page-header">
      <div class="page-title">Contact Submissions</div>
      ${data.unread > 0 ? `<button class="btn btn-outline btn-sm" onclick="markAllContactsRead()">Mark all read</button>` : ''}
    </div>
    <div class="card">
      <div class="card-header">
        <div class="card-title">Messages</div>
        <div style="font-size:12px;color:#64748b">${data.unread} unread · ${data.submissions.length} total</div>
      </div>
      <table>
        <thead><tr><th>Date</th><th>Name</th><th>Email</th><th>Message</th><th>IP</th><th>Status</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`);
}

function toggleContactExpand(id) {
  const row = document.getElementById('contact-expand-' + id);
  if (row) row.style.display = row.style.display === 'none' ? '' : 'none';
}

function toggleContactReply(id) {
  const row = document.getElementById('contact-reply-' + id);
  if (row) row.style.display = row.style.display === 'none' ? '' : 'none';
}

function loadContactTemplate(id, select) {
  const opt = select.options[select.selectedIndex];
  if (!opt.value) return;
  const subjectEl = document.getElementById('reply-subject-' + id);
  const bodyEl    = document.getElementById('reply-body-'    + id);
  if (subjectEl) subjectEl.value = opt.dataset.subject || '';
  if (bodyEl)    bodyEl.value    = opt.dataset.body    || '';
}

async function sendContactReply(id) {
  const subject = document.getElementById('reply-subject-' + id)?.value.trim();
  const body    = document.getElementById('reply-body-'    + id)?.value.trim();
  if (!subject || !body) return alert('Subject and body are required.');
  const r = await post(`/api/admin/contacts/${id}/reply`, { subject, body });
  if (r?.ok) {
    alert('Reply sent.');
    showContacts();
  } else {
    alert('Error: ' + (r?.error || 'could not send reply'));
  }
}

async function markContactRead(id) {
  await post(`/api/admin/contacts/${id}/read`, {});
  showContacts();
}

async function markAllContactsRead() {
  await post('/api/admin/contacts/read-all', {});
  showContacts();
}

function updateContactsBadge(unread) {
  const badge = document.getElementById('contacts-badge');
  if (!badge) return;
  if (unread > 0) { badge.textContent = unread; badge.style.display = 'inline'; }
  else { badge.style.display = 'none'; }
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

init();
</script>
