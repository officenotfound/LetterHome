plugins { id 'com.android.application' }
android {
    namespace 'ca.letterhome.admin'
    compileSdk 36
    defaultConfig {
        applicationId 'ca.letterhome.admin'
        minSdk 24
        targetSdk 36
        versionCode 14
        versionName '1.13'
    }
    signingConfigs {
        release {
            def f = new File(System.getProperty('user.home'), 'letterhome-release.properties')
            if (f.exists()) {
                def p = new Properties(); f.withInputStream { p.load(it) }
                storeFile file(p.storeFile); storePassword p.storePassword; keyAlias p.keyAlias; keyPassword p.keyPassword
            }
        }
    }
    buildTypes { release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'; signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
