plugins { id 'com.android.application' }
android {
    namespace 'ca.letterhome.admin'
    compileSdk 34
    defaultConfig {
        applicationId 'ca.letterhome.admin'
        minSdk 24
        targetSdk 34
        versionCode 10
        versionName '1.9'
    }
    signingConfigs {
        release {
            def f = new File(System.getProperty('user.home'), 'letterhome-release.properties')
            if (f.exists()) {
                def p = new Properties(); f.withInputStream { p.load(it) }
                storeFile file(p.storeFile); storePassword p.storePassword; keyAlias p.keyAlias; keyPassword p.keyPassword
            }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
