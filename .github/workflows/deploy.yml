name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to production (letterhome.ca)
    runs-on: self-hosted

    steps:
      - name: Deploy
        run: |
          cd /var/letterhome
          git pull
          npm ci --omit=dev
          pm2 reload letterhome
          pm2 show letterhome

  smoke:
    name: Smoke test
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -H "x-smoke-bypass: $SMOKE_BYPASS_TOKEN" https://letterhome.ca/health | grep -q '"status":"ok"'; then
              echo "Server is ready."; exit 0
            fi
            echo "Waiting for server… ($i/30)"; sleep 3
          done
          echo "Server did not become ready in time."; exit 1
        env:
          SMOKE_BYPASS_TOKEN: ${{ secrets.SMOKE_BYPASS_TOKEN }}

      - name: Run smoke tests
        run: npx playwright test
        env:
          SMOKE_BASE_URL: https://letterhome.ca
          SMOKE_BYPASS_TOKEN: ${{ secrets.SMOKE_BYPASS_TOKEN }}

      - name: Upload report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse audit
    needs: smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: lighthouserc.js
          uploadArtifacts: true
          temporaryPublicStorage: true
