name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read   # least privilege: these jobs only read the repo

jobs:
  deploy:
    name: Deploy to production (letterhome.ca)
    runs-on: self-hosted

    steps:
      - name: Deploy
        run: |
          cd /var/letterhome
          git pull
          npm ci --omit=dev
          pm2 reload letterhome
          pm2 show letterhome

  smoke:
    name: Smoke test
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -H "x-smoke-bypass: $SMOKE_BYPASS_TOKEN" https://letterhome.ca/health | grep -q '"status":"ok"'; then
              echo "Server is ready."; exit 0
            fi
            echo "Waiting for server… ($i/30)"; sleep 3
          done
          echo "Server did not become ready in time."; exit 1
        env:
          SMOKE_BYPASS_TOKEN: ${{ secrets.SMOKE_BYPASS_TOKEN }}

      - name: Run smoke tests
        run: node --test tests/smoke.js
        env:
          SMOKE_BASE_URL: https://letterhome.ca
          SMOKE_BYPASS_TOKEN: ${{ secrets.SMOKE_BYPASS_TOKEN }}

  lighthouse:
    name: Lighthouse audit
    needs: smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: lighthouserc.js
          uploadArtifacts: true
          temporaryPublicStorage: true
