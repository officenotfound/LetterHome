name: Smoke test (synthetic monitor)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run smoke tests
        run: node --test tests/smoke.js
        env:
          SMOKE_BASE_URL: https://letterhome.ca
          SMOKE_BYPASS_TOKEN: ${{ secrets.SMOKE_BYPASS_TOKEN }}
