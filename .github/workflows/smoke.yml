name: Smoke test (synthetic monitor)

on:
  # Scheduled runs disabled — uptime is monitored externally via UptimeRobot
  # pinging /health. Run on-demand from the Actions tab when you want to verify
  # key pages and endpoints are responding correctly after a deploy.
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run smoke tests
        run: node --test tests/smoke.js
        env:
          SMOKE_BASE_URL: https://letterhome.ca
          SMOKE_BYPASS_TOKEN: ${{ secrets.SMOKE_BYPASS_TOKEN }}
